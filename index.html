<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tests">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Test de preguntas</title>
<style>
  :root {
    --bg: #f4f6fb; --card: #fff; --text: #1a1f2e; --muted: #6b7385; --border: #e3e7ef; --grid: #edf0f5;
    --accent: #4263eb; --accent-2: #7048e8; --accent-bg: #eef2ff; --on-accent: #fff;
    --ok: #2b8a3e; --ok-bg: #ebfbee; --ko: #e03131; --ko-bg: #fff5f5; --star: #f59f00; --water: #1c7ed6; --water-bg: #e7f5ff;
    --shadow: 0 1px 2px rgba(20, 30, 60, .04), 0 4px 16px rgba(20, 30, 60, .06);
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318; --card: #1b1e26; --text: #e8eaf0; --muted: #9aa2b1; --border: #2a2f3a; --grid: #242833;
      --accent: #748ffc; --accent-2: #9775fa; --accent-bg: #222a48; --on-accent: #0f1220;
      --ok: #69db7c; --ok-bg: #15301e; --ko: #ff6b6b; --ko-bg: #3a1c1c; --star: #fcc419; --water: #4dabf7; --water-bg: #13283d;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  #start { width: 100%; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; color: var(--text); background: var(--bg);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  }
  main {
    max-width: 720px; margin: 0 auto;
    padding: calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    animation: fade .25s ease;
  }
  h1 { font-size: 1.6rem; letter-spacing: -.02em; margin: 0 0 16px; }
  h2 { font-size: 1.1rem; letter-spacing: -.01em; margin: 0 0 12px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .muted { color: var(--muted); font-size: .9rem; }

  button {
    font: inherit; cursor: pointer; border-radius: 12px; border: 1px solid var(--border); background: var(--card); color: var(--text);
    padding: 10px 16px; min-height: 44px; touch-action: manipulation; transition: transform .1s, background .15s, border-color .15s, box-shadow .15s;
  }
  button:active:not(:disabled) { transform: scale(.97); }
  button.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; color: var(--on-accent); font-weight: 600; box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 35%, transparent); }
  button.danger { color: var(--ko); }
  button.small { padding: 4px 12px; min-height: 34px; font-size: .9rem; }
  button:disabled { opacity: .45; cursor: default; }
  @media (hover: hover) {
    button:hover:not(:disabled) { border-color: var(--accent); }
    button.primary:hover:not(:disabled) { filter: brightness(1.06); }
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .between { justify-content: space-between; }

  label.opt { display: flex; gap: 10px; align-items: center; margin: 8px 0; }
  input[type=checkbox], input[type=radio] { width: 20px; height: 20px; accent-color: var(--accent); flex-shrink: 0; }
  input[type=number], input[type=text], input[type=search], select, textarea {
    font: inherit; font-size: 16px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  input[type=number] { width: 84px; }
  textarea { width: 100%; }
  .full { width: 100%; }

  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }
  .mode-card { display: block; border: 2px solid var(--border); border-radius: 14px; padding: 12px 14px; cursor: pointer; transition: border-color .15s, background .15s; }
  .mode-card input { position: absolute; opacity: 0; pointer-events: none; }
  .mode-card .t { font-weight: 700; display: block; }
  .mode-card .d { font-size: .82rem; color: var(--muted); }
  .mode-card:has(input:checked) { border-color: var(--accent); background: var(--accent-bg); }
  .sep { border: none; border-top: 1px solid var(--border); margin: 14px 0; }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .topbar > div:first-child { background: color-mix(in srgb, var(--card) 80%, transparent); padding: 4px 10px; border-radius: 99px; }
  .progress { height: 8px; background: var(--grid); border-radius: 99px; overflow: hidden; margin: 10px 0 16px; }
  .progress > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 99px; transition: width .3s ease; }
  .q { font-size: 1.2rem; font-weight: 650; line-height: 1.45; margin: 2px 0 18px; white-space: pre-wrap; }
  .options { display: grid; gap: 10px; }
  .options button { text-align: left; display: flex; gap: 12px; align-items: center; white-space: pre-wrap; padding: 12px 14px; min-height: 56px; border-width: 2px; }
  .options button .letter {
    flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    font-weight: 700; font-size: .85rem; background: var(--grid); color: var(--muted); transition: background .15s, color .15s;
  }
  .options button.sel { border-color: var(--accent); background: var(--accent-bg); }
  .options button.sel .letter { background: var(--accent); color: var(--on-accent); }
  .options button.ok { border-color: var(--ok); background: var(--ok-bg); animation: pop .3s ease; }
  .options button.ok .letter { background: var(--ok); color: var(--card); }
  .options button.ko { border-color: var(--ko); background: var(--ko-bg); animation: shake .35s ease; }
  .options button.ko .letter { background: var(--ko); color: var(--card); }
  .explain { margin-top: 16px; padding: 14px 16px; border-radius: 12px; border-left: 4px solid var(--ok); background: var(--ok-bg); white-space: pre-wrap; animation: slideup .25s ease; }
  .explain.wrong { border-left-color: var(--ko); background: var(--ko-bg); }
  .star { background: none; border: none; box-shadow: none; padding: 4px 8px; min-height: 40px; font-size: 1.4rem; line-height: 1; color: var(--muted); }
  .star.on { color: var(--star); animation: pop .3s ease; }
  .timer { font-variant-numeric: tabular-nums; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: var(--grid); font-size: .9rem; }
  .timer:empty { display: none; }
  .timer.low { color: var(--ko); background: var(--ko-bg); }
  .navgrid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
  .navgrid button { width: 40px; min-height: 40px; padding: 0; font-size: .85rem; }
  .navgrid button.done { background: var(--accent-bg); border-color: var(--accent); }
  .navgrid button.cur { outline: 2px solid var(--accent); outline-offset: 2px; }

  .score { display: flex; align-items: center; gap: 20px; margin-bottom: 16px; }
  .ring {
    --p: 0; --c: var(--accent); width: 112px; height: 112px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center;
    background: conic-gradient(var(--c) calc(var(--p) * 1%), var(--grid) 0);
  }
  .ring > div { width: 88px; height: 88px; border-radius: 50%; background: var(--card); display: grid; place-items: center; font-size: 1.5rem; font-weight: 800; }
  .big { font-size: 2rem; font-weight: 800; letter-spacing: -.02em; }
  .review { border-top: 1px solid var(--border); padding: 14px 0; }
  .error { color: var(--ko); white-space: pre-wrap; }
  .notice { border-left: 4px solid var(--accent); }

  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .kpi { background: var(--bg); border-radius: 12px; padding: 12px; }
  .kpi .v { font-size: 1.6rem; font-weight: 800; letter-spacing: -.02em; }
  .pct-row { margin: 10px 0; font-size: .92rem; } .pct-row .row { gap: 4px 8px; flex-wrap: nowrap; } .pct-row .row > span { white-space: nowrap; } .pct-row .row > span:first-child { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .pct-row .bar { margin-top: 4px; } .pct-row .bar > div { background: var(--ok); } .pct-row .bar > div.low { background: var(--star); }
  .chart { position: relative; }
  .chart svg { width: 100%; height: auto; display: block; }
  .tip { position: absolute; pointer-events: none; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: .85rem; box-shadow: var(--shadow); white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); }
  .bar-row { display: grid; grid-template-columns: minmax(80px, 30%) 1fr 90px; gap: 10px; align-items: center; margin: 10px 0; font-size: .95rem; }
  .bar { height: 10px; background: var(--grid); border-radius: 99px; overflow: hidden; }
  .bar > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 99px; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { text-align: left; padding: 8px 4px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .table-wrap { overflow-x: auto; }
  .ed-list > summary { cursor: pointer; font-weight: 600; padding: 10px 0; color: var(--accent); }
  .qitem { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; margin-bottom: 8px; }
  .qitem .txt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { font-size: .75rem; padding: 2px 10px; border-radius: 99px; background: var(--accent-bg); color: var(--accent); white-space: nowrap; font-weight: 600; }
  .optrow { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
  .optrow input[type=text] { flex: 1; min-width: 0; }

  #toasts {
    position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    width: min(440px, calc(100% - 32px)); z-index: 10; display: flex; flex-direction: column; gap: 8px;
  }
  .toast {
    display: flex; gap: 12px; align-items: center;
    background: var(--water-bg); color: var(--text); border: 1px solid color-mix(in srgb, var(--water) 40%, transparent);
    border-radius: 16px; padding: 14px 16px; box-shadow: 0 8px 30px rgba(0, 0, 0, .18); animation: toastin .4s cubic-bezier(.2, .9, .3, 1.2);
  }
  .toast.pomo { background: var(--accent-bg); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  .toast .ico { font-size: 1.8rem; animation: bob 1.6s ease-in-out infinite; }
  .toast .msg { flex: 1; }
  .toast button { background: var(--water); border-color: transparent; color: #fff; font-weight: 600; }
  .toast.pomo button { background: var(--accent); color: var(--on-accent); }

  /* Pomodoro */
  .pomo-pill {
    position: fixed; right: calc(16px + env(safe-area-inset-right)); bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 11;
    border-radius: 99px; padding: 8px 16px; font-weight: 700; font-variant-numeric: tabular-nums; box-shadow: 0 6px 20px rgba(0, 0, 0, .18);
    background: var(--card); border: 2px solid var(--accent);
  }
  .pomo-pill.break { border-color: var(--ok); }
  .pomo-panel {
    position: fixed; right: calc(16px + env(safe-area-inset-right)); bottom: calc(70px + env(safe-area-inset-bottom)); z-index: 12;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px; box-shadow: 0 8px 30px rgba(0, 0, 0, .2); animation: slideup .2s ease;
  }
  .pomo-panel .row { margin-top: 8px; }

  /* Inicio: objetivo diario y accesos rápidos */
  .countdown { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .countdown .big { font-size: 2.2rem; }
  .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .quick-btn { display: flex; flex-direction: column; align-items: flex-start; text-align: left; gap: 2px; padding: 14px; min-height: 100px; border-width: 2px; }
  .quick-btn .qi { font-size: 1.6rem; line-height: 1.2; }
  .chip { min-height: 36px; padding: 6px 14px; border-radius: 99px; font-size: .9rem; }
  .chip.on { background: color-mix(in srgb, var(--star) 22%, var(--card)); border-color: var(--star); }
  .navgrid button.doubt { border-style: dashed; border-color: var(--star); }
  .tag.doubt { background: color-mix(in srgb, var(--star) 22%, var(--card)); color: var(--text); }
  .ref { margin-top: 8px; font-weight: 600; color: var(--accent); }
  .verdict { display: inline-block; font-weight: 800; padding: 6px 14px; border-radius: 12px; margin-bottom: 12px; }
  .verdict.ok { background: var(--ok-bg); color: var(--ok); }
  .verdict.ko { background: var(--ko-bg); color: var(--ko); }
  /* Selector múltiple de bloques y temas */
  .picker { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin: 8px 0 12px; background: color-mix(in srgb, var(--bg) 50%, var(--card)); }
  .pick-sub { display: block; font-size: .8rem; color: var(--muted); line-height: 1.3; font-weight: 400; }
  .pick-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .tchip {
    display: inline-flex; align-items: center; gap: 4px; min-height: 32px; padding: 4px 12px; border-radius: 99px;
    border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: .88rem; line-height: 1.25; text-align: left;
  }
  .tchip.on { background: var(--accent-bg); border-color: var(--accent); color: var(--text); }
  .tchip .tn { font-size: .78rem; color: var(--muted); }
  .pick-sheet { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; animation: slideup .2s ease; }
  .pick-sheet-in { flex: 1; overflow-y: auto; padding: calc(16px + env(safe-area-inset-top)) 16px 16px; max-width: 720px; width: 100%; margin: 0 auto; }
  .pick-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .ptiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }
  .ptile {
    aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 4px;
    border-radius: 16px; border: 2px solid var(--border); background: var(--card); min-height: 0;
  }
  .ptile .ptc { font-size: 1.4rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
  .ptile .ptc.long { font-size: 1rem; text-align: center; line-height: 1.15; }
  .ptile .pts { font-size: .68rem; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
  .ptile .ptn { font-size: .72rem; color: var(--muted); }
  .ptile.full { background: var(--accent-bg); border-color: var(--accent); }
  .ptile.full .ptn { color: var(--accent); font-weight: 700; }
  .ptile.part { border-color: var(--accent); border-style: dashed; }
  .ptile.open { outline: 3px solid var(--accent); outline-offset: 2px; }
  .ptile-panel { grid-column: 1 / -1; background: var(--card); border: 1px solid var(--accent); border-radius: 14px; padding: 10px 12px; animation: slideup .15s ease; }
  .pick-sec { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px; margin-bottom: 10px; }
  .pick-sec-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .linkbtn { background: none; border: none; box-shadow: none; padding: 2px 4px; min-height: 0; color: var(--accent); font-size: .85rem; font-weight: 600; }
  .pick-foot {
    display: flex; justify-content: space-between; align-items: center; gap: 12px; border-top: 1px solid var(--border); background: var(--card);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  }
  .bloque-h { display: flex; justify-content: space-between; align-items: baseline; margin: 16px 0 4px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
  .dom-b { border: 1px solid var(--border); border-radius: 12px; margin: 8px 0; background: color-mix(in srgb, var(--bg) 50%, var(--card)); }
  .dom-b > summary { list-style: none; cursor: pointer; padding: 10px 12px; }
  .dom-b > summary::-webkit-details-marker { display: none; }
  .dom-b > summary .dom-t { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; margin-bottom: 6px; }
  .dom-b > summary .dom-t b::before { content: "▸ "; color: var(--muted); }
  .dom-b[open] > summary .dom-t b::before { content: "▾ "; }
  .dom-b > summary .dom-t span { white-space: nowrap; font-size: .9rem; }
  .dom-b .dom-in { padding: 0 12px 6px; border-top: 1px solid var(--border); }

  /* Calendario de actividad */
  .heat { display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; }
  .heat i { display: block; aspect-ratio: 1; border-radius: 3px; background: var(--grid); }
  .heat i.l1 { background: color-mix(in srgb, var(--accent) 30%, var(--grid)); }
  .heat i.l2 { background: color-mix(in srgb, var(--accent) 55%, var(--grid)); }
  .heat i.l3 { background: color-mix(in srgb, var(--accent) 78%, var(--grid)); }
  .heat i.l4 { background: var(--accent); }
  .heat i.today { outline: 2px solid var(--text); outline-offset: -1px; }
  .heat i.future { visibility: hidden; }
  .heat i[data-dia]:not(.future) { cursor: pointer; } .heat i.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
  .heat-info { margin: 8px 0 0; min-height: 1.4em; }
  .heat-legend { display: flex; gap: 3px; align-items: center; justify-content: flex-end; margin-top: 8px; font-size: .8rem; color: var(--muted); }
  .heat-legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

  /* Ajustes */
  .set-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 10px 0; }
  .set-row > span { flex: 1; }
  .set-row input[type=number] { width: 90px; }
  .set-row input[type=date] { font: inherit; padding: 6px 8px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  .help { font-size: .85rem; color: var(--muted); margin: 4px 0 8px; }
  /* Editor: pestañas */
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
  .tab { padding: 8px 4px; font-size: .9rem; font-weight: 600; }
  .tab.on { border-color: var(--accent); background: var(--accent-bg); }

  /* Trucos, notas y confusiones */
  .notes { margin-top: 10px; }
  .truco { margin: 6px 0; padding: 8px 12px; border-radius: 10px; background: color-mix(in srgb, var(--star) 15%, var(--card)); font-size: .95rem; }
  .truco.mine { background: var(--accent-bg); }
  .note-btn { margin-top: 4px; }
  .confusion { margin-top: 10px; padding: 10px 12px; border-radius: 10px; border-left: 4px solid var(--star); background: color-mix(in srgb, var(--star) 12%, var(--card)); }
  .recall-box { text-align: center; padding: 18px; border: 2px dashed var(--border); border-radius: 14px; }
  .recall-box p { margin-top: 0; }

  /* Flashcards */
  .flash-card { cursor: pointer; min-height: 220px; display: flex; flex-direction: column; justify-content: center; animation: flipin .3s ease; }
  .flash-card.flipped { cursor: default; }
  .flash-hint { text-align: center; margin-bottom: 0; }
  .flash-answer { font-size: 1.15rem; font-weight: 700; color: var(--ok); white-space: pre-wrap; }
  .grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .grade { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px; border-width: 2px; }
  .grade span { font-size: .75rem; color: var(--muted); }
  .grade.again { border-color: var(--ko); } .grade.hard { border-color: var(--star); }
  .grade.good { border-color: var(--ok); } .grade.easy { border-color: var(--accent); }
  @keyframes flipin { from { transform: rotateY(25deg); opacity: .4; } }

  /* Audio */
  .audio-opts { display: grid; gap: 4px; }
  .audio-opts .audio-ok { color: var(--ok); font-weight: 700; }
  .audio-ctrl { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 8px; }
  .audio-ctrl button { font-size: 1.1rem; }

  /* Verdadero / Falso */
  .vf-card { min-height: 200px; transition: transform .15s, background .2s; touch-action: pan-y; }
  .vf-card.ok { background: var(--ok-bg); border-color: var(--ok); }
  .vf-card.ko { background: var(--ko-bg); border-color: var(--ko); animation: shake .35s ease; }
  .vf-answer { font-size: 1.15rem; font-weight: 700; padding: 12px 14px; border-radius: 12px; background: var(--accent-bg); }
  .vf-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

<script>
// Entorno: desarrollo (repositorio *-dev, o en local) o producción.
// Ambos viven en el mismo dominio (github.io), así que cada uno guarda sus datos con un prefijo distinto.
const LOCAL = ['localhost', '127.0.0.1'].includes(location.hostname) || location.protocol === 'file:';
// En local se puede probar como producción con ?env=prod
const ENV = LOCAL && new URLSearchParams(location.search).get('env') === 'prod' ? 'prod'
  : /^\/[^/]+-dev\//.test(location.pathname) || LOCAL ? 'dev' : 'prod';
// Funciones ya aprobadas para producción. En desarrollo están todas activas.
// Para pasar una función a producción basta con añadirla aquí.
const PROD_FEATURES = ['flash', 'articulos', 'vf', 'recall', 'notas', 'confusion', 'cuenta']; // todas menos 'audio'
const ALL_FEATURES = ['flash', 'articulos', 'audio', 'vf', 'recall', 'notas', 'confusion', 'cuenta'];
const feat = name => ENV === 'dev' || PROD_FEATURES.includes(name);
const P = ENV === 'dev' ? 'quizdev.' : 'quiz.';
const K = Object.fromEntries(Object.entries({
  set: 'set', stats: 'stats', marks: 'marks', hist: 'history', run: 'run',
  srs: 'srs', daily: 'daily', settings: 'settings', pomo: 'pomo', water: 'waterSecs',
  theme: 'theme', photo: 'photo', gh: 'github', notes: 'notes', arts: 'articulos', vf: 'vf', dailyq: 'dailyq', dailyt: 'dailyt'
}).map(([k, v]) => [k, P + v]));
if (ENV === 'dev') {
  document.title = 'Tests (DEV)';
  document.querySelector('meta[name=apple-mobile-web-app-title]').content = 'Tests DEV';
  document.body.classList.add('env-dev');
  document.body.insertAdjacentHTML('beforeend', '<div class="env-badge" title="Entorno de desarrollo: datos separados de la app normal">🧪 DESARROLLO</div>');
}
// En desarrollo, aviso grande antes de empezar cada test: hay que aceptarlo para seguir
function devGate(go) {
  if (ENV !== 'dev') return go();
  const prodUrl = LOCAL ? '?env=prod' : location.pathname.replace(/-dev\//, '/');
  document.body.insertAdjacentHTML('beforeend', `<div class="dev-warn" id="devWarn" role="alertdialog" aria-modal="true" aria-labelledby="devWarnT"><div>
    <div class="big">🧪⚠️</div>
    <h2 id="devWarnT">VERSIÓN DE DESARROLLO</h2>
    <p><b>Esta no es la app normal.</b> Es la versión de pruebas: puede tener fallos y cambiar en cualquier momento.</p>
    <p class="muted">Tu progreso aquí se guarda aparte y no cuenta en la app normal.</p>
    <button id="devWarnOk">Entendido, empezar</button>
    <button class="small" id="devWarnNo" style="background:none;border:none;color:var(--muted);font-weight:600;margin-top:4px">Cancelar</button>
    <a href="${prodUrl}">Ir a la app normal →</a>
  </div></div>`);
  const close = () => $('devWarn').remove();
  $('devWarnOk').onclick = () => { close(); go(); };
  $('devWarnNo').onclick = close;
}
const app = document.getElementById('app');
let set = null;              // { titulo, preguntas, ajustes?, origen: 'servidor' | 'archivo' | 'editado' }
let run = null;              // test en curso (se guarda en localStorage para poder reanudar)
let serverAvailable = false; // hay un preguntas.json junto al HTML (GitHub Pages, servidor local...)
let timerId = null;

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
// viewAs: el panel admin pinta Progreso con los datos de otro usuario (solo lectura) sustituyendo los datos sincronizados
let viewAs = null;
const load = (k, d) => { if (viewAs && syncName(k)) return viewAs[k] ?? d; try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); syncTouch(k); } catch {} };
const keyOf = q => q.pregunta;
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const uniq = a => [...new Set(a.filter(Boolean))];
const natCmp = (a, b) => String(a).localeCompare(String(b), 'es', { numeric: true, sensitivity: 'base' });
const fmtTime = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const fmtDate = t => new Date(t).toLocaleString('es-ES', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
const fmtNum = (n, d = 2) => (+n).toLocaleString('es-ES', { maximumFractionDigits: d });
const $ = id => document.getElementById(id);
const DAY = 864e5;
const startOfToday = () => new Date().setHours(0, 0, 0, 0);
const todayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
// Hace n días, por calendario (restar n × 24 h falla el día del cambio de hora)
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return d; };
const MODOS = { practica: 'Práctica', examen: 'Examen', simulacro: 'Simulacro', repaso: 'Repaso' };

// ---------- Ajustes ----------
// Prioridad: valores por defecto < "ajustes" del preguntas.json (compartidos) < lo que cambie cada uno en su dispositivo
const SETTINGS_DEFAULT = {
  penaltyOn: false, penalty: 1 / 3,
  simNombre: 'Simulacro', simPreguntas: 100, simMinutos: 90, simCorte: 5, simBloque: '',
  // 2ª parte del examen oficial: 40 preguntas de todo el temario en 90 min
  sim2Nombre: '2ª parte (todo el temario)', sim2Preguntas: 40, sim2Minutos: 90, sim2Bloque: '',
  examDate: '', dailyGoal: 60, srsSize: 20,
  pomoOn: false, pomoWork: 25, pomoBreak: 5, water: true, waterMin: 20, waterMsg: '',
  autoGaps: true, extraGaps: 0
};
const SHARED = ['penaltyOn', 'penalty', 'simNombre', 'simPreguntas', 'simMinutos', 'simCorte', 'simBloque', 'sim2Nombre', 'sim2Preguntas', 'sim2Minutos', 'sim2Bloque', 'examDate', 'dailyGoal'];
// Opciones que remiten a otras ("Las respuestas a) y c)…", "Todas las anteriores…"): no se barajan

// Con sesión iniciada, el progreso se guarda también en la nube y se comparte entre dispositivos.
// Cada dato (estadísticas, repaso, actividad…) es un documento users/{uid}/{entorno}/{clave} = { v: JSON, t: fecha, g: generación }.
// - "g" sube al reiniciar o importar una copia: la versión con g mayor sustituye a la otra.
// - Con la misma g, el progreso se fusiona (no se pierde nada de ningún dispositivo) y el resto gana el más reciente.
// Configuración pública de la app web de Firebase (no es secreta: los datos los protegen las reglas de Firestore)
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDxbaAqhv5pHn8uznbPD1pqc4XDS1DSIyY",

const SYNC_KEYS = ['stats', 'srs', 'daily', 'history', 'marks', 'notes', 'settings', 'theme', 'vf', 'articulos', 'dailyq', 'dailyt'];
const SYNC_MERGE = {
  // Por pregunta, la entrada con más respuestas
  stats: (a, b) => mergeMap(a, b, (x, y) => (y.ok + y.ko) > (x.ok + x.ko) ? y : x),
  // Por pregunta, el repaso más reciente
  srs: (a, b) => mergeMap(a, b, (x, y) => ((y.t || 0) > (x.t || 0) || (!x.t && !y.t && y.due > x.due)) ? y : x),
  daily: (a, b) => mergeMap(a, b, Math.max),
  // respuestas tipo test por día: [respondidas, acertadas]; gana el dispositivo que más ha respondido ese día
  dailyq: (a, b) => mergeMap(a, b, (x, y) => y[0] > x[0] ? y : x),
  // por día y tema: { tema: [respondidas, acertadas] }; gana el dispositivo que más ha respondido ese día
  dailyt: (a, b) => mergeMap(a, b, (x, y) => Object.values(y).reduce((s, v) => s + v[0], 0) > Object.values(x).reduce((s, v) => s + v[0], 0) ? y : x),
  history: (a, b) => {
    const seen = new Set(), out = [];
    for (const h of [...(a || []), ...(b || [])].sort((x, y) => x.fecha - y.fecha)) {
      const id = h.fecha + '|' + h.total + '|' + h.aciertos;
      if (!seen.has(id)) { seen.add(id); out.push(h); }
    }
    return out;
  }
};
function mergeMap(a, b, pickFn) {
  const out = { ...(a || {}) };
  for (const [k, v] of Object.entries(b || {})) out[k] = k in out ? pickFn(out[k], v) : v;
  return out;
}

// Se llama cada vez que la app guarda algo
function syncTouch(k, bump = false) {
  const name = syncName(k);
  if (!name || !syncOn()) return;
  const m = syncMeta();
  (m.t ||= {})[name] = Date.now();
  if (bump) (m.g ||= {})[name] = (m.g[name] || 0) + 1;
  m.dirty = uniq([...(m.dirty || []), name]);
  syncMetaSave(m);
  if (fbUser) { clearTimeout(syncTimer); syncTimer = setTimeout(() => syncNow(syncMeta().dirty), 2500); }
}

// Pone de acuerdo un dato local con el de la nube. Devuelve true si ha cambiado algo en este dispositivo.
async function syncKey(name, remote) {
  const ref = fb.doc(fb.db, 'users', fbUser.uid, ENV, name);
  if (remote === undefined) { const s = await fb.getDoc(ref); remote = s.exists() ? s.data() : null; }
  const m = syncMeta(), L = localStorage.getItem(P + name), lt = m.t?.[name] || 0, lg = m.g?.[name] || 0;
  const put = (v, t, g) => fb.setDoc(ref, { v, t, g });
  const take = r => {
    if (r.v == null) localStorage.removeItem(P + name); else localStorage.setItem(P + name, r.v);
    const mm = syncMeta();
    (mm.t ||= {})[name] = r.t || 0; (mm.g ||= {})[name] = r.g || 0;
    syncMetaSave(mm);
    return true;
  };
  if (!remote) { if (L !== null) await put(L, lt, lg); return false; }
  const rg = remote.g || 0;
  if (rg > lg) return take(remote);
  if (lg > rg) { await put(L, lt, lg); return false; }   // L puede ser null: se ha reiniciado aquí
  if (L === null) return remote.v != null && take(remote);
  if (remote.v == null) { await put(L, lt, lg); return false; }
  if (SYNC_MERGE[name]) {
    let merged;
    try { merged = JSON.stringify(SYNC_MERGE[name](JSON.parse(L), JSON.parse(remote.v))); } catch { merged = L; }
    if (merged !== remote.v) await put(merged, Math.max(lt, remote.t || 0), lg);
    if (merged !== L) { localStorage.setItem(P + name, merged); return true; }
    return false;
  }
  if ((remote.t || 0) > lt) return take(remote);
  if (lt > (remote.t || 0)) await put(L, lt, lg);
  return false;
}

// Sincroniza las claves indicadas (o todas). Si llegan datos nuevos y estás en el inicio, lo actualiza.
function syncNow(keys = null) {
  if (!fbUser) return Promise.resolve();
  clearTimeout(syncTimer);
  syncBusy = (syncBusy || Promise.resolve()).then(async () => {
    if (!fbUser) return;
    syncState = { text: 'Sincronizando…' }; syncPaint();
    try {
      let changed = false;
      if (keys) {
        for (const k of uniq(keys)) changed = await syncKey(k) || changed;
      } else {
        const snap = await fb.getDocs(fb.collection(fb.db, 'users', fbUser.uid, ENV));
        const remote = Object.fromEntries(snap.docs.map(d => [d.id, d.data()]));
        // Ficha del usuario (para el panel admin): email y último uso en cada entorno
        await fb.setDoc(fb.doc(fb.db, 'users', fbUser.uid), { email: fbUser.email, seen: { [ENV]: Date.now() } }, { merge: true });
        for (const k of SYNC_KEYS) changed = await syncKey(k, remote[k] || null) || changed;
      }
      const m = syncMeta();
      m.dirty = keys ? (m.dirty || []).filter(k => !keys.includes(k)) : [];
      m.last = Date.now();
      syncMetaSave(m);
      syncState = { text: '✓ Sincronizado ' + fmtDate(m.last) };
      if (changed) { applyTheme(); if ($('goStats')) showHome(); }
    } catch (e) {
      syncState = { text: '⚠️ No se pudo sincronizar (' + (e.code || e.message) + '). Se reintentará.', error: true };
    }
    syncPaint();
  });
  return syncBusy;
}
const syncPaint = () => { const el = $('syncStatus'); if (el) { el.textContent = syncState.text; el.style.color = syncState.error ? 'var(--bad, #c0392b)' : ''; } };

function syncStart() {

  fbLoad().then(f => f.onAuthStateChanged(f.auth, u => {

    if (!fbUser) return;

    else if (syncMeta().dirty?.length) syncNow(syncMeta().dirty);
  });
}

function streakOf(d, goal) {
  const day = new Date();
  if ((d[todayKey(day)] || 0) < goal) day.setDate(day.getDate() - 1);
  let n = 0;
  while ((d[todayKey(day)] || 0) >= goal) { n++; day.setDate(day.getDate() - 1); }
  return n;
}

// ---------- Traer a la app normal el progreso hecho en desarrollo ----------
// Junta lo de desarrollo (este dispositivo + la nube, si hay sesión) y lo SUMA a lo de aquí.
// Como suma, solo se hace una vez (queda apuntado).
const DEV_P = 'quizdev.';
const DEV_IMPORT = {
  stats: (a, b) => mergeMap(a, b, (x, y) => {
    const wrong = { ...(x.wrong || {}) };
    for (const [k, n] of Object.entries(y.wrong || {})) wrong[k] = (wrong[k] || 0) + n;
    return { ok: x.ok + y.ok, ko: x.ko + y.ko, ...(Object.keys(wrong).length ? { wrong } : {}) };
  }),
  daily: (a, b) => mergeMap(a, b, (x, y) => x + y),
  history: SYNC_MERGE.history,
  srs: SYNC_MERGE.srs,
  marks: (a, b) => ({ ...(b || {}), ...(a || {}) }),
  notes: (a, b) => ({ ...(b || {}), ...(a || {}) }),
  articulos: (a, b) => ({ ...(b || {}), ...(a || {}) }),
  vf: (a, b) => ({ ...(b || {}), ...(a || {}), best: Math.max(a?.best || 0, b?.best || 0) })
};

async function devProgress() {
  const out = {};
  for (const name of Object.keys(DEV_IMPORT)) {
    try { const v = JSON.parse(localStorage.getItem(DEV_P + name)); if (v != null) out[name] = v; } catch {}
  }
  if (fbUser) {
    const snap = await fb.getDocs(fb.collection(fb.db, 'users', fbUser.uid, 'dev'));
    for (const d of snap.docs) {
      if (!DEV_IMPORT[d.id]) continue;
      let v; try { v = JSON.parse(d.data().v); } catch { continue; }
      if (v == null) continue;
      out[d.id] = d.id in out && SYNC_MERGE[d.id] ? SYNC_MERGE[d.id](out[d.id], v) : (out[d.id] ?? v);
    }
  }
  return out;
}

  const n = Object.values(dev.daily || {}).reduce((a, b) => a + b, 0), tests = (dev.history || []).length;

      : 'No hay progreso de la versión de desarrollo en este dispositivo. Si lo hiciste en otro sitio, inicia sesión con tu cuenta aquí y allí, y vuelve a probar.';

  const keyOfName = { stats: K.stats, daily: K.daily, history: K.hist, srs: K.srs, marks: K.marks, notes: K.notes, articulos: K.arts, vf: K.vf };

const fmtPen = p => PENALTIES.find(([v]) => Math.abs(v - p) < 1e-6)?.[1] || fmtNum(p, 3);
const calcNota = (ok, ko, total, pen) => total ? Math.max(0, ok - ko * pen) / total * 10 : 0;
const entryNota = h => h.nota ?? (h.total ? h.aciertos / h.total * 10 : 0);
// La nota en porcentaje del examen (un 10 es el 100 %); ya incluye lo que restan los fallos
const notaPct = n => fmtNum(n * 10, 0) + ' %';
// Previsión de nota del simulacro: cada pregunta del bloque del simulacro cuenta con su probabilidad de acierto
// (sus aciertos y fallos; las no vistas, un poco por debajo de su media) y la penalización de los fallos.
function prevision() {
  const s = getSettings(), qs = (set?.preguntas || []).filter(q => !s.simBloque || q.bloque === s.simBloque), stats = load(K.stats, {});
  let ok = 0, tot = 0;
  Object.values(stats).forEach(x => { ok += x.ok; tot += x.ok + x.ko; });
  if (!qs.length || tot < 30) return null; // con muy pocos datos no tiene sentido
  const base = ok / tot * .9, pen = s.penaltyOn ? s.penalty : 0, byTema = {};
  let sum = 0;
  qs.forEach(q => {
    const x = stats[keyOf(q)], n = x ? x.ok + x.ko : 0;
    const p = n ? (x.ok + 1) / (n + 2) : base, e = p - (1 - p) * pen;
    sum += e;
    const t = byTema[pkKey(q)] ||= { loss: 0, qs: [] };
    t.loss += 1 - e; t.qs.push(q);
  });
  const peores = Object.entries(byTema).sort((a, b) => b[1].loss - a[1].loss).slice(0, 3)
    .map(([k, t]) => ({ k, menos: t.loss / qs.length * 10, qs: t.qs }));
  const sims = load(K.hist, []).filter(h => h.modo === 'simulacro').slice(-3).map(entryNota);
  return { nota: Math.max(0, sum / qs.length * 10), peores, sims, corte: s.simCorte, bloque: s.simBloque, vistas: qs.filter(q => stats[keyOf(q)]).length, n: qs.length };
}
function previsionHTML() {
  const p = prevision();
  if (!p) return '';
  const simMedia = p.sims.length ? p.sims.reduce((a, b) => a + b, 0) / p.sims.length : null;
  return `<div class="card prev-card">
    <h2>🔮 Previsión de nota</h2>
    <div class="prev-top"><span class="prev-nota ${p.nota >= p.corte ? 'ok' : 'ko'}">${fmtNum(p.nota, 1)}</span>
      <span class="muted">en el simulacro${p.bloque ? ` de «${esc(p.bloque)}»` : ''} si fuera hoy · nota de corte ${fmtNum(p.corte)}${simMedia !== null ? `<br>Tus últimos simulacros: ${fmtNum(simMedia, 1)} de media` : ''}<br>Has visto ${p.vistas} de ${p.n} preguntas de ese bloque</span></div>
    <p style="margin:12px 0 6px"><b>Lo que más te baja la nota:</b></p>
    ${p.peores.map((t, i) => `<div class="prev-row"><span>${esc(temaName(t.k).short)}</span><span class="muted">−${fmtNum(t.menos, 2)}</span><button class="small" data-prev="${i}">Practicar</button></div>`).join('')}
    ${p.vistas < p.n * .2 ? `<p class="help" style="color:var(--ko)">⚠️ Aún has visto pocas preguntas de este bloque (${p.vistas} de ${p.n}): la previsión es muy orientativa. Haz algún test de este bloque para afinarla.</p>` : ''}

}

let cuadernoFiltro = { bloque: '', texto: '', dominadas: false, sabidas: false };
function cuadernoLista() {
  const stats = load(K.stats, {}), srs = load(K.srs, {}), sabidas = load(K.settings, {}).cuaderno || {}, f = cuadernoFiltro, t = f.texto.toLowerCase();
  return (set?.preguntas || []).filter(q => {
    const s = stats[keyOf(q)];
    if (!s?.ko) return false;
    if (!f.sabidas && sabidas[keyOf(q)]) return false;
    if (!f.dominadas && (srs[keyOf(q)]?.box || 0) >= 3) return false;
    if (f.bloque && q.bloque !== f.bloque) return false;
    return !t || [q.pregunta, q.explicacion, q.tema, ...q.opciones].some(v => (v || '').toLowerCase().includes(t));
  }).sort((a, b) => stats[keyOf(b)].ko - stats[keyOf(a)].ko);
}

// Acierto: sube de caja y vuelve a salir en 1, 3, 7, 16 o 35 días. Fallo: vuelve a la caja 0 (sale ya).
const SRS_DAYS = [0, 1, 3, 7, 16, 35];
// Nota de autoevaluación (flashcards): 0 = otra vez, 1 = difícil, 2 = bien, 3 = fácil. En el test: acierto = 2, fallo = 0.
function srsGradeBox(cur, grade) {
  return grade === 0 ? 0 : grade === 1 ? Math.max(1, cur) : Math.min(cur + grade - 1, SRS_DAYS.length - 1);
}
function srsGradeDays(cur, grade) { return grade === 1 ? 1 : SRS_DAYS[srsGradeBox(cur, grade)]; }
function srsGrade(key, grade) {
  const s = load(K.srs, {}), cur = s[key]?.box || 0;
  s[key] = { box: srsGradeBox(cur, grade), due: startOfToday() + srsGradeDays(cur, grade) * DAY, t: Date.now() };
  save(K.srs, s);
}
const srsUpdate = (q, ok) => srsGrade(keyOf(q), ok ? 2 : 0);
function srsPlan(items, key = keyOf) {
  const s = load(K.srs, {}), now = Date.now();
  const due = items.filter(x => s[key(x)] && s[key(x)].due <= now).sort((a, b) => s[key(a)].due - s[key(b)].due);
  const fresh = items.filter(x => !s[key(x)]);
  const next = Math.min(...items.map(x => s[key(x)]?.due).filter(d => d > now));
  return { due, fresh, next };
}

// ---------- Actividad diaria, racha y cuenta atrás ----------
function addDaily(n) {
  if (!n) return;
  const d = load(K.daily, {}), k = todayKey();
  d[k] = (d[k] || 0) + n;
  save(K.daily, d);
}
function streak() {
  const d = load(K.daily, {}), goal = getSettings().dailyGoal || 1, day = new Date();
  if ((d[todayKey(day)] || 0) < goal) day.setDate(day.getDate() - 1); // hoy todavía no rompe la racha
  let n = 0;
  while ((d[todayKey(day)] || 0) >= goal) { n++; day.setDate(day.getDate() - 1); }
  return n;
}
function daysLeft(date) {
  if (!date) return null;
  return Math.round((new Date(date + 'T00:00').getTime() - startOfToday()) / DAY);
}

// Migra estadísticas, marca y repaso si cambia el texto de una pregunta
function migrateKey(oldKey, newKey) {
  if (oldKey === newKey) return;
  for (const k of [K.stats, K.marks, K.srs, K.notes]) {
    const m = load(k, {});
    if (oldKey in m) { m[newKey] = m[oldKey]; delete m[oldKey]; save(k, m); }
  }
}

// ---------- Carga y validación ----------
function parseSet(data) {
  const obj = Array.isArray(data) ? {} : data;
  const preguntas = Array.isArray(data) ? data : (data.preguntas ?? []);
  const fichas = obj.fichas ?? [], articulos = obj.articulos ?? [];
  if (!Array.isArray(preguntas) || !Array.isArray(fichas) || !Array.isArray(articulos))
    throw new Error('El JSON debe tener una lista de "preguntas" (y opcionalmente "fichas" y "articulos").');
  const errs = [];
  preguntas.forEach((q, n) => {
    const p = `Pregunta ${n + 1}: `;
    if (!q.pregunta) errs.push(p + 'falta "pregunta"');
    if (!Array.isArray(q.opciones) || q.opciones.length < 2) errs.push(p + '"opciones" debe ser una lista');
    else if (!Number.isInteger(q.correcta) || q.correcta < 0 || q.correcta >= q.opciones.length) errs.push(p + '"correcta" debe ser el índice (0 a ' + (q.opciones.length - 1) + ')');
  });
  fichas.forEach((f, n) => { if (!f.anverso || !f.reverso) errs.push(`Ficha ${n + 1}: necesita "anverso" y "reverso"`); });
  articulos.forEach((a, n) => { if (!a.titulo || !a.texto) errs.push(`Artículo ${n + 1}: necesita "titulo" y "texto"`); });
  if (errs.length) throw new Error(errs.join('\n'));
  const out = { titulo: obj.titulo || 'Test', preguntas, fichas, articulos };
  if (obj.ajustes && typeof obj.ajustes === 'object') out.ajustes = pick(obj.ajustes, SHARED);
  return out;
}
const setToJSON = () => ({
  titulo: set.titulo, ...(set.ajustes ? { ajustes: set.ajustes } : {}), preguntas: set.preguntas,
  ...(fichasOf().length ? { fichas: set.fichas } : {}), ...(articulosOf().length ? { articulos: set.articulos } : {})
});

function useData(data, origen) {
  set = { ...parseSet(data), origen };
  save(K.set, set);
}

function fetchServerSet() {

// ---------- Planning «Hoy toca» ----------
// Reparte los temas elegidos entre los días de estudio que quedan hasta el examen (sin los días de repaso final).
// No guarda un calendario fijo: cada día recalcula con los temas pendientes, así que si un día no se estudia se reajusta solo.
// Se guarda en los ajustes (y se sincroniza con la cuenta).
const PLAN_DEFAULT = { on: false, keys: null, days: [1, 2, 3, 4, 5, 6], review: 7, num: 30, perDay: 0, done: [], dismissed: false };
const WEEKDAYS = ['D', 'L', 'M', 'X', 'J', 'V', 'S'];
const getPlan = () => ({ ...PLAN_DEFAULT, ...(load(K.settings, {}).plan || {}) });
const savePlan = patch => saveSettings({ plan: { ...getPlan(), ...patch } });
const temaName = key => { const [b, t] = key.split('\u0001'); return { short: temaShort(b, t), full: t || bloqueShort(b) }; };

// Temas del plan en orden (bloque y tema), cada uno con sus preguntas
function planTemas(p = getPlan()) {
  const map = new Map();
  (set?.preguntas || []).forEach(q => {
    const k = pkKey(q);
    if (p.keys && !p.keys.includes(k)) return;
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(q);
  });
  return [...map.keys()].sort(natCmp).map(key => ({ key, qs: map.get(key) }));
}

// Estado del plan para un día: qué toca, cuántos temas por día y cómo va
function planState(p = getPlan(), day = new Date()) {
  const exam = getSettings().examDate;
  const temas = planTemas(p), pending = temas.filter(t => !p.done.includes(t.key));
  const base = { temas, pending, doneN: temas.length - pending.length };
  if (!exam) return { ...base, mode: 'noexam' };
  const start = new Date(day); start.setHours(0, 0, 0, 0);
  const examDay = new Date(exam + 'T00:00');
  const studyEnd = new Date(examDay); studyEnd.setDate(studyEnd.getDate() - p.review);
  if (start >= examDay) return { ...base, mode: 'past' };
  // Días de estudio desde hoy hasta el inicio del repaso final
  const days = [];
  for (const d = new Date(start); d < studyEnd; d.setDate(d.getDate() + 1)) if (p.days.includes(d.getDay())) days.push(new Date(d));
  if (!pending.length) return { ...base, mode: 'finished', days };
  if (!days.length) return { ...base, mode: 'review', days };
  const perDay = p.perDay || Math.ceil(pending.length / days.length);
  const schedule = days.map((d, i) => ({ date: d, temas: pending.slice(i * perDay, (i + 1) * perDay) })).filter(x => x.temas.length);
  const isStudyDay = days[0].getTime() === start.getTime();
  return { ...base, mode: isStudyDay ? 'study' : 'rest', days, perDay, schedule, today: isStudyDay ? schedule[0]?.temas || [] : [],
    late: pending.length > perDay * days.length };
}

const fmtDay = d => d.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'numeric' });
const temaChips = list => list.map(t => { const n = temaName(t.key); return `<span class="tag" title="${esc(n.full)}">${esc(n.short)}</span>`; }).join(' ');

  const prog = st.temas.length ? `<div class="progress" style="margin:12px 0 6px"><div style="width:${pct(st.doneN, st.temas.length)}%"></div></div>
    <p class="muted" style="margin:0">${st.doneN} de ${st.temas.length} temas hechos</p>` : '';

  else if (st.mode === 'review' || st.mode === 'finished') body = `<p>${st.mode === 'finished' ? '🎉 Has terminado todos los temas del plan.' : '⏳ Estás en los días de repaso final.'}

  else if (st.mode === 'study' && p.lastDay === todayKey()) body = `<p>✅ Lo de hoy está hecho. Lo siguiente: ${temaChips(st.today)}</p>

  else {
    const n = st.today.reduce((a, t) => a + t.qs.length, 0);
    body = `<p style="margin:10px 0">${temaChips(st.today)} <span class="muted">· ${n} preguntas</span></p>
      ${st.late ? '<p class="help" style="color:var(--ko)">Vas con retraso: no da tiempo a ver todos los temas antes del repaso final. Sube los temas por día o quita alguno en Personalizar.</p>' : ''}

  }

}

  LOGROS = LOGROS_ALL.filter(l => !(cfg.off || []).includes(l.id));
}
// Recompensa diaria: un calendario de 28 días. Cada día con al menos `min` preguntas da `base` puntos; los días 7, 14, 21 y 28
// seguidos dan más. Tras el 28 (o si se corta la racha) vuelve al día 1. Además, cada día: tramos (90 y 120 preguntas),
// puntería (≥ 80 % de aciertos con ≥ 20 respondidas), caja sorpresa al llegar a 100 y la misión del día.
// Cada 7 días seguidos se gana un escudo 🛡️ (máx. 2): si un día no se llega, se gasta y la racha sigue.
// El admin puede cambiar los valores (config/logros.diario).
const DIARIO_DEF = { min: 60, base: 10, hitos: { 7: 20, 14: 30, 21: 40, 28: 100 }, t90: 5, t120: 10, punteria: 5, caja: 100, mision: 10, escudoCada: 7, escudoMax: 2, firma: '' };
const diarioCfg = () => ({ ...DIARIO_DEF, ...(logroCfg.diario || {}), hitos: { ...DIARIO_DEF.hitos, ...(logroCfg.diario?.hitos || {}) } });
const diarioPts = (cfg, dia) => cfg.hitos[dia] ?? cfg.base;
const tramoPts = (cfg, n) => n >= 120 ? cfg.t120 : n >= 90 ? cfg.t90 : 0;
const punteriaOk = q => !!q && q[0] >= 20 && q[1] / q[0] >= .8;
// número estable a partir de un texto: la caja y la misión de cada fecha salen siempre iguales
const hashStr = s => [...s].reduce((h, c) => Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0, 2166136261);
const CAJA = [[5, 40], [10, 30], [15, 20], [30, 10]]; // [puntos, probabilidad %]
function cajaDe(dia) {
  let r = hashStr('caja' + dia) % 100;
  for (const [p, w] of CAJA) { if (r < w) return p; r -= w; }
  return 5;
}

function puntosDiarios(daily = load(K.daily, {}), dq = load(K.dailyq, {}), misiones = load(K.settings, {}).misiones || {}) {
  const cfg = diarioCfg(), hoy = todayKey(), keys = Object.keys(daily).filter(k => daily[k] >= cfg.min).sort();
  let total = 0, racha = 0, escudos = 0;
  const usados = [];
  if (keys.length) for (const d = new Date(keys[0] + 'T12:00'); todayKey(d) <= hoy; d.setDate(d.getDate() + 1)) {
    const k = todayKey(d), n = daily[k] || 0;
    if (n >= cfg.min) {
      racha++;
      total += diarioPts(cfg, (racha - 1) % 28 + 1) + tramoPts(cfg, n) + (punteriaOk(dq[k]) ? cfg.punteria : 0);
      if (racha % cfg.escudoCada === 0) escudos = Math.min(cfg.escudoMax, escudos + 1);
    } else if (k !== hoy) { // hoy todavía puede llegar
      if (racha && escudos) { escudos--; usados.push(k); } else racha = 0;
    }
  }
  total += Object.keys(misiones).length * cfg.mision;
  // ruleta: solo cuenta si se ha girado (settings.cajas = { fecha: puntos })
  total += Object.values(load(K.settings, {}).cajas || {}).reduce((a, p) => a + p, 0);
  const n = daily[hoy] || 0;
  // dia: posición en el calendario del último día cobrado (hoy si ya llegó; si no, el de ayer o antes con escudo)
  return { total, cfg, hoyOk: n >= cfg.min, hoyN: n, dia: racha ? (racha - 1) % 28 + 1 : 0, escudos, usados, q: dq[hoy] || [0, 0] };
}

// Datos para los logros, leídos con load() (así sirven también para el panel admin con viewAs)
function logroData() {
  const hist = load(K.hist, []), daily = load(K.daily, {}), srs = load(K.srs, {});
  const goal = getSettings().dailyGoal || 1;
  // racha más larga de la historia, no solo la actual
  const days = Object.keys(daily).filter(k => daily[k] >= goal).sort();
  let bestStreak = 0, run = 0, prev = null;
  for (const k of days) { const t = new Date(k + 'T00:00').getTime(); run = prev !== null && t - prev <= DAY * 1.5 ? run + 1 : 1; bestStreak = Math.max(bestStreak, run); prev = t; }
  const sims = hist.filter(h => h.modo === 'simulacro');
  const byTema = {};
  (set?.preguntas || []).forEach(q => { const t = byTema[pkKey(q)] ||= { n: 0, dom: 0 }; t.n++; if ((srs[keyOf(q)]?.box || 0) >= 3) t.dom++; });
  const plan = getPlan(), planTotal = plan.on ? planTemas(plan).length : 0;
  const stats = load(K.stats, {}), qs = set?.preguntas || [], now = Date.now();
  const bloquesVistos = new Set(qs.filter(q => stats[keyOf(q)]).map(q => q.bloque || '')).size;
  const srsVals = Object.values(srs);
  // fin de semana: un sábado con actividad y el domingo siguiente también
  const finde = Object.keys(daily).some(k => daily[k] > 0 && new Date(k + 'T12:00').getDay() === 6 && daily[todayKey(new Date(new Date(k + 'T12:00').getTime() + DAY))] > 0);
  return {
    fichas: Object.keys(srs).filter(k => k.startsWith('ficha:')).length,
    vfBest: load(K.vf, {}).best || 0,
    artsOk: Object.values(load(K.arts, {})).filter(a => a.best >= 100).length,
    srsClean: srsVals.length >= 50 && !srsVals.some(s => s.due <= now),
    perfect: hist.filter(h => h.total >= 20 && h.aciertos === h.total).length,
    bloquesVistos, bloquesTotal: new Set(qs.map(q => q.bloque || '')).size,
    // falladas alguna vez que ya van por la caja 2 o más del repaso (acertadas varias veces seguidas después)
    remontadas: Object.entries(stats).filter(([k, s]) => s.ko > 0 && (srs[k]?.box || 0) >= 2).length,
    finde,
    tests: hist.length, answered: Object.values(daily).reduce((a, b) => a + b, 0), goalDays: days.length, bestStreak,
    simApto: sims.filter(h => h.apto).length, simBest: Math.max(0, ...sims.map(entryNota)),
    tens: hist.filter(h => h.total >= 20 && entryNota(h) >= 9.999).length,
    temasDom: Object.values(byTema).filter(t => t.n >= 5 && t.dom / t.n >= .8).length,
    planDone: plan.done.length, planAll: planTotal > 0 && plan.done.length >= planTotal,
    early: hist.some(h => new Date(h.fecha).getHours() < 8) ? 1 : 0, night: hist.some(h => new Date(h.fecha).getHours() >= 23) ? 1 : 0
  };
}
const logrosOk = (d = logroData()) => LOGROS.filter(l => l.val(d) >= goalOf(l, d));

const puntosGanados = (ok = logrosOk()) => ok.reduce((a, l) => a + l.pts, 0) + puntosDiarios().total + puntosRetos();

// Avisa de los logros nuevos (una vez). El primer día avisa con un resumen, por si ya había muchos.
// También avisa una vez al día al llegar al mínimo de la recompensa diaria.
function checkLogros() {
  if (viewAs) return;
  const pd = puntosDiarios(), hoy = todayKey(), st = load(K.settings, {}), cfg = pd.cfg;
  // misión del día: se apunta en cuanto se cumple (aunque luego cambie, p. ej. si vuelven pendientes del repaso)
  const mis = misionHoy();
  if (!(st.misiones || {})[hoy] && mis.ok(misionData())) {
    saveSettings({ misiones: { ...(st.misiones || {}), [hoy]: mis.id } });
    showToast('🎯', `¡Misión cumplida! +${cfg.mision} puntos`, mis.txt, 'pomo');
  }
  if (pd.hoyOk && st.diarioAvisado !== hoy) {
    saveSettings({ diarioAvisado: hoy });
    const p = diarioPts(cfg, pd.dia);
    showToast('📅', `Recompensa diaria: +${p} puntos`, `Día ${pd.dia} de 28${p > cfg.base ? ' · ¡día especial! 🎉' : ''}. Vuelve mañana para el día ${pd.dia % 28 + 1}.`, 'pomo');
    showToast('💚', cfg.firma ? `Mensaje de ${cfg.firma}` : 'Un mensaje para ti', mensajeHoy(), 'pomo');
  }
  const tramo = pd.hoyN >= 120 ? 120 : pd.hoyN >= 90 ? 90 : 0;
  if (tramo && st.tramoAvisado !== hoy + ':' + tramo) {
    saveSettings({ tramoAvisado: hoy + ':' + tramo });
    showToast('🚀', `¡${tramo} preguntas hoy! +${tramoPts(cfg, pd.hoyN)} puntos`, tramo === 90 ? `A las 120 son +${cfg.t120}.` : 'Tramo máximo de hoy. ¡Bestial!', 'pomo');
  }
  if (pd.hoyN >= cfg.caja && st.cajaAvisado !== hoy && !(st.cajas || {})[hoy]) {
    saveSettings({ cajaAvisado: hoy });
    showToast('🎡', '¡Tienes la ruleta para girar!', `Has llegado a ${cfg.caja} preguntas. Gírala en 🏆 Logros.`, 'pomo');
  }
  checkRetos();
  const seen = load(K.settings, {}).logros || {}, ok = logrosOk(), nuevos = ok.filter(l => !seen[l.id]);
  if (!nuevos.length) return;
  saveSettings({ logros: { ...seen, ...Object.fromEntries(nuevos.map(l => [l.id, Date.now()])) } });
  if (nuevos.length > 2) showToast('🏆', `¡${nuevos.length} logros desbloqueados!`, `+${nuevos.reduce((a, l) => a + l.pts, 0)} puntos. Míralos en 🏆 Logros.`, 'pomo');
  else nuevos.forEach(l => showToast(l.ico, `Logro: ${l.name}`, `${l.desc} · +${l.pts} puntos`, 'pomo'));
}

// Calendario de la recompensa diaria: los 28 días, con los ya hechos marcados y el de hoy destacado
function diarioCardHTML(pd) {
  const { cfg, dia, hoyOk, hoyN } = pd;
  // con la racha viva, los días 1…dia ya están cobrados; si ayer fue el 28, hoy empieza un calendario nuevo
  const hechos = !hoyOk && dia === 28 ? 0 : dia;
  const hoyDia = hoyOk ? dia : dia % 28 + 1; // el día que se cobra hoy
  const cells = Array.from({ length: 28 }, (_, i) => {
    const n = i + 1, p = diarioPts(cfg, n);
    return `<div class="dc ${n <= hechos ? 'done' : ''} ${n === hoyDia ? 'today' : ''} ${p > cfg.base ? 'big' : ''}"><span>${n}</span><b>${n <= hechos ? '✓' : '+' + p}</b></div>`;
  }).join('');
  const falta = Math.max(0, cfg.min - hoyN);
  return `<div class="card diario-card">
    <div class="row between"><h2 style="margin:0">📅 Recompensa diaria</h2><span class="muted">${dia ? `día ${hoyOk ? dia : dia + ' · hoy toca el ' + hoyDia}` : 'empieza hoy'}</span></div>
    <p class="muted" style="margin:6px 0 10px">${hoyOk ? `✅ Hoy ya está: +${diarioPts(cfg, dia)} puntos. Vuelve mañana.`
      : `Hoy llevas <b>${hoyN}</b> de ${cfg.min} preguntas${falta ? ` · te faltan ${falta} para ganar <b>+${diarioPts(cfg, hoyDia)}</b>` : ''}.`}
      Si un día no llegas a ${cfg.min}${pd.escudos ? `, gastas un escudo y sigues` : `, vuelve al día 1`}.</p>
    <div class="dcal">${cells}</div>
    <h3>Extras de hoy</h3>
    <div class="extras">${extrasHTML(pd)}</div>
    <p class="help" style="margin-bottom:0">🛡️ Escudos: <b>${pd.escudos}</b> de ${cfg.escudoMax} · ganas uno cada ${cfg.escudoCada} días seguidos${pd.usados.length ? ` · usado el ${pd.usados.slice(-3).map(k => new Date(k + 'T12:00').toLocaleDateString('es-ES', { day: 'numeric', month: 'numeric' })).join(', ')}` : ''}.</p>
  </div>`;
}
// Ruleta (la «caja sorpresa»): 10 casillas con las mismas probabilidades que CAJA; para en el premio de hoy (cajaDe)
const RULETA = [5, 10, 5, 15, 5, 10, 30, 5, 15, 10];
const RULETA_COLOR = { 5: '#7ec8e3', 10: '#f6b26b', 15: '#c39bd3', 30: '#f1c232' };
function spinRuleta() {
  const hoy = todayKey(), st = load(K.settings, {});
  if ((st.cajas || {})[hoy] || puntosDiarios().hoyN < diarioCfg().caja) return;
  const prize = cajaDe(hoy), opts = RULETA.map((v, i) => [v, i]).filter(([v]) => v === prize);
  const idx = opts[hashStr('ruleta' + hoy) % opts.length][1], seg = 360 / RULETA.length;
  const pt = (a, r) => `${150 + r * Math.sin(a * Math.PI / 180)} ${150 - r * Math.cos(a * Math.PI / 180)}`;
  const slices = RULETA.map((v, i) => {
    const a0 = i * seg, a1 = a0 + seg, mid = a0 + seg / 2;
    return `<path d="M150 150 L${pt(a0, 140)} A140 140 0 0 1 ${pt(a1, 140)} Z" fill="${RULETA_COLOR[v]}" stroke="#fff" stroke-width="3"/>
      <text x="${pt(mid, 100).split(' ')[0]}" y="${pt(mid, 100).split(' ')[1]}" transform="rotate(${mid} ${pt(mid, 100)})" text-anchor="middle" dominant-baseline="middle" font-size="22" font-weight="800" fill="#2b1d05">+${v}</text>`;
  }).join('');
  document.body.insertAdjacentHTML('beforeend', `<div class="ruleta-bg" id="ruleta" role="dialog" aria-modal="true" aria-label="Ruleta de premios"><div class="ruleta-box">
    <h2>🎡 Ruleta del día</h2>
    <div class="ruleta-wrap"><div class="ruleta-pin">▼</div>
      <svg viewBox="0 0 300 300" class="ruleta-svg" id="ruletaSvg"><circle cx="150" cy="150" r="146" fill="#fff"/>${slices}<circle cx="150" cy="150" r="22" fill="#fff" stroke="#e2557f" stroke-width="5"/></svg></div>
    <p class="ruleta-res" id="ruletaRes" aria-live="polite">Girando…</p>
    <button class="primary" id="ruletaOk" hidden>¡Genial!</button>
  </div></div>`);
  let fin = false;
  const svg = $('ruletaSvg'), done = () => {
    if (fin) return; fin = true;
    saveSettings({ cajas: { ...(load(K.settings, {}).cajas || {}), [hoy]: prize } });
    $('ruletaRes').innerHTML = `${prize >= 30 ? '🤩 ¡PREMIO GORDO!' : prize >= 15 ? '🎉 ¡Muy bien!' : '😊 ¡Toma!'} <b>+${prize} puntos</b>`;
    $('ruletaOk').hidden = false; $('ruletaOk').focus();
    navigator.vibrate?.(prize >= 30 ? [100, 60, 100, 60, 200] : 120);
  };
  $('ruletaOk').onclick = () => { $('ruleta').remove(); showLogros(); };
  const turns = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 6;
  // la rueda tiene que estar pintada en 0° antes de girar; si no, salta al final sin animación
  svg.getBoundingClientRect();
  requestAnimationFrame(() => requestAnimationFrame(() => {
    svg.style.transform = `rotate(${turns * 360 + 360 - (idx * seg + seg / 2)}deg)`;
    if (!turns) return done();
    svg.addEventListener('transitionend', done, { once: true });
    setTimeout(done, 5200); // por si el navegador no avisa del final del giro
  }));
}

// Lo que se puede ganar hoy además del día: tramos, puntería, caja y misión
function extrasHTML(pd) {
  const { cfg, hoyN, q } = pd, hoy = todayKey(), mis = misionHoy(), misOk = !!(load(K.settings, {}).misiones || {})[hoy];
  const pctQ = q[0] ? Math.round(q[1] / q[0] * 100) : 0;
  const x = (ok, ico, txt, pts) => `<div class="extra ${ok ? 'on' : ''}"><span>${ok ? '✅' : ico}</span><span>${txt}</span><b>+${pts}</b></div>`;
  return x(hoyN >= 90, '🚀', `90 preguntas <span class="muted">(${Math.min(hoyN, 90)}/90)</span>`, cfg.t90)
    + x(hoyN >= 120, '🚀', `120 preguntas <span class="muted">(${Math.min(hoyN, 120)}/120)</span>`, cfg.t120)
    + x(punteriaOk(q), '🎯', `Puntería: 80 % de aciertos <span class="muted">(${q[0] ? `${pctQ} % de ${q[0]}` : 'aún no has respondido'}${q[0] && q[0] < 20 ? ', mínimo 20' : ''})</span>`, cfg.punteria)
    + (() => { // ruleta: se desbloquea al llegar a cfg.caja y hay que girarla
      const got = (load(K.settings, {}).cajas || {})[hoy];
      if (got) return x(true, '🎡', 'Ruleta de hoy', got);

      return x(false, '🎡', `Ruleta al llegar a ${cfg.caja} <span class="muted">(${hoyN}/${cfg.caja})</span>`, '?');
    })()
    + x(misOk, '🗺️', `Misión: ${mis.txt}`, cfg.mision);
}

// ---------- Retos del admin ----------
// El admin crea retos para cada usuario (Firestore config/retos = { items: [...] }). El progreso se calcula con sus datos
// entre `desde` y `hasta`; al cumplirlo suma `puntos` y, si hay `premio`, se crea un canje sin coste para que lo vea el admin.
const RETO_TIPOS = { preguntas: 'preguntas respondidas', dias: 'días llegando al mínimo diario', tests: 'tests terminados', aptos: 'simulacros aprobados' };
let retosCache = [], viewUid = null;
async function loadRetos() {
  try { const s = await fb.getDoc(fb.doc(fb.db, 'config', 'retos')); retosCache = (s.exists() ? s.data().items : null) || []; } catch {}
  return retosCache;
}
const misRetos = () => retosCache.filter(r => r.uid === (viewUid || fbUser?.uid));
function retoProgreso(r) {
  const daily = load(K.daily, {}), inRange = k => k >= r.desde && k <= r.hasta;
  const t0 = new Date(r.desde + 'T00:00').getTime(), t1 = new Date(r.hasta + 'T23:59:59').getTime();
  const hist = load(K.hist, []).filter(h => h.fecha >= t0 && h.fecha <= t1);
  const v = r.tipo === 'preguntas' ? Object.keys(daily).filter(inRange).reduce((a, k) => a + daily[k], 0)
    : r.tipo === 'dias' ? Object.keys(daily).filter(k => inRange(k) && daily[k] >= diarioCfg().min).length
    : r.tipo === 'tests' ? hist.length : hist.filter(h => h.modo === 'simulacro' && h.apto).length;
  return { v, done: v >= r.meta, vencido: todayKey() > r.hasta };
}
const puntosRetos = () => misRetos().reduce((a, r) => a + (retoProgreso(r).done ? +r.puntos || 0 : 0), 0);
const fmtCorta = k => new Date(k + 'T12:00').toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
function retoRowHTML(r, admin) {
  const p = retoProgreso(r), estado = p.done ? '✅ cumplido' : p.vencido ? '⌛ terminado' : `hasta el ${fmtCorta(r.hasta)}`;
  return `<div class="reto ${p.done ? 'ok' : ''}">
    <div class="row between"><b>🏁 ${esc(r.titulo)}</b><span class="muted">${estado}</span></div>
    <div class="muted">${Math.min(p.v, r.meta)} / ${r.meta} ${RETO_TIPOS[r.tipo]} · ${r.puntos ? `⭐ ${r.puntos}` : ''}${r.premio ? `${r.puntos ? ' + ' : ''}🎁 ${esc(r.premio)}` : ''}</div>
    <div class="bar"><div style="width:${Math.min(100, p.v / r.meta * 100)}%"></div></div>
    ${admin ? `<button class="small danger" data-reto-del="${esc(r.id)}">Quitar</button>` : ''}
  </div>`;
}

// ---------- Resumen semanal ----------
// Domingo y lunes, en el inicio: lo de la semana (lunes a domingo) que acaba. Se puede cerrar.
function semanaStats(desde, hasta) {
  const daily = load(K.daily, {}), dq = load(K.dailyq, {}), min = diarioCfg().min, dias = [];
  for (const d = new Date(desde + 'T12:00'); todayKey(d) <= hasta; d.setDate(d.getDate() + 1)) dias.push(todayKey(d));
  const t0 = new Date(desde + 'T00:00').getTime(), t1 = new Date(hasta + 'T23:59:59').getTime();
  const hist = load(K.hist, []).filter(h => h.fecha >= t0 && h.fecha <= t1);
  const q = dias.reduce((a, k) => [a[0] + (dq[k]?.[0] || 0), a[1] + (dq[k]?.[1] || 0)], [0, 0]);
  return { preguntas: dias.reduce((a, k) => a + (daily[k] || 0), 0), diasOk: dias.filter(k => (daily[k] || 0) >= min).length,
    acierto: q[0] ? Math.round(q[1] / q[0] * 100) : null, tests: hist.length, mejor: hist.length ? Math.max(...hist.map(entryNota)) : null };
}

      <div class="row between"><span>Hoy: <b>${today}</b> / ${s.dailyGoal} preguntas ${today >= s.dailyGoal ? '✅' : ''}</span><span title="Días seguidos cumpliendo el objetivo">🔥 ${st} ${st === 1 ? 'día' : 'días'}</span></div>
      <div class="progress" style="margin-bottom:0"><div style="width:${Math.min(100, today / s.dailyGoal * 100)}%"></div></div>` : ''}
      ${set?.preguntas?.length && today >= diarioCfg().caja && !(load(K.settings, {}).cajas || {})[todayKey()] ? `<p style="margin:10px 0 0"><a href="#" id="goRuleta">🎡 ¡Tienes la ruleta para girar! →</a></p>` : ''}

      ${retoHoyHTML()}
    </div>`;
}

        <span class="muted">Como el examen oficial: ${Math.min(s.simPreguntas, simPool.length)} preguntas${s.simBloque ? ` de «${esc(s.simBloque)}»` : ' de todo el temario'} · ${s.simMinutos ? s.simMinutos + ' min' : 'sin tiempo'} · ${penTxt}</span></button>${infoBtn('sim1', 'Simulacro de la 1ª parte')}</div>
      <div class="qwrap"><button class="quick-btn" id="sim2Btn"><span class="qi">🎯</span><b>Simulacro · ${esc(s.sim2Nombre)}</b>
        <span class="muted">${Math.min(s.sim2Preguntas, sim2Pool.length)} preguntas${s.sim2Bloque ? ` de «${esc(s.sim2Bloque)}»` : ' de todo el temario'} · ${s.sim2Minutos ? s.sim2Minutos + ' min' : 'sin tiempo'} · ${penTxt}</span></button>${infoBtn('sim2', 'Simulacro de la 2ª parte')}</div>
    </div>` : ''}` : ''}
    ${serverAvailable && set?.origen === 'editado' ? `<div class="card"><p class="help" style="margin-top:0">Estás usando preguntas editadas solo en este dispositivo.</p>
      <button id="useServer" class="small">Volver a las preguntas de todos</button></div>` : ''}`;

  bindPlanCard();
  bindInbox();

  if ($('goAyuda')) $('goAyuda').onclick = () => showAyuda();
  if ($('novAyuda')) $('novAyuda').onclick = () => showAyuda();
  if ($('novOk')) $('novOk').onclick = () => { saveSettings({ ayudaVista: AYUDA_VERSION }); showHome(); };
  if ($('semanaOk')) $('semanaOk').onclick = () => { saveSettings({ semanaVista: todayKey(daysAgo(new Date().getDay() === 0 ? 0 : 1)) }); showHome(); };
  if ($('fallosGo')) $('fallosGo').onclick = () => startRun(shuffle(fallosHoy()), { mode: 'practica', label: 'Fallos de hoy' });
  if ($('goLogros')) $('goLogros').onclick = () => showLogros().then(() => $('ruletaBtn')?.scrollIntoView({ block: 'center' }));
  if ($('goRuleta')) $('goRuleta').onclick = e => { e.preventDefault(); showLogros().then(() => $('ruletaBtn')?.scrollIntoView({ block: 'center' })); };
  setTimeout(checkLogros, 600); // aviso de logros nuevos al volver al inicio
  $('goStats').onclick = showStats;
  $('goTheme').onclick = showTheme;
  $('goSettings').onclick = showSettings;
  if ($('goAdmin')) $('goAdmin').onclick = () => showAdmin();
  $('goEditor').onclick = () => openEditor();
  if ($('useServer')) $('useServer').onclick = () => {
    if (set?.origen === 'editado' && !confirm('Perderás los cambios hechos en el editor que no estén guardados en GitHub. ¿Continuar?')) return;
    fetchServerSet().then(d => { useData(d, 'servidor'); showHome(); }).catch(() => showHome('No se pudo leer preguntas.json'));
  };
  if (saved) {
    $('resume').onclick = () => { run = normalizeRun(saved); showQuestion(); };
    $('discard').onclick = () => { if (confirm('¿Descartar el test a medias?')) { localStorage.removeItem(K.run); showHome(); } };
  }
  if (!hasContent) return;

  const confirmDiscard = () => !saved || confirm('Se descartará el test a medias. ¿Empezar uno nuevo?');
  const needQs = fn => () => qs.length ? fn() : alert('Primero añade preguntas tipo test en ✏️ Editor.');
  if ($('cuadernoBtn')) $('cuadernoBtn').onclick = () => showCuaderno();
  if ($('flashBtn')) $('flashBtn').onclick = () => showStudySetup('flash');
  if ($('audioBtn')) $('audioBtn').onclick = () => showStudySetup('audio');
  if ($('vfBtn')) $('vfBtn').onclick = needQs(() => showStudySetup('vf'));
  if ($('artBtn')) $('artBtn').onclick = () => showArticles();
  if (!qs.length) {
    // sin preguntas tipo test no se pintan el repaso ni los simulacros
