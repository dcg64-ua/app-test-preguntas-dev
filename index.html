<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tests">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Test de preguntas</title>
<style>
  :root {
    --bg: #f4f6fb; --card: #fff; --text: #1a1f2e; --muted: #6b7385; --border: #e3e7ef; --grid: #edf0f5;
    --accent: #4263eb; --accent-2: #7048e8; --accent-bg: #eef2ff; --on-accent: #fff;
    --ok: #2b8a3e; --ok-bg: #ebfbee; --ko: #e03131; --ko-bg: #fff5f5; --star: #f59f00; --water: #1c7ed6; --water-bg: #e7f5ff;
    --shadow: 0 1px 2px rgba(20, 30, 60, .04), 0 4px 16px rgba(20, 30, 60, .06);
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318; --card: #1b1e26; --text: #e8eaf0; --muted: #9aa2b1; --border: #2a2f3a; --grid: #242833;
      --accent: #748ffc; --accent-2: #9775fa; --accent-bg: #222a48; --on-accent: #0f1220;
      --ok: #69db7c; --ok-bg: #15301e; --ko: #ff6b6b; --ko-bg: #3a1c1c; --star: #fcc419; --water: #4dabf7; --water-bg: #13283d;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  .filebtn { display: inline-flex; align-items: center; min-height: 44px; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); cursor: pointer; font-weight: 600; }
  #start { width: 100%; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; color: var(--text); background: var(--bg);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  }
  main {
    max-width: 720px; margin: 0 auto;
    padding: calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    animation: fade .25s ease;
  }
  h1 { font-size: 1.6rem; letter-spacing: -.02em; margin: 0 0 16px; }
  h2 { font-size: 1.1rem; letter-spacing: -.01em; margin: 0 0 12px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .muted { color: var(--muted); font-size: .9rem; }

  button {
    font: inherit; cursor: pointer; border-radius: 12px; border: 1px solid var(--border); background: var(--card); color: var(--text);
    padding: 10px 16px; min-height: 44px; touch-action: manipulation; transition: transform .1s, background .15s, border-color .15s, box-shadow .15s;
  }
  button:active:not(:disabled) { transform: scale(.97); }
  button.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; color: var(--on-accent); font-weight: 600; box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 35%, transparent); }
  button.danger { color: var(--ko); }
  button.small { padding: 4px 12px; min-height: 34px; font-size: .9rem; }
  button:disabled { opacity: .45; cursor: default; }
  @media (hover: hover) {
    button:hover:not(:disabled) { border-color: var(--accent); }
    button.primary:hover:not(:disabled) { filter: brightness(1.06); }
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .between { justify-content: space-between; }

  .drop { border: 2px dashed var(--border); border-radius: var(--radius); padding: 24px; text-align: center; transition: border-color .15s, background .15s; }
  .drop.over { border-color: var(--accent); background: var(--accent-bg); }
  label.opt { display: flex; gap: 10px; align-items: center; margin: 8px 0; }
  input[type=checkbox], input[type=radio] { width: 20px; height: 20px; accent-color: var(--accent); flex-shrink: 0; }
  input[type=number], input[type=text], input[type=search], select, textarea {
    font: inherit; font-size: 16px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  input[type=number] { width: 84px; }
  textarea { width: 100%; }
  .full { width: 100%; }

  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }
  .mode-card { display: block; border: 2px solid var(--border); border-radius: 14px; padding: 12px 14px; cursor: pointer; transition: border-color .15s, background .15s; }
  .mode-card input { position: absolute; opacity: 0; pointer-events: none; }
  .mode-card .t { font-weight: 700; display: block; }
  .mode-card .d { font-size: .82rem; color: var(--muted); }
  .mode-card:has(input:checked) { border-color: var(--accent); background: var(--accent-bg); }
  .sep { border: none; border-top: 1px solid var(--border); margin: 14px 0; }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .topbar > div:first-child { background: color-mix(in srgb, var(--card) 80%, transparent); padding: 4px 10px; border-radius: 99px; }
  .progress { height: 8px; background: var(--grid); border-radius: 99px; overflow: hidden; margin: 10px 0 16px; }
  .progress > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 99px; transition: width .3s ease; }
  .q { font-size: 1.2rem; font-weight: 650; line-height: 1.45; margin: 2px 0 18px; white-space: pre-wrap; }
  .options { display: grid; gap: 10px; }
  .options button { text-align: left; display: flex; gap: 12px; align-items: center; white-space: pre-wrap; padding: 12px 14px; min-height: 56px; border-width: 2px; }
  .options button .letter {
    flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    font-weight: 700; font-size: .85rem; background: var(--grid); color: var(--muted); transition: background .15s, color .15s;
  }
  .options button.sel { border-color: var(--accent); background: var(--accent-bg); }
  .options button.sel .letter { background: var(--accent); color: var(--on-accent); }
  .options button.ok { border-color: var(--ok); background: var(--ok-bg); animation: pop .3s ease; }
  .options button.ok .letter { background: var(--ok); color: var(--card); }
  .options button.ko { border-color: var(--ko); background: var(--ko-bg); animation: shake .35s ease; }
  .options button.ko .letter { background: var(--ko); color: var(--card); }
  .explain { margin-top: 16px; padding: 14px 16px; border-radius: 12px; border-left: 4px solid var(--ok); background: var(--ok-bg); white-space: pre-wrap; animation: slideup .25s ease; }
  .explain.wrong { border-left-color: var(--ko); background: var(--ko-bg); }
  .star { background: none; border: none; box-shadow: none; padding: 4px 8px; min-height: 40px; font-size: 1.4rem; line-height: 1; color: var(--muted); }
  .star.on { color: var(--star); animation: pop .3s ease; }
  .timer { font-variant-numeric: tabular-nums; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: var(--grid); font-size: .9rem; }
  .timer:empty { display: none; }
  .timer.low { color: var(--ko); background: var(--ko-bg); }
  .navgrid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
  .navgrid button { width: 40px; min-height: 40px; padding: 0; font-size: .85rem; }
  .navgrid button.done { background: var(--accent-bg); border-color: var(--accent); }
  .navgrid button.cur { outline: 2px solid var(--accent); outline-offset: 2px; }

  .score { display: flex; align-items: center; gap: 20px; margin-bottom: 16px; }
  .ring {
    --p: 0; --c: var(--accent); width: 112px; height: 112px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center;
    background: conic-gradient(var(--c) calc(var(--p) * 1%), var(--grid) 0);
  }
  .ring > div { width: 88px; height: 88px; border-radius: 50%; background: var(--card); display: grid; place-items: center; font-size: 1.5rem; font-weight: 800; }
  .big { font-size: 2rem; font-weight: 800; letter-spacing: -.02em; }
  .review { border-top: 1px solid var(--border); padding: 14px 0; }
  .error { color: var(--ko); white-space: pre-wrap; }
  .notice { border-left: 4px solid var(--accent); }

  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .kpi { background: var(--bg); border-radius: 12px; padding: 12px; }
  .kpi .v { font-size: 1.6rem; font-weight: 800; letter-spacing: -.02em; }
  .chart { position: relative; }
  .chart svg { width: 100%; height: auto; display: block; }
  .tip { position: absolute; pointer-events: none; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: .85rem; box-shadow: var(--shadow); white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); }
  .bar-row { display: grid; grid-template-columns: minmax(80px, 30%) 1fr 90px; gap: 10px; align-items: center; margin: 10px 0; font-size: .95rem; }
  .bar { height: 10px; background: var(--grid); border-radius: 99px; overflow: hidden; }
  .bar > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 99px; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { text-align: left; padding: 8px 4px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .table-wrap { overflow-x: auto; }
  .qitem { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; margin-bottom: 8px; }
  .qitem .txt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { font-size: .75rem; padding: 2px 10px; border-radius: 99px; background: var(--accent-bg); color: var(--accent); white-space: nowrap; font-weight: 600; }
  .optrow { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
  .optrow input[type=text] { flex: 1; min-width: 0; }

  #toasts {
    position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    width: min(440px, calc(100% - 32px)); z-index: 10; display: flex; flex-direction: column; gap: 8px;
  }
  .toast {
    display: flex; gap: 12px; align-items: center;
    background: var(--water-bg); color: var(--text); border: 1px solid color-mix(in srgb, var(--water) 40%, transparent);
    border-radius: 16px; padding: 14px 16px; box-shadow: 0 8px 30px rgba(0, 0, 0, .18); animation: toastin .4s cubic-bezier(.2, .9, .3, 1.2);
  }
  .toast.pomo { background: var(--accent-bg); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  .toast .ico { font-size: 1.8rem; animation: bob 1.6s ease-in-out infinite; }
  .toast .msg { flex: 1; }
  .toast button { background: var(--water); border-color: transparent; color: #fff; font-weight: 600; }
  .toast.pomo button { background: var(--accent); color: var(--on-accent); }

  /* Pomodoro */
  .pomo-pill {
    position: fixed; right: calc(16px + env(safe-area-inset-right)); bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 11;
    border-radius: 99px; padding: 8px 16px; font-weight: 700; font-variant-numeric: tabular-nums; box-shadow: 0 6px 20px rgba(0, 0, 0, .18);
    background: var(--card); border: 2px solid var(--accent);
  }
  .pomo-pill.break { border-color: var(--ok); }
  .pomo-panel {
    position: fixed; right: calc(16px + env(safe-area-inset-right)); bottom: calc(70px + env(safe-area-inset-bottom)); z-index: 12;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px; box-shadow: 0 8px 30px rgba(0, 0, 0, .2); animation: slideup .2s ease;
  }
  .pomo-panel .row { margin-top: 8px; }

  /* Inicio: objetivo diario y accesos rápidos */
  .countdown { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .countdown .big { font-size: 2.2rem; }
  .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .quick-btn { display: flex; flex-direction: column; align-items: flex-start; text-align: left; gap: 2px; padding: 14px; min-height: 100px; border-width: 2px; }
  .quick-btn .qi { font-size: 1.6rem; line-height: 1.2; }
  .chip { min-height: 36px; padding: 6px 14px; border-radius: 99px; font-size: .9rem; }
  .chip.on { background: color-mix(in srgb, var(--star) 22%, var(--card)); border-color: var(--star); }
  .navgrid button.doubt { border-style: dashed; border-color: var(--star); }
  .tag.doubt { background: color-mix(in srgb, var(--star) 22%, var(--card)); color: var(--text); }
  .ref { margin-top: 8px; font-weight: 600; color: var(--accent); }
  .verdict { display: inline-block; font-weight: 800; padding: 6px 14px; border-radius: 12px; margin-bottom: 12px; }
  .verdict.ok { background: var(--ok-bg); color: var(--ok); }
  .verdict.ko { background: var(--ko-bg); color: var(--ko); }
  .bloque-h { display: flex; justify-content: space-between; align-items: baseline; margin: 16px 0 4px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }

  /* Calendario de actividad */
  .heat { display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; }
  .heat i { display: block; aspect-ratio: 1; border-radius: 3px; background: var(--grid); }
  .heat i.l1 { background: color-mix(in srgb, var(--accent) 30%, var(--grid)); }
  .heat i.l2 { background: color-mix(in srgb, var(--accent) 55%, var(--grid)); }
  .heat i.l3 { background: color-mix(in srgb, var(--accent) 78%, var(--grid)); }
  .heat i.l4 { background: var(--accent); }
  .heat i.today { outline: 2px solid var(--text); outline-offset: -1px; }
  .heat i.future { visibility: hidden; }
  .heat-legend { display: flex; gap: 3px; align-items: center; justify-content: flex-end; margin-top: 8px; font-size: .8rem; color: var(--muted); }
  .heat-legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

  /* Ajustes */
  .set-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 10px 0; }
  .set-row > span { flex: 1; }
  .set-row input[type=number] { width: 90px; }
  .set-row input[type=date] { font: inherit; padding: 6px 8px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  .help { font-size: .85rem; color: var(--muted); margin: 4px 0 8px; }
  /* Editor: pestañas */
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
  .tab { padding: 8px 4px; font-size: .9rem; font-weight: 600; }
  .tab.on { border-color: var(--accent); background: var(--accent-bg); }

  /* Trucos, notas y confusiones */
  .notes { margin-top: 10px; }
  .truco { margin: 6px 0; padding: 8px 12px; border-radius: 10px; background: color-mix(in srgb, var(--star) 15%, var(--card)); font-size: .95rem; }
  .truco.mine { background: var(--accent-bg); }
  .note-btn { margin-top: 4px; }
  .confusion { margin-top: 10px; padding: 10px 12px; border-radius: 10px; border-left: 4px solid var(--star); background: color-mix(in srgb, var(--star) 12%, var(--card)); }
  .recall-box { text-align: center; padding: 18px; border: 2px dashed var(--border); border-radius: 14px; }
  .recall-box p { margin-top: 0; }

  /* Flashcards */
  .flash-card { cursor: pointer; min-height: 220px; display: flex; flex-direction: column; justify-content: center; animation: flipin .3s ease; }
  .flash-card.flipped { cursor: default; }
  .flash-hint { text-align: center; margin-bottom: 0; }
  .flash-answer { font-size: 1.15rem; font-weight: 700; color: var(--ok); white-space: pre-wrap; }
  .grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .grade { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px; border-width: 2px; }
  .grade span { font-size: .75rem; color: var(--muted); }
  .grade.again { border-color: var(--ko); } .grade.hard { border-color: var(--star); }
  .grade.good { border-color: var(--ok); } .grade.easy { border-color: var(--accent); }
  @keyframes flipin { from { transform: rotateY(25deg); opacity: .4; } }

  /* Audio */
  .audio-opts { display: grid; gap: 4px; }
  .audio-opts .audio-ok { color: var(--ok); font-weight: 700; }
  .audio-ctrl { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 8px; }
  .audio-ctrl button { font-size: 1.1rem; }

  /* Verdadero / Falso */
  .vf-card { min-height: 200px; transition: transform .15s, background .2s; touch-action: pan-y; }
  .vf-card.ok { background: var(--ok-bg); border-color: var(--ok); }
  .vf-card.ko { background: var(--ko-bg); border-color: var(--ko); animation: shake .35s ease; }
  .vf-answer { font-size: 1.15rem; font-weight: 700; padding: 12px 14px; border-radius: 12px; background: var(--accent-bg); }
  .vf-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .vf-btns button { min-height: 64px; font-size: 1.1rem; font-weight: 800; border-width: 2px; }
  .vf-yes { border-color: var(--ok); color: var(--ok); } .vf-no { border-color: var(--ko); color: var(--ko); }

  /* Artículos con huecos */
  .art-text { line-height: 2.1; white-space: pre-wrap; font-size: 1.02rem; }
  .gap { font: inherit; padding: 1px 6px; border: none; border-bottom: 2px solid var(--accent); border-radius: 4px; background: var(--accent-bg); color: var(--text); max-width: 100%; }
  .gap.ok { border-color: var(--ok); background: var(--ok-bg); }
  .gap.ko { border-color: var(--ko); background: var(--ko-bg); }
  .gap.shown { border-color: var(--star); }
  .gap-sol { margin: 0 4px; color: var(--ok); font-weight: 700; font-size: .9rem; }
  .gap-mark { background: color-mix(in srgb, var(--star) 35%, transparent); border-radius: 4px; padding: 0 3px; }
  .art-preview { max-height: 240px; overflow: auto; padding: 10px; border: 1px solid var(--border); border-radius: 10px; margin-top: 8px; line-height: 1.7; }
  @media (max-width: 480px) { .grades { grid-template-columns: 1fr 1fr; } }

  body.env-dev main { padding-top: calc(36px + env(safe-area-inset-top)); }
  .env-badge {
    position: fixed; top: calc(6px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 20; pointer-events: none;
    background: #f59f00; color: #1a1f2e; font-size: .72rem; font-weight: 800; letter-spacing: .05em; padding: 2px 10px; border-radius: 99px;
  }
  .saved-flash { color: var(--ok); font-weight: 700; opacity: 0; transition: opacity .3s; margin-left: 6px; }
  .saved-flash.on { opacity: 1; }
  select:disabled, input:disabled { opacity: .5; }

  /* Foto de fondo (capa fija: funciona también en iOS, donde background-attachment: fixed no) */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: var(--photo, none) var(--photo-pos, center) / cover no-repeat; opacity: var(--photo-op, 0);
  }
  .ghstatus { padding: 12px 16px; border-radius: 12px; margin-bottom: 16px; font-size: .92rem; background: var(--accent-bg); border-left: 4px solid var(--accent); animation: slideup .2s ease; }
  .ghstatus.ok { background: var(--ok-bg); border-left-color: var(--ok); }
  .ghstatus.error, .ghstatus.conflict, .ghstatus.pending { background: var(--ko-bg); border-left-color: var(--ko); }
  details.card > summary { cursor: pointer; list-style-position: inside; }
  details.card[open] > summary { margin-bottom: 8px; }
  details.card label { display: block; margin-top: 10px; }
  a { color: var(--accent); font-weight: 600; }
  code { font-size: .9em; padding: 1px 5px; border-radius: 4px; background: var(--grid); }
  .homenav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
  @media (max-width: 560px) { .homenav { grid-template-columns: 1fr 1fr; } }
  .homenav button { padding: 10px 6px; font-size: .9rem; white-space: nowrap; box-shadow: var(--shadow); }
  body.has-photo .card { background: color-mix(in srgb, var(--card) 88%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  body.has-photo h1 { text-shadow: 0 1px 8px color-mix(in srgb, var(--bg) 80%, transparent); }

  .swatches { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 8px; }
  .swatch { width: 52px; height: 52px; min-height: 0; padding: 0; border-radius: 50%; border: 3px solid var(--card); box-shadow: 0 0 0 1px var(--border); position: relative; }
  .swatch.on { box-shadow: 0 0 0 3px var(--accent); }
  .swatch-label { font-size: .75rem; color: var(--muted); text-align: center; margin-top: 4px; }
  .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .photo-tile { aspect-ratio: 1; border-radius: 14px; border: 2px solid var(--border); background: var(--grid) center / cover no-repeat; padding: 0; display: grid; place-items: end center; overflow: hidden; }
  .photo-tile span { width: 100%; padding: 4px; font-size: .8rem; font-weight: 600; background: color-mix(in srgb, var(--card) 85%, transparent); }
  .photo-tile.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input[type=color] { width: 52px; height: 52px; border: none; border-radius: 50%; padding: 0; background: none; cursor: pointer; -webkit-appearance: none; appearance: none; }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type=color]::-webkit-color-swatch { border: 3px solid var(--card); border-radius: 50%; box-shadow: 0 0 0 1px var(--border); }
  input[type=color]::-moz-color-swatch { border: 3px solid var(--card); border-radius: 50%; }

  @keyframes fade { from { opacity: 0; } }
  @keyframes slideup { from { opacity: 0; transform: translateY(6px); } }
  @keyframes pop { 50% { transform: scale(1.03); } }
  @keyframes shake { 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }
  @keyframes toastin { from { opacity: 0; transform: translate(-50%, 30px); } }
  @keyframes bob { 50% { transform: translateY(-3px); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  @media (max-width: 480px) {
    h1 { font-size: 1.35rem; }
    .card { padding: 16px; }
    .kpis { grid-template-columns: 1fr 1fr; }
    .bar-row { grid-template-columns: 1fr 70px; } .bar-row .bar { grid-column: 1 / -1; grid-row: 2; }
    .ring { width: 96px; height: 96px; } .ring > div { width: 74px; height: 74px; font-size: 1.25rem; }
  }
</style>
</head>
<body>
<main id="app"></main>

<script>
// Entorno: desarrollo (repositorio *-dev, o en local) o producción.
// Ambos viven en el mismo dominio (github.io), así que cada uno guarda sus datos con un prefijo distinto.
const LOCAL = ['localhost', '127.0.0.1'].includes(location.hostname) || location.protocol === 'file:';
// En local se puede probar como producción con ?env=prod
const ENV = LOCAL && new URLSearchParams(location.search).get('env') === 'prod' ? 'prod'
  : /^\/[^/]+-dev\//.test(location.pathname) || LOCAL ? 'dev' : 'prod';
// Funciones ya aprobadas para producción. En desarrollo están todas activas.
// Para pasar una función a producción basta con añadirla aquí.
const PROD_FEATURES = ['flash'];
const ALL_FEATURES = ['flash', 'articulos', 'audio', 'vf', 'recall', 'notas', 'confusion'];
const feat = name => ENV === 'dev' || PROD_FEATURES.includes(name);
const P = ENV === 'dev' ? 'quizdev.' : 'quiz.';
const K = Object.fromEntries(Object.entries({
  set: 'set', stats: 'stats', marks: 'marks', hist: 'history', run: 'run',
  srs: 'srs', daily: 'daily', settings: 'settings', pomo: 'pomo', water: 'waterSecs',
  theme: 'theme', photo: 'photo', gh: 'github', notes: 'notes', arts: 'articulos', vf: 'vf'
}).map(([k, v]) => [k, P + v]));
if (ENV === 'dev') {
  document.title = 'Tests (DEV)';
  document.querySelector('meta[name=apple-mobile-web-app-title]').content = 'Tests DEV';
  document.body.classList.add('env-dev');
  document.body.insertAdjacentHTML('beforeend', '<div class="env-badge" title="Entorno de desarrollo: datos separados de la app normal">🧪 DESARROLLO</div>');
}
const app = document.getElementById('app');
let set = null;              // { titulo, preguntas, ajustes?, origen: 'servidor' | 'archivo' | 'editado' }
let run = null;              // test en curso (se guarda en localStorage para poder reanudar)
let serverAvailable = false; // hay un preguntas.json junto al HTML (GitHub Pages, servidor local...)
let timerId = null;

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const keyOf = q => q.pregunta;
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const uniq = a => [...new Set(a.filter(Boolean))];
const natCmp = (a, b) => String(a).localeCompare(String(b), 'es', { numeric: true, sensitivity: 'base' });
const fmtTime = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const fmtDate = t => new Date(t).toLocaleString('es-ES', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
const fmtNum = (n, d = 2) => (+n).toLocaleString('es-ES', { maximumFractionDigits: d });
const $ = id => document.getElementById(id);
const DAY = 864e5;
const startOfToday = () => new Date().setHours(0, 0, 0, 0);
const todayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const MODOS = { practica: 'Práctica', examen: 'Examen', simulacro: 'Simulacro', repaso: 'Repaso' };

function downloadBlob(blob, name) {
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: name });
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ---------- Ajustes ----------
// Prioridad: valores por defecto < "ajustes" del preguntas.json (compartidos) < lo que cambie cada uno en su dispositivo
const SETTINGS_DEFAULT = {
  penaltyOn: false, penalty: 1 / 3,
  simNombre: 'Simulacro', simPreguntas: 100, simMinutos: 90, simCorte: 5, simBloque: '',
  examDate: '', dailyGoal: 50, srsSize: 20,
  pomoOn: false, pomoWork: 25, pomoBreak: 5, water: true, waterMin: 20, waterMsg: '',
  autoGaps: true, extraGaps: 0
};
const SHARED = ['penaltyOn', 'penalty', 'simNombre', 'simPreguntas', 'simMinutos', 'simCorte', 'simBloque', 'examDate', 'dailyGoal'];
// Opciones que remiten a otras ("Las respuestas a) y c)…", "Todas las anteriores…"): no se barajan
const fixedOrder = q => q.ordenFijo || q.opciones.some(o => /(^|[\s(])[a-h]\)|anteriores|ninguna (es|de)|todas (las|son)/i.test(o));
const pick = (o, keys) => o ? Object.fromEntries(keys.filter(k => k in o).map(k => [k, o[k]])) : {};
const getSettings = () => ({ ...SETTINGS_DEFAULT, ...pick(set?.ajustes, SHARED), ...load(K.settings, {}) });
function saveSettings(patch) { save(K.settings, { ...load(K.settings, {}), ...patch }); }

const PENALTIES = [[1 / 2, '1/2'], [1 / 3, '1/3'], [1 / 4, '1/4'], [1 / 5, '1/5']];
const fmtPen = p => PENALTIES.find(([v]) => Math.abs(v - p) < 1e-6)?.[1] || fmtNum(p, 3);
const calcNota = (ok, ko, total, pen) => total ? Math.max(0, ok - ko * pen) / total * 10 : 0;
const entryNota = h => h.nota ?? (h.total ? h.aciertos / h.total * 10 : 0);

// ---------- Marcadas ----------
const isMarked = q => !!load(K.marks, {})[keyOf(q)];
function toggleMark(q) {
  const m = load(K.marks, {}), k = keyOf(q);
  if (m[k]) delete m[k]; else m[k] = true;
  save(K.marks, m);
  return !!m[k];
}
const starBtn = (q, id) => `<button class="star ${isMarked(q) ? 'on' : ''}" ${id ? `id="${id}"` : ''} title="Marcar para repasar">${isMarked(q) ? '★' : '☆'}</button>`;
function bindStar(btn, q) {
  btn.onclick = () => { const on = toggleMark(q); btn.classList.toggle('on', on); btn.textContent = on ? '★' : '☆'; };
}

// ---------- Repetición espaciada (cajas de Leitner) ----------
// Acierto: sube de caja y vuelve a salir en 1, 3, 7, 16 o 35 días. Fallo: vuelve a la caja 0 (sale ya).
const SRS_DAYS = [0, 1, 3, 7, 16, 35];
// Nota de autoevaluación (flashcards): 0 = otra vez, 1 = difícil, 2 = bien, 3 = fácil. En el test: acierto = 2, fallo = 0.
function srsGradeBox(cur, grade) {
  return grade === 0 ? 0 : grade === 1 ? Math.max(1, cur) : Math.min(cur + grade - 1, SRS_DAYS.length - 1);
}
function srsGradeDays(cur, grade) { return grade === 1 ? 1 : SRS_DAYS[srsGradeBox(cur, grade)]; }
function srsGrade(key, grade) {
  const s = load(K.srs, {}), cur = s[key]?.box || 0;
  s[key] = { box: srsGradeBox(cur, grade), due: startOfToday() + srsGradeDays(cur, grade) * DAY };
  save(K.srs, s);
}
const srsUpdate = (q, ok) => srsGrade(keyOf(q), ok ? 2 : 0);
function srsPlan(items, key = keyOf) {
  const s = load(K.srs, {}), now = Date.now();
  const due = items.filter(x => s[key(x)] && s[key(x)].due <= now).sort((a, b) => s[key(a)].due - s[key(b)].due);
  const fresh = items.filter(x => !s[key(x)]);
  const next = Math.min(...items.map(x => s[key(x)]?.due).filter(d => d > now));
  return { due, fresh, next };
}

// ---------- Tarjetas: preguntas y fichas con la misma forma (flashcards, audio) ----------
const fichasOf = () => set?.fichas || [];
const articulosOf = () => set?.articulos || [];
const fichaKey = f => 'ficha:' + f.anverso;
const artKey = a => 'art:' + a.titulo;
const asCard = x => x.anverso !== undefined
  ? { type: 'f', key: fichaKey(x), front: x.anverso, back: x.reverso, item: x }
  : { type: 'q', key: keyOf(x), front: x.pregunta, back: x.opciones[x.correcta], item: x };

// ---------- Actividad diaria, racha y cuenta atrás ----------
function addDaily(n) {
  if (!n) return;
  const d = load(K.daily, {}), k = todayKey();
  d[k] = (d[k] || 0) + n;
  save(K.daily, d);
}
function streak() {
  const d = load(K.daily, {}), goal = getSettings().dailyGoal || 1, day = new Date();
  if ((d[todayKey(day)] || 0) < goal) day.setDate(day.getDate() - 1); // hoy todavía no rompe la racha
  let n = 0;
  while ((d[todayKey(day)] || 0) >= goal) { n++; day.setDate(day.getDate() - 1); }
  return n;
}
function daysLeft(date) {
  if (!date) return null;
  return Math.round((new Date(date + 'T00:00').getTime() - startOfToday()) / DAY);
}

// Migra estadísticas, marca y repaso si cambia el texto de una pregunta
function migrateKey(oldKey, newKey) {
  if (oldKey === newKey) return;
  for (const k of [K.stats, K.marks, K.srs, K.notes]) {
    const m = load(k, {});
    if (oldKey in m) { m[newKey] = m[oldKey]; delete m[oldKey]; save(k, m); }
  }
}

// ---------- Carga y validación ----------
function parseSet(data) {
  const obj = Array.isArray(data) ? {} : data;
  const preguntas = Array.isArray(data) ? data : (data.preguntas ?? []);
  const fichas = obj.fichas ?? [], articulos = obj.articulos ?? [];
  if (!Array.isArray(preguntas) || !Array.isArray(fichas) || !Array.isArray(articulos))
    throw new Error('El JSON debe tener una lista de "preguntas" (y opcionalmente "fichas" y "articulos").');
  const errs = [];
  preguntas.forEach((q, n) => {
    const p = `Pregunta ${n + 1}: `;
    if (!q.pregunta) errs.push(p + 'falta "pregunta"');
    if (!Array.isArray(q.opciones) || q.opciones.length < 2) errs.push(p + '"opciones" debe ser una lista');
    else if (!Number.isInteger(q.correcta) || q.correcta < 0 || q.correcta >= q.opciones.length) errs.push(p + '"correcta" debe ser el índice (0 a ' + (q.opciones.length - 1) + ')');
  });
  fichas.forEach((f, n) => { if (!f.anverso || !f.reverso) errs.push(`Ficha ${n + 1}: necesita "anverso" y "reverso"`); });
  articulos.forEach((a, n) => { if (!a.titulo || !a.texto) errs.push(`Artículo ${n + 1}: necesita "titulo" y "texto"`); });
  if (errs.length) throw new Error(errs.join('\n'));
  const out = { titulo: obj.titulo || 'Test', preguntas, fichas, articulos };
  if (obj.ajustes && typeof obj.ajustes === 'object') out.ajustes = pick(obj.ajustes, SHARED);
  return out;
}
const setToJSON = () => ({
  titulo: set.titulo, ...(set.ajustes ? { ajustes: set.ajustes } : {}), preguntas: set.preguntas,
  ...(fichasOf().length ? { fichas: set.fichas } : {}), ...(articulosOf().length ? { articulos: set.articulos } : {})
});

function useData(data, origen) {
  set = { ...parseSet(data), origen };
  save(K.set, set);
}

function readFile(file) {
  file.text().then(t => { useData(JSON.parse(t), 'archivo'); showHome(); })
    .catch(e => showHome('No se pudo cargar: ' + e.message));
}

function fetchServerSet() {
  const pages = () => fetch('preguntas.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : Promise.reject());
  // Con GitHub conectado se lee directamente del repositorio (al instante, sin esperar a que se publique la web)
  return ghConnected() ? ghPull().catch(pages) : pages();
}

// ---------- Inicio ----------
function dailyCardHTML() {
  const s = getSettings(), today = load(K.daily, {})[todayKey()] || 0, left = daysLeft(s.examDate), st = streak();
  if (left === null && !s.dailyGoal) return '';
  return `
    <div class="card">
      ${left !== null ? `<div class="countdown">
        ${left > 0 ? `<span class="big">${left}</span><span>${left === 1 ? 'día' : 'días'} para el examen ⏳</span>`
          : left === 0 ? '<span class="big">¡Hoy!</span><span>es el examen. ¡Mucha suerte! 🍀</span>'
          : '<span class="muted">La fecha del examen ya pasó. Cámbiala en ⚙️ Ajustes.</span>'}
      </div>` : ''}
      ${s.dailyGoal ? `
      <div class="row between"><span>Hoy: <b>${today}</b> / ${s.dailyGoal} preguntas ${today >= s.dailyGoal ? '✅' : ''}</span><span title="Días seguidos cumpliendo el objetivo">🔥 ${st} ${st === 1 ? 'día' : 'días'}</span></div>
      <div class="progress" style="margin-bottom:0"><div style="width:${Math.min(100, today / s.dailyGoal * 100)}%"></div></div>` : ''}
    </div>`;
}

function showHome(error) {
  stopTimer();
  const s = getSettings(), stats = load(K.stats, {}), marks = load(K.marks, {}), saved = load(K.run, null);
  const qs = set?.preguntas || [];
  const bloques = uniq(qs.map(q => q.bloque)).sort(natCmp);
  const hasRef = qs.some(q => q.referencia);
  const failedCount = qs.filter(q => (stats[keyOf(q)]?.ko || 0) > 0).length;
  const markedCount = qs.filter(q => marks[keyOf(q)]).length;
  const plan = srsPlan(qs);
  const simPool = qs.filter(q => !s.simBloque || q.bloque === s.simBloque);
  const arts = articulosOf(), cards = [...qs, ...fichasOf()].map(asCard);
  const flashPlan = srsPlan(cards, c => c.key);
  const hasContent = qs.length || cards.length || arts.length;
  const origenTxt = { servidor: 'preguntas.json del servidor', archivo: 'archivo cargado', editado: 'editado en la app' }[set?.origen] || '';
  const penTxt = s.penaltyOn ? `−${fmtPen(s.penalty)} por fallo` : 'sin penalización';

  app.innerHTML = `
    <h1>${set ? esc(set.titulo) : 'Test de preguntas'}</h1>
    <div class="homenav"><button id="goStats">📊 Progreso</button><button id="goEditor">✏️ Editor</button><button id="goTheme">🎨 Tema</button><button id="goSettings">⚙️ Ajustes</button></div>
    ${error ? `<div class="card error">${esc(error)}</div>` : ''}
    ${saved ? `
    <div class="card notice">
      <b>Tienes un test a medias</b>
      <p class="muted">${MODOS[saved.sim ? 'simulacro' : saved.mode] || ''} · pregunta ${saved.i + 1} de ${saved.list.length} · ${fmtTime(saved.elapsed)} transcurridos</p>
      <div class="row"><button class="primary" id="resume">Reanudar</button><button id="discard">Descartar</button></div>
    </div>` : ''}
    ${hasContent ? dailyCardHTML() + `
    <div class="card">
      <div class="quick">
        <button class="quick-btn" id="srsBtn"><span class="qi">🧠</span><b>Repaso inteligente</b>
          <span class="muted">${plan.due.length || plan.fresh.length ? `${plan.due.length} para repasar · ${plan.fresh.length} nuevas` : 'Todo al día ✅'}</span></button>
        <button class="quick-btn" id="simBtn"><span class="qi">🎯</span><b>${esc(s.simNombre)}</b>
          <span class="muted">${Math.min(s.simPreguntas, simPool.length)} preguntas${s.simBloque ? ` de «${esc(s.simBloque)}»` : ''} · ${s.simMinutos ? s.simMinutos + ' min' : 'sin tiempo'} · ${penTxt}</span></button>
        ${feat('flash') ? `<button class="quick-btn" id="flashBtn"><span class="qi">🃏</span><b>Flashcards</b>
          <span class="muted">${flashPlan.due.length + flashPlan.fresh.length ? `${flashPlan.due.length} para repasar · ${flashPlan.fresh.length} nuevas` : 'Todo al día ✅'}</span></button>` : ''}
        ${feat('articulos') ? `<button class="quick-btn" id="artBtn"><span class="qi">📜</span><b>Artículos</b>
          <span class="muted">${arts.length ? `${arts.length} para rellenar huecos` : 'Memoriza artículos de ley'}</span></button>` : ''}
        ${feat('audio') ? `<button class="quick-btn" id="audioBtn"><span class="qi">🎧</span><b>Modo audio</b>
          <span class="muted">Escucha preguntas y respuestas</span></button>` : ''}
        ${feat('vf') ? `<button class="quick-btn" id="vfBtn"><span class="qi">⚡</span><b>Verdadero / Falso</b>
          <span class="muted">Repaso rápido${load(K.vf, {}).best ? ` · récord racha ${load(K.vf, {}).best}` : ''}</span></button>` : ''}
      </div>
    </div>` : ''}
    ${qs.length ? `
    <div class="card">
      <h2>Test personalizado</h2>
      <div class="modes">
        <label class="mode-card"><input type="radio" name="mode" value="practica" checked><span class="t">📝 Práctica</span><span class="d">Ves la solución tras cada pregunta</span></label>
        <label class="mode-card"><input type="radio" name="mode" value="examen"><span class="t">🎓 Examen</span><span class="d">Nota y soluciones al final</span></label>
      </div>
      <label class="opt" id="minRow" hidden>Tiempo límite (min, 0 = sin límite): <input id="minutes" type="number" min="0" value="0"></label>
      <hr class="sep">
      ${bloques.length ? `<label class="opt">Bloque: <select id="bloque"><option value="">Todos</option>${bloques.map(b => `<option>${esc(b)}</option>`).join('')}</select></label>` : ''}
      <label class="opt" id="temaRow">Tema: <select id="tema"></select></label>
      ${hasRef ? '<label class="opt">Referencia: <input type="text" id="refFilter" placeholder="p. ej. 39/2015 o CE" style="flex:1;min-width:0"></label>' : ''}
      <label class="opt">Nº de preguntas: <input id="num" type="number" min="1" max="${qs.length}" value="${Math.min(qs.length, 20)}"></label>
      <label class="opt"><input id="shq" type="checkbox" checked> Barajar preguntas</label>
      <label class="opt"><input id="sho" type="checkbox" checked> Barajar opciones</label>
      <label class="opt"><input id="onlyKo" type="checkbox"> Solo las que he fallado alguna vez (${failedCount})</label>
      <label class="opt"><input id="onlyMarked" type="checkbox"> Solo las marcadas ★ (${markedCount})</label>
      ${feat('recall') ? `<label class="opt"><input id="recall" type="checkbox" ${load(K.settings, {}).recall ? 'checked' : ''}> 🧠 Recuerdo activo: piensa la respuesta antes de ver las opciones</label>` : ''}
      <p class="muted">Penalización: ${penTxt} · <a href="#" id="penLink">cambiar</a></p>
      <button class="primary" id="start">Empezar</button>
    </div>` : ''}
    <div class="card">
      <div class="drop" id="drop">
        <p style="margin-top:0">Arrastra aquí tu archivo <b>.json</b> o</p>
        <label class="filebtn">📂 Elegir archivo<input type="file" id="file" accept=".json,application/json" hidden></label>
      </div>
      <p class="help">Esto carga las preguntas solo en este dispositivo. Para que sean las de todos, usa ✏️ Editor → 📥 Importar JSON.</p>
      <details style="margin-top:12px"><summary class="muted">…o pega el JSON</summary>
        <textarea id="paste" rows="8" style="margin-top:8px;font-family:monospace"></textarea>
        <button id="pasteBtn">Cargar</button>
      </details>
      ${serverAvailable && set?.origen !== 'servidor' ? `<p><button id="useServer" class="small">Volver a usar preguntas.json del servidor</button></p>` : ''}
    </div>`;

  $('goStats').onclick = showStats;
  $('goTheme').onclick = showTheme;
  $('goSettings').onclick = showSettings;
  $('goEditor').onclick = () => openEditor();
  const drop = $('drop');
  $('file').onchange = e => e.target.files[0] && readFile(e.target.files[0]);
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); e.dataTransfer.files[0] && readFile(e.dataTransfer.files[0]); };
  $('pasteBtn').onclick = () => {
    try { useData(JSON.parse($('paste').value), 'archivo'); showHome(); } catch (e) { showHome('JSON no válido: ' + e.message); }
  };
  if ($('useServer')) $('useServer').onclick = () => {
    if (set?.origen === 'editado' && !confirm('Perderás los cambios hechos en el editor que no estén guardados en GitHub. ¿Continuar?')) return;
    fetchServerSet().then(d => { useData(d, 'servidor'); showHome(); }).catch(() => showHome('No se pudo leer preguntas.json'));
  };
  if (saved) {
    $('resume').onclick = () => { run = normalizeRun(saved); showQuestion(); };
    $('discard').onclick = () => { if (confirm('¿Descartar el test a medias?')) { localStorage.removeItem(K.run); showHome(); } };
  }
  if (!hasContent) return;

  const confirmDiscard = () => !saved || confirm('Se descartará el test a medias. ¿Empezar uno nuevo?');
  const needQs = fn => () => qs.length ? fn() : alert('Primero añade preguntas tipo test en ✏️ Editor.');
  if ($('flashBtn')) $('flashBtn').onclick = () => showStudySetup('flash');
  if ($('audioBtn')) $('audioBtn').onclick = () => showStudySetup('audio');
  if ($('vfBtn')) $('vfBtn').onclick = needQs(() => showStudySetup('vf'));
  if ($('artBtn')) $('artBtn').onclick = () => showArticles();
  if (!qs.length) {
    $('srsBtn').onclick = $('simBtn').onclick = needQs(() => {});
    return;
  }
  $('penLink').onclick = e => { e.preventDefault(); showSettings(); };

  $('srsBtn').onclick = () => { if (confirmDiscard()) showSrsSetup(); };
  $('simBtn').onclick = () => {
    if (!confirmDiscard()) return;
    if (!simPool.length) return alert(`No hay preguntas del bloque «${s.simBloque}». Cámbialo en ⚙️ Ajustes → Simulacro.`);
    startRun(shuffle(simPool).slice(0, s.simPreguntas), {
      mode: 'examen', minutes: s.simMinutos, label: s.simNombre === MODOS.simulacro ? '' : s.simNombre,
      sim: { nombre: s.simNombre, corte: s.simCorte }
    });
  };

  // Temas dependientes del bloque elegido
  const fillTemas = () => {
    const b = $('bloque')?.value || '';
    const temas = uniq(qs.filter(q => !b || q.bloque === b).map(q => q.tema)).sort(natCmp);
    $('tema').innerHTML = `<option value="">Todos</option>${temas.map(t => `<option>${esc(t)}</option>`).join('')}`;
    $('temaRow').hidden = !temas.length;
  };
  fillTemas();
  if ($('bloque')) $('bloque').onchange = fillTemas;

  document.querySelectorAll('input[name=mode]').forEach(r => r.onchange = () => { $('minRow').hidden = r.value !== 'examen' || !r.checked; });
  $('start').onclick = () => {
    if (!confirmDiscard()) return;
    const bloque = $('bloque')?.value || '', tema = $('tema').value, refRaw = ($('refFilter')?.value || '').trim(), ref = refRaw.toLowerCase();
    let list = qs.filter(q => (!bloque || q.bloque === bloque) && (!tema || q.tema === tema) && (!ref || (q.referencia || '').toLowerCase().includes(ref)));
    if ($('onlyKo').checked) list = list.filter(q => (stats[keyOf(q)]?.ko || 0) > 0);
    if ($('onlyMarked').checked) list = list.filter(q => marks[keyOf(q)]);
    if (!list.length) return alert('No hay preguntas con esos filtros.');
    if ($('shq').checked) list = shuffle(list);
    list = list.slice(0, Math.max(1, +$('num').value || list.length));
    const mode = document.querySelector('input[name=mode]:checked').value;
    const recall = !!$('recall')?.checked;
    if ($('recall')) saveSettings({ recall });
    startRun(list, {
      recall,
      shuffleOpts: $('sho').checked, mode, minutes: mode === 'examen' ? +$('minutes').value || 0 : 0,
      label: [bloque, tema, refRaw && `ref. «${refRaw}»`].filter(Boolean).join(' · ')
    });
  };
}

// ---------- Repaso inteligente: elegir bloque y tema ----------
const fmtNextDay = t => new Date(t).toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });

function showSrsSetup() {
  stopTimer();
  onKey = null;
  const s = getSettings(), qs = set?.preguntas || [], last = load(K.settings, {}).study_srs || {};
  const bloques = uniq(qs.map(q => q.bloque)).sort(natCmp);
  app.innerHTML = `
    <div class="row between"><h1>🧠 Repaso inteligente</h1><button id="home">← Inicio</button></div>
    <div class="card">
      <p class="help" style="margin-top:0">Primero salen las preguntas que te tocan hoy (las falladas y las que hace tiempo que no ves) y después algunas nuevas.</p>
      ${bloques.length ? `<div class="set-row"><span>Bloque</span><select id="bloque"><option value="">Todos</option>${bloques.map(b => `<option ${b === last.bloque ? 'selected' : ''}>${esc(b)}</option>`).join('')}</select></div>` : ''}
      <div class="set-row" id="temaRow"><span>Tema</span><select id="tema"></select></div>
      <div class="set-row"><span>Cuántas</span><input type="number" id="count" min="1" value="${last.count || s.srsSize}"></div>
      <div class="ghstatus" id="srsInfo" style="margin:8px 0 12px"></div>
      <button class="primary" id="go" style="width:100%">Empezar</button>
    </div>`;
  $('home').onclick = () => showHome();
  const pool = () => {
    const b = $('bloque')?.value || '', t = $('tema').value;
    return qs.filter(q => (!b || q.bloque === b) && (!t || q.tema === t));
  };
  const info = () => {
    const p = srsPlan(pool());
    $('srsInfo').innerHTML = p.due.length || p.fresh.length
      ? `<b>${p.due.length}</b> para repasar hoy · <b>${p.fresh.length}</b> nuevas`
      : `¡Todo al día en esta selección! 🎉${isFinite(p.next) ? ` Próximo repaso: ${fmtNextDay(p.next)}.` : ''}`;
    $('go').disabled = !p.due.length && !p.fresh.length;
  };
  const fillTemas = (keep) => {
    const b = $('bloque')?.value || '';
    const temas = uniq(qs.filter(q => !b || q.bloque === b).map(q => q.tema)).sort(natCmp);
    $('tema').innerHTML = `<option value="">Todos</option>${temas.map(t => `<option ${t === keep ? 'selected' : ''}>${esc(t)}</option>`).join('')}`;
    $('temaRow').hidden = !temas.length;
    info();
  };
  fillTemas(last.tema);
  if ($('bloque')) $('bloque').onchange = () => fillTemas();
  $('tema').onchange = info;
  $('go').onclick = () => {
    const b = $('bloque')?.value || '', t = $('tema').value, count = Math.max(1, +$('count').value || s.srsSize);
    saveSettings({ study_srs: { bloque: b, tema: t, count } });
    const p = srsPlan(pool());
    startRun([...p.due, ...shuffle(p.fresh)].slice(0, count), { mode: 'practica', kind: 'repaso', label: t || b });
  };
}

// ---------- Test ----------
function startRun(list, { shuffleOpts = true, mode = 'practica', minutes = 0, label = '', sim = null, kind = null, recall = false }) {
  const s = getSettings();
  run = {
    list: list.map(q => {
      const order = q.opciones.map((_, i) => i);
      return { q, order: shuffleOpts && !fixedOrder(q) ? shuffle(order) : order };
    }),
    i: 0, answers: list.map(() => null), doubt: list.map(() => false),
    mode, kind, label, sim, titulo: set.titulo,
    recall, shown: list.map(() => false),
    penalty: s.penaltyOn ? s.penalty : 0,
    limit: minutes ? minutes * 60 : null, elapsed: 0
  };
  saveRun();
  showQuestion();
}

// Tests guardados con versiones anteriores de la app
function normalizeRun(r) {
  r.doubt ||= r.list.map(() => false);
  r.penalty ??= 0;
  r.label ??= r.tema || '';
  r.shown ||= r.list.map(() => false);
  return r;
}

const saveRun = () => save(K.run, run);

function startTimer() {
  if (timerId) return;
  timerId = setInterval(() => {
    run.elapsed++;
    saveRun();
    updateTimer();
    if (run.limit && run.elapsed >= run.limit) { alert('¡Se acabó el tiempo!'); finish(); }
  }, 1000);
}
function stopTimer() { clearInterval(timerId); timerId = null; }
function updateTimer() {
  const el = $('timer');
  if (!el) return;
  if (run.limit) {
    const left = Math.max(0, run.limit - run.elapsed);
    el.textContent = '⏱ ' + fmtTime(left);
    el.classList.toggle('low', left <= 60);
  } else el.textContent = '⏱ ' + fmtTime(run.elapsed);
}

const doubtLabel = on => on ? '🤔 Marcada como dudosa' : '🤔 Marcar como dudosa';

function showQuestion() {
  if (run.limit && run.elapsed >= run.limit) return finish();
  const { q, order } = run.list[run.i];
  const n = run.list.length, exam = run.mode === 'examen', ans = run.answers[run.i];
  const answered = run.answers.filter(a => a !== null).length;
  // Recuerdo activo: las opciones se ocultan hasta que la persona intenta recordar la respuesta
  const hideOpts = run.recall && !run.shown[run.i] && ans === null;

  app.innerHTML = `
    <div class="topbar">
      <div><b>${run.i + 1}</b><span class="muted"> / ${n}</span>${q.tema ? ` <span class="tag">${esc(q.tema)}</span>` : ''}</div>
      <div class="row" style="flex-wrap:nowrap"><span class="timer" id="timer"></span>${starBtn(q, 'star')}<button class="small" id="quit">Pausar</button></div>
    </div>
    <div class="progress"><div style="width:${(exam ? answered : run.i) / n * 100}%"></div></div>
    <div class="card">
      ${run.sim ? `<div class="muted" style="margin-bottom:6px">🎯 ${esc(run.sim.nombre)}</div>` : ''}
      <div class="q">${esc(q.pregunta)}</div>
      ${hideOpts ? `
      <div class="recall-box">
        <p>🧠 Intenta recordar la respuesta antes de ver las opciones.</p>
        <button class="primary" id="showOpts">👀 Ver opciones</button>
      </div>` : `
      <div class="options">${order.map((orig, k) =>
        `<button data-orig="${orig}" class="${exam && ans === orig ? 'sel' : ''}"><span class="letter">${'ABCDEFGH'[k]}</span><span>${esc(q.opciones[orig])}</span></button>`).join('')}
      </div>`}
      <div class="row" style="margin-top:12px"><button class="chip ${run.doubt[run.i] ? 'on' : ''}" id="doubt">${doubtLabel(run.doubt[run.i])}</button></div>
      <div id="after"></div>
    </div>
    ${exam ? `
    <div class="card">
      <div class="row between">
        <button id="prev" ${run.i === 0 ? 'disabled' : ''}>← Anterior</button>
        <button class="primary" id="finishBtn">Terminar</button>
        <button id="next" ${run.i === n - 1 ? 'disabled' : ''}>Siguiente →</button>
      </div>
      <div class="navgrid">${run.list.map((_, k) =>
        `<button data-k="${k}" class="${run.answers[k] !== null ? 'done' : ''} ${k === run.i ? 'cur' : ''} ${run.doubt[k] ? 'doubt' : ''}">${k + 1}</button>`).join('')}</div>
      ${run.penalty ? `<p class="muted" style="margin-bottom:0">Cada fallo resta ${fmtPen(run.penalty)}. Las preguntas en blanco no restan.</p>` : ''}
    </div>` : ''}`;

  bindStar($('star'), q);
  $('quit').onclick = () => { saveRun(); showHome(); };
  $('doubt').onclick = () => {
    run.doubt[run.i] = !run.doubt[run.i];
    saveRun();
    $('doubt').classList.toggle('on', run.doubt[run.i]);
    $('doubt').textContent = doubtLabel(run.doubt[run.i]);
    app.querySelector(`.navgrid [data-k="${run.i}"]`)?.classList.toggle('doubt', run.doubt[run.i]);
  };
  updateTimer();
  startTimer();
  if ($('showOpts')) $('showOpts').onclick = () => { run.shown[run.i] = true; saveRun(); showQuestion(); };

  const opts = app.querySelectorAll('.options button');
  if (exam) {
    opts.forEach(b => b.onclick = () => {
      const o = +b.dataset.orig;
      run.answers[run.i] = run.answers[run.i] === o ? null : o; // pulsar de nuevo la deja en blanco
      saveRun(); showQuestion();
    });
    const go = k => { run.i = k; saveRun(); showQuestion(); };
    $('prev').onclick = () => go(run.i - 1);
    $('next').onclick = () => go(run.i + 1);
    app.querySelectorAll('.navgrid button').forEach(b => b.onclick = () => go(+b.dataset.k));
    $('finishBtn').onclick = () => {
      const blank = run.answers.filter(a => a === null).length;
      if (confirm(blank ? `Tienes ${blank} sin responder. ¿Terminar?` : '¿Terminar el examen?')) finish();
    };
  } else {
    opts.forEach(b => b.onclick = () => {
      const chosen = +b.dataset.orig, ok = chosen === q.correcta;
      run.answers[run.i] = chosen;
      updateStats(q, ok, chosen);
      srsUpdate(q, ok);
      addDaily(1);
      saveRun();
      showFeedback();
    });
    if (ans !== null) showFeedback(); // al reanudar una pregunta ya respondida
  }
}

const refHTML = q => q.referencia ? `<div class="ref">📖 ${esc(q.referencia)}</div>` : '';

// Truco compartido (del JSON) y nota personal (solo en este dispositivo)
const myNote = key => load(K.notes, {})[key] || '';
function notesHTML(item, key) {
  if (!feat('notas')) return '';
  const n = myNote(key);
  return `${item.truco ? `<div class="truco">💡 <b>Truco:</b> ${esc(item.truco)}</div>` : ''}
    ${n ? `<div class="truco mine">📝 <b>Mi nota:</b> ${esc(n)}</div>` : ''}
    <button class="chip note-btn" data-key="${esc(key)}">📝 ${n ? 'Editar mi nota' : 'Añadir mi nota o truco'}</button>`;
}
// Los botones "mi nota" de la pantalla: pedir el texto y volver a pintar con `redraw`
function bindNoteBtns(root, redraw) {
  root.querySelectorAll('.note-btn').forEach(b => b.onclick = () => {
    const key = b.dataset.key, cur = myNote(key);
    const v = prompt('Tu nota o truco para recordar esta pregunta (solo se guarda en este dispositivo).\nDéjalo vacío para borrarla.', cur);
    if (v === null) return;
    const notes = load(K.notes, {});
    if (v.trim()) notes[key] = v.trim(); else delete notes[key];
    save(K.notes, notes);
    redraw();
  });
}

// "Sueles confundir…": cuántas veces se ha elegido esta misma opción incorrecta
function confusionHTML(q, chosen) {
  if (!feat('confusion') || chosen === null || chosen === q.correcta) return '';
  const n = load(K.stats, {})[keyOf(q)]?.wrong?.[q.opciones[chosen]] || 0;
  return n >= 2 ? `<div class="confusion">⚠️ Ya has elegido <b>«${esc(q.opciones[chosen])}»</b> ${n} veces en esta pregunta. Fíjate bien: la correcta es <b>«${esc(q.opciones[q.correcta])}»</b>.</div>` : '';
}

function showFeedback() {
  const { q } = run.list[run.i], chosen = run.answers[run.i], ok = chosen === q.correcta;
  app.querySelectorAll('.options button').forEach(b => {
    b.disabled = true; b.style.opacity = 1;
    const o = +b.dataset.orig;
    if (o === q.correcta) b.classList.add('ok');
    else if (o === chosen) b.classList.add('ko');
  });
  const last = run.i === run.list.length - 1;
  $('after').innerHTML = `
    <div class="explain ${ok ? '' : 'wrong'}"><b>${ok ? '✔ ¡Correcto!' : '✘ Incorrecto'}</b>${q.explicacion ? '\n' + esc(q.explicacion) : ''}${refHTML(q)}</div>
    ${confusionHTML(q, chosen)}
    <div class="notes">${notesHTML(q, keyOf(q))}</div>
    <div class="row" style="margin-top:16px;justify-content:flex-end"><button class="primary" id="next">${last ? 'Ver resultado' : 'Siguiente →'}</button></div>`;
  bindNoteBtns($('after'), showFeedback);
  const next = $('next');
  next.focus();
  next.onclick = () => {
    if (last) return finish();
    run.i++; saveRun(); showQuestion();
  };
}

function updateStats(q, ok, chosen = null) {
  const stats = load(K.stats, {});
  const s = stats[keyOf(q)] ||= { ok: 0, ko: 0 };
  ok ? s.ok++ : s.ko++;
  if (!ok && chosen !== null) {
    s.wrong ||= {};
    const txt = q.opciones[chosen];
    s.wrong[txt] = (s.wrong[txt] || 0) + 1;
  }
  save(K.stats, stats);
}

function finish() {
  stopTimer();
  const results = run.list.map((it, k) => ({ q: it.q, chosen: run.answers[k], ok: run.answers[k] === it.q.correcta, doubt: !!run.doubt[k] }));
  if (run.mode === 'examen') {
    const answered = results.filter(r => r.chosen !== null);
    answered.forEach(r => { updateStats(r.q, r.ok, r.chosen); srsUpdate(r.q, r.ok); });
    addDaily(answered.length);
  }
  const aciertos = results.filter(r => r.ok).length, blancos = results.filter(r => r.chosen === null).length;
  const fallos = results.length - aciertos - blancos;
  const dud = results.filter(r => r.doubt && r.chosen !== null);
  const nota = calcNota(aciertos, fallos, results.length, run.penalty);
  const entry = {
    fecha: Date.now(), titulo: run.titulo, modo: run.sim ? 'simulacro' : run.kind || run.mode, tema: run.label,
    total: results.length, aciertos, fallos, blancos, segundos: run.elapsed,
    penalty: run.penalty, nota, dudosas: dud.length, dudosasOk: dud.filter(r => r.ok).length,
    ...(run.sim ? { corte: run.sim.corte, apto: nota >= run.sim.corte } : {})
  };
  const hist = load(K.hist, []);
  hist.push(entry);
  save(K.hist, hist);
  localStorage.removeItem(K.run);
  const meta = run;
  run = null;
  showResult(results, entry, meta);
}

// ---------- Resultado ----------
// ¿Compensó responder las dudosas? Ganancia neta en "aciertos" respecto a dejarlas en blanco
function doubtAdviceHTML(n, ok, pen, total) {
  const ko = n - ok, gain = ok - ko * pen;
  let txt = `Marcaste <b>${n}</b> como dudosas: acertaste <b>${ok}</b> y fallaste <b>${ko}</b>. `;
  if (!pen) txt += 'Sin penalización siempre compensa responder. 👍';
  else if (gain > 0) txt += `Responderlas te sumó <b>+${fmtNum(gain)}</b> aciertos netos (+${fmtNum(gain / total * 10)} en la nota): hiciste bien en arriesgar. 👍`;
  else if (gain < 0) txt += `Dejándolas en blanco habrías sacado <b>${fmtNum(-gain / total * 10)}</b> puntos más de nota. Con este nivel de duda, mejor no arriesgar. ✋`;
  else txt += 'Te dio igual responderlas que dejarlas en blanco.';
  return `<p style="margin:0">${txt}</p>`;
}

function showResult(results, entry, meta) {
  const bad = results.filter(r => !r.ok), doubts = results.filter(r => r.doubt);
  const corte = entry.corte ?? 5, nota = entry.nota;
  app.innerHTML = `
    <h1>Resultado</h1>
    <div class="card">
      ${meta.sim ? `<div class="verdict ${entry.apto ? 'ok' : 'ko'}">${entry.apto ? '✅ APTO' : '❌ NO APTO'} · nota de corte ${fmtNum(corte)}</div>` : ''}
      <div class="score">
        <div class="ring" style="--p:${nota * 10};--c:var(--${nota >= corte ? 'ok' : 'ko'})"><div>${fmtNum(nota)}</div></div>
        <div>
          <div class="big">${entry.aciertos} / ${entry.total}</div>
          <div>${['Toca repasar 💪', 'Vas por buen camino 👍', '¡Muy bien! 🎉', '¡Perfecto! 🏆'][Math.min(3, Math.floor(nota * 10 / 34) + (entry.aciertos === entry.total ? 1 : 0))]}</div>
        </div>
      </div>
      <p class="muted">Nota ${fmtNum(nota)} / 10 · ${entry.fallos} fallos${entry.penalty ? ` (−${fmtNum(entry.fallos * entry.penalty)})` : ''}${entry.blancos ? ` · ${entry.blancos} en blanco` : ''} · ${fmtTime(entry.segundos)}
        ${entry.penalty ? `<br>Penalización: −${fmtPen(entry.penalty)} por fallo` : ''}</p>
      <div class="row">
        ${bad.length ? '<button class="primary" id="retry">Repetir las falladas</button>' : ''}
        <button id="home">Inicio</button>
        <button id="stats">📊 Progreso</button>
      </div>
    </div>
    ${entry.dudosas ? `<div class="card"><h2>🤔 Dudosas</h2>${doubtAdviceHTML(entry.dudosas, entry.dudosasOk, entry.penalty, entry.total)}</div>` : ''}
    <div class="card">
      <div class="row between"><h2>Revisión</h2>
        <select id="reviewFilter">
          <option value="bad" ${bad.length ? 'selected' : ''}>Falladas y en blanco (${bad.length})</option>
          ${doubts.length ? `<option value="doubt">Dudosas (${doubts.length})</option>` : ''}
          <option value="all" ${bad.length ? '' : 'selected'}>Todas (${results.length})</option>
        </select></div>
      <div id="reviewList"></div>
    </div>`;

  const renderReview = () => {
    const f = $('reviewFilter').value, list = f === 'bad' ? bad : f === 'doubt' ? doubts : results;
    $('reviewList').innerHTML = list.length ? list.map((r, k) => `
      <div class="review">
        <div class="row between" style="flex-wrap:nowrap;align-items:flex-start"><b style="white-space:pre-wrap">${esc(r.q.pregunta)}</b>${starBtn(r.q).replace('<button', `<button data-k="${k}"`)}</div>
        ${r.doubt ? '<span class="tag doubt">🤔 dudosa</span>' : ''}
        ${r.chosen === null ? '<div class="muted">Sin responder</div>'
          : `<div style="color:var(--${r.ok ? 'ok' : 'ko'})">${r.ok ? '✔' : '✘'} Tu respuesta: ${esc(r.q.opciones[r.chosen])}</div>`}
        ${r.ok ? '' : `<div style="color:var(--ok)">Correcta: ${esc(r.q.opciones[r.q.correcta])}</div>`}
        ${r.q.explicacion ? `<div class="muted" style="white-space:pre-wrap">${esc(r.q.explicacion)}</div>` : ''}
        ${refHTML(r.q)}
        <div class="notes">${notesHTML(r.q, keyOf(r.q))}</div>
      </div>`).join('') : '<p class="muted">¡Sin fallos! 🎉</p>';
    $('reviewList').querySelectorAll('.star').forEach(b => bindStar(b, list[+b.dataset.k].q));
    bindNoteBtns($('reviewList'), renderReview);
  };
  $('reviewFilter').onchange = renderReview;
  renderReview();

  $('home').onclick = () => showHome();
  $('stats').onclick = showStats;
  if (bad.length) $('retry').onclick = () =>
    startRun(shuffle(bad.map(r => r.q)), { mode: meta.mode, label: 'Repetir falladas' });
}

// ---------- Progreso ----------
function heatmapHTML(weeks = 18) {
  const d = load(K.daily, {}), goal = getSettings().dailyGoal;
  const today = new Date(startOfToday());
  const start = new Date(today);
  start.setDate(start.getDate() - (weeks - 1) * 7 - ((today.getDay() + 6) % 7)); // lunes de hace N semanas
  const max = Math.max(1, ...Object.values(d));
  let cells = '';
  for (let i = 0, day = new Date(start); i < weeks * 7; i++, day.setDate(day.getDate() + 1)) {
    const k = todayKey(day), n = d[k] || 0, future = day > today;
    const r = goal ? n / goal : n / max;
    const lvl = !n ? 0 : r >= 1 ? 4 : r >= .66 ? 3 : r >= .33 ? 2 : 1;
    cells += `<i class="l${lvl} ${future ? 'future' : ''} ${+day === +today ? 'today' : ''}" title="${day.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' })}: ${n} preguntas"></i>`;
  }
  return `<div class="heat" role="img" aria-label="Preguntas respondidas por día en las últimas ${weeks} semanas">${cells}</div>

// Opciones incorrectas que se eligen una y otra vez en la misma pregunta
function confusionsCardHTML() {
  if (!feat('confusion')) return '';
  const stats = load(K.stats, {});
  const list = (set?.preguntas || []).flatMap(q => Object.entries(stats[keyOf(q)]?.wrong || {})
    .filter(([, n]) => n >= 2).map(([opt, n]) => ({ q, opt, n })))
    .sort((a, b) => b.n - a.n).slice(0, 10);
  if (!list.length) return '';
  return `<div class="card">
    <h2>⚠️ Lo que más confundes</h2>
    <p class="help">Respuestas incorrectas que has elegido varias veces en la misma pregunta.</p>
    ${list.map(c => `<div class="review">
      <div><b>${esc(c.q.pregunta)}</b></div>
      <div style="color:var(--ko)">✘ «${esc(c.opt)}» <span class="muted">· ${c.n} veces</span></div>
      <div style="color:var(--ok)">✔ «${esc(c.q.opciones[c.q.correcta])}»</div>
    </div>`).join('')}
  </div>`;
}

function dominioHTML() {
  const qs = set?.preguntas || [], srs = load(K.srs, {}), stats = load(K.stats, {});
  if (!qs.length) return '<p class="muted">No hay preguntas cargadas.</p>';
  const groups = {};
  qs.forEach(q => {
    const g = ((groups[q.bloque || ''] ||= {})[q.tema || 'Sin tema'] ||= { n: 0, dom: 0, ok: 0, ko: 0 });
    g.n++;
    if ((srs[keyOf(q)]?.box || 0) >= 3) g.dom++;
    const st = stats[keyOf(q)];
    if (st) { g.ok += st.ok; g.ko += st.ko; }
  });
  return Object.keys(groups).sort(natCmp).map(b => {
    const temas = Object.entries(groups[b]).sort((x, y) => natCmp(x[0], y[0]));
    const tot = temas.reduce((a, [, g]) => ({ n: a.n + g.n, dom: a.dom + g.dom }), { n: 0, dom: 0 });
    return (b ? `<div class="bloque-h"><b>${esc(b)}</b><span class="muted">${pct(tot.dom, tot.n)}% dominado</span></div>` : '') +
      temas.map(([t, g]) => `
        <div class="bar-row"><span>${esc(t)} <span class="muted">(${g.n})</span></span>
          <div class="bar"><div style="width:${pct(g.dom, g.n)}%"></div></div>
          <span class="muted" style="text-align:right">${pct(g.dom, g.n)}%${g.ok + g.ko ? ` · ✓${pct(g.ok, g.ok + g.ko)}%` : ''}</span></div>`).join('');
  }).join('');
}

function lineChart(h, corte) {
  const W = 600, H = 220, L = 34, R = 12, T = 12, B = 28, n = h.length;
  const x = i => L + i * (W - L - R) / (n - 1);
  const y = v => T + (10 - v) * (H - T - B) / 10;
  const grid = [0, 2.5, 5, 7.5, 10].map(v =>
    `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>
     <text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtNum(v, 1)}</text>`).join('');
  const pts = h.map((e, i) => [x(i), y(entryNota(e))]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const dl = t => new Date(t).toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Nota sobre 10 de cada test">
    ${grid}
    ${corte != null ? `<line x1="${L}" x2="${W - R}" y1="${y(corte)}" y2="${y(corte)}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="${W - R}" y="${y(corte) - 5}" text-anchor="end" font-size="11" fill="var(--muted)">corte ${fmtNum(corte)}</text>` : ''}
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${h[i].modo === 'simulacro' ? 'var(--card)' : 'var(--accent)'}" stroke="${h[i].modo === 'simulacro' ? 'var(--accent)' : 'var(--card)'}" stroke-width="2"/>
      <circle class="hit" data-i="${i}" cx="${p[0]}" cy="${p[1]}" r="14" fill="transparent" style="cursor:pointer"/>`).join('')}
    <text x="${L}" y="${H - 8}" font-size="11" fill="var(--muted)">${dl(h[0].fecha)}</text>
    <text x="${W - R}" y="${H - 8}" text-anchor="end" font-size="11" fill="var(--muted)">${dl(h[n - 1].fecha)}</text>
  </svg>${h.some(e => e.modo === 'simulacro') ? '<p class="help" style="margin-bottom:0">○ simulacro · ● otros tests</p>' : ''}`;
}

function bindChart(h) {
  const wrap = $('chart'), tip = $('tip');
  wrap.querySelectorAll('.hit').forEach(c => {
    c.onmouseenter = c.onclick = () => {
      const e = h[+c.dataset.i], wr = wrap.getBoundingClientRect(), cr = c.getBoundingClientRect();
      tip.innerHTML = `<b>${fmtNum(entryNota(e))}</b> · ${e.aciertos}/${e.total}${e.modo === 'simulacro' ? (e.apto ? ' · APTO' : ' · NO APTO') : ''}<br><span class="muted">${fmtDate(e.fecha)} · ${MODOS[e.modo] || ''}</span>`;
      tip.style.left = Math.min(Math.max(cr.left - wr.left + cr.width / 2, 80), wr.width - 80) + 'px';
      tip.style.top = (cr.top - wr.top + cr.height / 2 - 6) + 'px';
      tip.hidden = false;
    };
    c.onmouseleave = () => tip.hidden = true;
  });
}

function exportBackup() {
  const data = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k.startsWith(P) && k !== K.gh) data[k.slice(P.length)] = localStorage.getItem(k);
  }
  const blob = new Blob([JSON.stringify({ app: 'test-preguntas', version: 2, entorno: ENV, fecha: new Date().toISOString(), data })], { type: 'application/json' });
  downloadBlob(blob, `copia-tests-${todayKey()}.json`);
}

function importBackup(file) {
  file.text().then(t => {
    const b = JSON.parse(t);
    if (b.app !== 'test-preguntas' || !b.data) throw new Error('el archivo no es una copia de seguridad de esta app.');
    if (!confirm(`Copia del ${new Date(b.fecha).toLocaleString('es-ES')}. Se sustituirá el progreso de este dispositivo. ¿Continuar?`)) return;
    Object.keys(localStorage).filter(k => k.startsWith(P) && k !== K.gh).forEach(k => localStorage.removeItem(k));
    // v1 guardaba las claves con "quiz."; v2 sin prefijo. Se importan al entorno actual.
    for (const [k, v] of Object.entries(b.data)) {
      const name = k.replace(/^quiz(dev)?\./, '');
      if (P + name !== K.gh) localStorage.setItem(P + name, v);
    }
    location.reload();
  }).catch(e => alert('No se pudo importar: ' + e.message));
}

function defaultRepo() {
  const user = location.hostname.match(/^([^.]+)\.github\.io$/)?.[1];
  const repo = location.pathname.split('/').filter(Boolean)[0];
  return user && repo && !repo.includes('.') ? `${user}/${repo}` : 'dcg64-ua/app-test-preguntas';
}
const b64encode = s => { let bin = ''; new TextEncoder().encode(s).forEach(b => bin += String.fromCharCode(b)); return btoa(bin); };
const b64decode = b => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g, '')), c => c.charCodeAt(0)));

async function ghApi(method, body, cfg = ghConfig()) {
  const res = await fetch(`https://api.github.com/repos/${cfg.repo}/contents/preguntas.json${method === 'GET' ? '?ref=main' : ''}`, {
    method, cache: 'no-store',
    headers: { Authorization: `Bearer ${cfg.token}`, Accept: 'application/vnd.github+json' },
    body: body ? JSON.stringify({ ...body, branch: 'main' }) : undefined
  });
  if (!res.ok) {
    const e = new Error({
      401: 'El token no es válido o ha caducado.',
      403: 'El token no tiene permiso de escritura (necesita «Contents: Read and write»).',
      404: 'No se encuentra el repositorio o el token no tiene acceso a él.'
    }[res.status] || `GitHub respondió con error ${res.status}.`);
    e.status = res.status;
    throw e;
  }
  return res.json();
}

async function ghPull(cfg) {
  const d = await ghApi('GET', null, cfg);
  ghSha = d.sha;
  return JSON.parse(b64decode(d.content));
}

async function ghPush(message, force = false) {
  if (force) ghSha = (await ghApi('GET')).sha;
  if (!ghSha) throw Object.assign(new Error('conflicto'), { status: 409 });
  const content = b64encode(JSON.stringify(setToJSON(), null, 2) + '\n');
  const d = await ghApi('PUT', { message, content, sha: ghSha });
  ghSha = d.content.sha;
  set.origen = 'servidor';
  save(K.set, set);
}

function setGhStatus(type, text, retry) {
  ghStatus = { type, text, retry };
  const el = $('ghStatus');
  if (el) { el.innerHTML = ghStatusHTML(); bindGhStatus(); }
}

function ghFail(e) {
  if (e.status === 409 || e.status === 422)
    setGhStatus('conflict', 'Las preguntas de GitHub han cambiado desde otro sitio. Elige qué versión quieres conservar.');
  else
    setGhStatus('error', (e.status ? e.message : 'Sin conexión con GitHub.') + ' Tus cambios están guardados en este dispositivo.',
      () => publish('Actualizar preguntas desde la app'));
}

// Se llama tras cada cambio en el editor
function publish(message) {
  if (!ghConnected()) return;
  setGhStatus('busy', 'Guardando en GitHub…');
  ghQueue = ghQueue
    .then(() => ghPush(message))
    .then(() => setGhStatus('ok', '✓ Guardado en GitHub. Le llegará a todo el mundo en unos minutos.'))
    .catch(ghFail);
}

function ghStatusHTML() {
  if (!ghConnected() || !ghStatus) return '';
  const s = ghStatus;
  const btns = s.type === 'conflict' || s.type === 'pending'
    ? '<div class="row" style="margin-top:8px"><button class="small primary" id="ghMine">Subir la de este dispositivo</button><button class="small" id="ghTheirs">Usar la de GitHub</button></div>'
    : s.retry ? '<div class="row" style="margin-top:8px"><button class="small" id="ghRetry">Reintentar</button></div>' : '';
  return `<div class="ghstatus ${s.type}">${esc(s.text)}${btns}</div>`;
}

function bindGhStatus() {
  if ($('ghMine')) $('ghMine').onclick = () => {
    setGhStatus('busy', 'Subiendo la versión de este dispositivo…');
    ghQueue = ghQueue.then(() => ghPush('Actualizar preguntas desde la app', true))
      .then(() => setGhStatus('ok', '✓ Guardado en GitHub. Le llegará a todo el mundo en unos minutos.'))
      .catch(ghFail);
  };
  if ($('ghTheirs')) $('ghTheirs').onclick = () => {
    if (confirm('Se perderán los cambios de este dispositivo que no estén en GitHub. ¿Continuar?')) openEditor(true);
  };
  if ($('ghRetry')) $('ghRetry').onclick = ghStatus.retry;
}

function bindGhCard() {
  if ($('ghDisconnect')) $('ghDisconnect').onclick = () => {
    if (!confirm('Este dispositivo dejará de guardar en GitHub y se borrará el token. ¿Continuar?')) return;
    localStorage.removeItem(K.gh); ghStatus = null; ghSha = null; showEditor();
  };
  if ($('ghConnect')) $('ghConnect').onclick = async () => {
    const cfg = { repo: $('ghRepo').value.trim(), token: $('ghToken').value.trim() };
    if (!/^[\w.-]+\/[\w.-]+$/.test(cfg.repo) || !cfg.token) return $('ghErr').textContent = 'Rellena el repositorio (usuario/nombre) y el token.';
    $('ghConnect').disabled = true;
    $('ghErr').textContent = 'Comprobando…';
    try {
      await ghApi('GET', null, cfg);
      save(K.gh, cfg);
      openEditor();
    } catch (e) {
      $('ghErr').textContent = e.status ? e.message : 'No se pudo conectar con GitHub.';
      $('ghConnect').disabled = false;
    }
  };
}

// Guarda en el dispositivo y, si está conectado, también en GitHub
function persistEdit(message) {
  set.origen = 'editado';
  save(K.set, set);
  publish(message);
}

const downloadJSON = () => downloadBlob(new Blob([JSON.stringify(setToJSON(), null, 2)], { type: 'application/json' }), 'preguntas.json');

// Entrar al editor: si hay GitHub conectado, parte siempre de la última versión de GitHub
async function openEditor(forcePull = false) {
  if (!set) { set = { titulo: 'Nuevo test', preguntas: [], origen: 'editado' }; save(K.set, set); }
  if (!ghConnected()) { ghStatus = null; return showEditor(); }
  if (set.origen === 'editado' && !forcePull) {
    ghSha = null;
    ghStatus = { type: 'pending', text: 'Tienes cambios en este dispositivo que no están en GitHub.' };
    return showEditor();
  }
  ghStatus = { type: 'busy', text: 'Cargando las preguntas de GitHub…' };
  showEditor();
  try {
    useData(await ghPull(), 'servidor');
    ghStatus = { type: 'ok', text: '☁️ Conectado: los cambios se guardan directamente en GitHub.' };
  } catch (e) {
    ghStatus = { type: 'error', text: 'No se pudieron cargar las preguntas de GitHub. ' + (e.status ? e.message : 'Revisa la conexión.'), retry: () => openEditor(forcePull) };
  }
  showEditor();
}
