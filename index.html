  $('srsBtn').onclick = () => { if (confirmDiscard()) showSrsSetup(); };
  const simular = (pool, n, minutos, nombre, bloque) => () => {
    if (!confirmDiscard()) return;
    if (!pool.length) return alert(`No hay preguntas del bloque «${bloque}». Cámbialo en ⚙️ Ajustes → Simulacro.`);
    startRun(shuffle(pool).slice(0, n), {
      mode: 'examen', minutes: minutos, label: nombre === MODOS.simulacro ? '' : nombre,
      sim: { nombre, corte: s.simCorte }
    });
  };
  $('simBtn').onclick = simular(simPool, s.simPreguntas, s.simMinutos, s.simNombre, s.simBloque);
  $('sim2Btn').onclick = simular(sim2Pool, s.sim2Preguntas, s.sim2Minutos, s.sim2Nombre, s.sim2Bloque);

  const pick = temaPicker($('pickTest'), qs, load(K.settings, {}).pick_test);

  document.querySelectorAll('input[name=mode]').forEach(r => r.onchange = () => { $('minRow').hidden = r.value !== 'examen' || !r.checked; });
  $('start').onclick = () => {
    if (!confirmDiscard()) return;
    const sel = pick.get(), refRaw = ($('refFilter')?.value || '').trim(), ref = refRaw.toLowerCase();
    saveSettings({ pick_test: sel ? [...sel] : null });
    let list = qs.filter(q => inPick(sel, q) && (!ref || (q.referencia || '').toLowerCase().includes(ref)));
    if ($('onlyKo').checked) list = list.filter(q => (stats[keyOf(q)]?.ko || 0) > 0);
    if ($('onlyMarked').checked) list = list.filter(q => marks[keyOf(q)]);
    if (!list.length) return alert('No hay preguntas con esos filtros.');
    if ($('shq').checked) list = shuffle(list);
    list = list.slice(0, Math.max(1, +$('num').value || list.length));
    const mode = document.querySelector('input[name=mode]:checked').value;
    const recall = !!$('recall')?.checked;
    if ($('recall')) saveSettings({ recall });
    startRun(list, {
      recall,
      shuffleOpts: $('sho').checked, mode, minutes: mode === 'examen' ? +$('minutes').value || 0 : 0,
      label: [pickLabel(sel), refRaw && `ref. «${refRaw}»`].filter(Boolean).join(' · ')
    });
  };
}

// ---------- Selector múltiple de bloques y temas ----------
// Clave de un tema dentro de su bloque (los temas pueden repetirse en bloques distintos)
const pkKey = x => (x.bloque || '') + '\u0001' + (x.tema || '');

// En pantalla: resumen con los temas elegidos como chips y botón «Cambiar».
// «Cambiar» abre una hoja a pantalla completa con buscador y los temas de cada bloque como chips.
// `saved`: claves elegidas la última vez (null = todos). Devuelve { get }: get() → Set de claves, o null si están todas.
function temaPicker(el, items, saved, { unit = 'preguntas', onChange = () => {} } = {}) {
  const groups = {};
  items.forEach(x => { const g = (groups[x.bloque || ''] ||= {}); g[x.tema || ''] = (g[x.tema || ''] || 0) + 1; });
  const bloques = Object.keys(groups).sort(natCmp);
  const temasOf = b => Object.keys(groups[b]).sort(natCmp);
  const allKeys = bloques.flatMap(b => temasOf(b).map(t => b + '\u0001' + t));
  const keep = (saved || []).filter(k => allKeys.includes(k));
  let sel = new Set(keep.length ? keep : allKeys);
  const count = s => [...s].reduce((n, k) => { const [b, t] = k.split('\u0001'); return n + groups[b][t]; }, 0);

  // ¿La selección cabe en los desplegables? → { b, t } (vacío = todos); si no, null (= personalizada)
  const asDropdown = () => {
    if (sel.size === allKeys.length) return { b: '', t: '' };
    const ks = [...sel].map(k => k.split('\u0001'));
    const bs = uniq(ks.map(([b]) => b)), ts = uniq(ks.map(([, t]) => t));
    if (bs.length === 1 && sel.size === temasOf(bs[0]).length) return { b: bs[0], t: '' };
    if (sel.size === 1) return { b: ks[0][0], t: ks[0][1] };
    // Un mismo nombre de tema en varios bloques, elegido con «Bloque: Todos»
    if (ts.length === 1 && allKeys.filter(k => k.endsWith('\u0001' + ts[0])).length === sel.size) return { b: '', t: ts[0] };
    return null;
  };
  const fromDropdown = (b, t) => new Set(allKeys.filter(k => { const [kb, kt] = k.split('\u0001'); return (!b || kb === b) && (!t || kt === t); }));

  // Desplegables de bloque y tema para lo habitual + botón para elegir varios temas en la hoja
  const renderSummary = () => {
    const dd = asDropdown(), custom = !dd && sel.size > 0, none = sel.size === 0;
    const temas = uniq(allKeys.filter(k => !dd?.b || k.startsWith(dd.b + '\u0001')).map(k => k.split('\u0001')[1])).sort(natCmp);
    const chipsTxt = custom ? bloques.flatMap(b => {
      const ts = temasOf(b), on = ts.filter(t => sel.has(b + '\u0001' + t));
      if (on.length && on.length === ts.length && ts.length > 1) return [bloqueShort(b)];
      return on.map(t => temaShort(b, t));
    }) : [];
    el.innerHTML = `
      ${bloques.length > 1 ? `<div class="set-row"><span>Bloque</span><select data-b>
        <option value="">Todos</option>
        ${bloques.map(b => `<option value="${esc(b)}" ${dd?.b === b ? 'selected' : ''}>${esc(bloqueShort(b))}</option>`).join('')}
        ${custom || none ? `<option value="__custom" selected>${none ? 'Ninguno' : 'Personalizado'}</option>` : ''}
      </select></div>` : ''}
      ${!custom && !none && temas.filter(Boolean).length ? `<div class="set-row"><span>Tema</span><select data-t>
        <option value="">Todos</option>
        ${temas.filter(Boolean).map(t => `<option value="${esc(t)}" ${dd?.t === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}
      </select></div>` : ''}
      ${custom ? `<div class="pick-chips">${chipsTxt.slice(0, 8).map(x => `<span class="tchip on">${esc(x)}</span>`).join('')}${chipsTxt.length > 8 ? `<span class="tchip">+${chipsTxt.length - 8}</span>` : ''}</div>` : ''}
      <div class="row between" style="margin-top:4px">
        <span class="muted">${none ? 'Ningún tema elegido' : `${count(sel)} ${unit}`}</span>
        <button class="small" data-open>${custom ? 'Cambiar selección ›' : 'Elegir varios temas ›'}</button>
      </div>`;
    const bSel = el.querySelector('[data-b]'), tSel = el.querySelector('[data-t]');
    if (bSel) bSel.onchange = () => {
      if (bSel.value === '__custom') return;
      sel = fromDropdown(bSel.value, ''); renderSummary(); onChange();
    };
    if (tSel) tSel.onchange = () => {
      sel = fromDropdown(dd?.b || '', tSel.value); renderSummary(); onChange();
    };
    el.querySelector('[data-open]').onclick = openSheet;
  };

  const openSheet = () => {
    let draft = new Set(sel), q = '';
    const sheet = document.createElement('div');
    sheet.className = 'pick-sheet';
    sheet.setAttribute('role', 'dialog');
    sheet.setAttribute('aria-label', 'Elegir temas');
    document.body.appendChild(sheet);
    document.body.style.overflow = 'hidden';
    const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    let openB = -1; // bloque desplegado en la cuadrícula
    const chipsHTML = (b, ts) => ts.map(t => {
      const k = b + '\u0001' + t, onK = draft.has(k);
      return `<button class="tchip ${onK ? 'on' : ''}" data-k="${esc(k)}" aria-pressed="${onK}">${onK ? '✓ ' : ''}${chipLabel(t)} <span class="tn">${groups[b][t]}</span></button>`;
    }).join('');
    const draw = () => {
      const f = norm(q), scroll = sheet.querySelector('.pick-sheet-in')?.scrollTop || 0;
      sheet.innerHTML = `
        <div class="pick-sheet-in">
          <div class="pick-head">
            <h2 style="margin:0">Elegir temas</h2>
            <button class="primary small" data-done>Listo</button>
          </div>
          <input type="search" class="full" data-q placeholder="🔍 Buscar tema" value="${esc(q)}">
          <div class="row" style="margin:8px 0"><button class="small" data-all>Todos</button><button class="small" data-none>Ninguno</button></div>
          ${!f ? `
          <div class="ptiles">${bloques.map((b, i) => {
            const ts = temasOf(b), on = ts.filter(t => draft.has(b + '\u0001' + t)).length;
            const state = on === ts.length ? 'full' : on ? 'part' : '';
            return `<button class="ptile ${state} ${openB === i ? 'open' : ''}" data-tile="${i}" aria-expanded="${openB === i}" title="${esc(b)}">
              <span class="ptc ${tileCode(b).length > 4 ? 'long' : ''}">${esc(tileCode(b))}</span>${tileSub(b) ? `<span class="pts">${esc(tileSub(b))}</span>` : ''}
              <span class="ptn">${state === 'full' ? '✓ ' : ''}${on}/${ts.length}</span></button>`;
          }).join('')}</div>` : bloques.map((b, i) => {
            const ts = temasOf(b).filter(t => !f || norm(t).includes(f) || norm(b).includes(f));
            if (!ts.length) return '';
            const on = temasOf(b).filter(t => draft.has(b + '\u0001' + t)).length;
            return `<div class="pick-sec">
              <div class="pick-sec-h"><span>${pickBloqueHTML(b)}</span><button class="linkbtn" data-bt="${i}">${on === temasOf(b).length ? 'quitar' : 'todo'}</button></div>
              <div class="pick-chips">${chipsHTML(b, ts)}</div>
            </div>`;
          }).join('') || '<p class="muted">Ningún tema coincide con la búsqueda.</p>'}
        </div>
        <div class="pick-foot"><span>${draft.size ? `${draft.size} ${draft.size === 1 ? 'tema' : 'temas'} · <b>${count(draft)}</b> ${unit}` : 'Ningún tema elegido'}</span>
          <button class="primary" data-done>Listo</button></div>`;
      // El bloque desplegado se abre dentro de la cuadrícula, justo debajo de la fila de su cuadrado
      const grid = sheet.querySelector('.ptiles');
      if (grid && openB >= 0) {
        const b = bloques[openB], ts = temasOf(b), all = ts.every(t => draft.has(b + '\u0001' + t));
        // Columnas reales: cuántos cuadrados comparten la fila del primero
        const tl = [...grid.querySelectorAll('.ptile')];
        const cols = Math.max(1, tl.filter(t => t.offsetTop === tl[0].offsetTop).length);
        const rowEnd = Math.min(Math.floor(openB / cols) * cols + cols - 1, bloques.length - 1);
        tl[rowEnd].insertAdjacentHTML('afterend', `
          <div class="ptile-panel">
            <div class="pick-sec-h"><span>${pickBloqueHTML(b)}</span><button class="linkbtn" data-bt="${openB}">${all ? 'quitar' : 'todo'}</button></div>
            <div class="pick-chips">${chipsHTML(b, ts)}</div>
          </div>`);
      }
      sheet.querySelector('.pick-sheet-in').scrollTop = scroll;
      sheet.querySelectorAll('[data-tile]').forEach(tl => tl.onclick = () => { const i = +tl.dataset.tile; openB = openB === i ? -1 : i; draw(); });
      sheet.querySelectorAll('[data-k]').forEach(c => c.onclick = () => { const k = c.dataset.k; draft.has(k) ? draft.delete(k) : draft.add(k); draw(); });
      sheet.querySelectorAll('[data-bt]').forEach(a => a.onclick = () => {
        const b = bloques[+a.dataset.bt], ks = temasOf(b).map(t => b + '\u0001' + t), all = ks.every(k => draft.has(k));
        ks.forEach(k => all ? draft.delete(k) : draft.add(k)); draw();
      });
      sheet.querySelector('[data-all]').onclick = () => { draft = new Set(allKeys); draw(); };
      sheet.querySelector('[data-none]').onclick = () => { draft = new Set(); draw(); };
      sheet.querySelectorAll('[data-done]').forEach(b => b.onclick = close);
      const inp = sheet.querySelector('[data-q]');
      inp.oninput = () => { q = inp.value; draw(); const n = sheet.querySelector('[data-q]'); n.focus(); n.setSelectionRange(q.length, q.length); };
    };
    const close = () => {
      sel = draft;
      sheet.remove();
      document.body.style.overflow = '';
      document.removeEventListener('keydown', onEsc);
      renderSummary();
      onChange();
    };
    const onEsc = e => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', onEsc);
    draw();
  };

  renderSummary();
  onChange();
  return { get: () => sel.size === allKeys.length ? null : new Set(sel) };
}
// Código corto del cuadrado de cada bloque: "T8", "ESP", "GEN"… y debajo la procedencia ("MAD", "UMH")
function tileCode(b) {
  const m = b.match(/^Tema (\d+)/);
  if (m) return 'T' + m[1];
  if (/espec/i.test(b)) return 'UMH ESP';
  if (/general/i.test(b)) return 'UMH GEN';
  return (b || '?').split(/\s+/).map(w => w[0]).join('').slice(0, 3).toUpperCase();
}
// Procedencia bajo el código ("MAD"); los de la UMH ya la llevan en el código
const tileSub = b => b.match(/\((\w+)\)/)?.[1] || '';
// "Tema 8 (MAD). Tipos…" → "Tema 8 (MAD)"; "Temario específico UMH" → igual
const bloqueShort = b => b ? b.split('. ')[0] : 'Sin bloque';
// Nombre corto de un tema para el resumen: "E3", "G2", "Tema 8 · Test", "Examen oficial UMH 2023 (1ª parte)"…
function temaShort(b, t) {
  if (!t) return bloqueShort(b);
  const code = t.match(/^([A-Z]\d+)\./);
  if (code) return code[1];
  const mad = t.match(/^(Tema \d+) · (\S+)/);
  if (mad) return `${mad[1]} · ${mad[2] === 'Test' ? 'Test' : 'Preguntas'}`;
  return t.length > 28 ? t.slice(0, 26) + '…' : t;
}
// Etiqueta del chip dentro de la hoja: "E3 · Cooperación: redes…" o "Preguntas del tema"
function chipLabel(t) {
  if (!t) return 'Sin tema';
  const code = t.match(/^([A-Z]\d+)\.\s*(.*)$/);
  if (code) return `<b>${code[1]}</b> ${esc(code[2].length > 34 ? code[2].slice(0, 32) + '…' : code[2])}`;
  const mad = t.match(/^Tema \d+ · (.*)$/);
  return esc(mad ? mad[1] : t);
}
const inPick = (sel, x) => !sel || sel.has(pkKey(x));
// "Tema 8 (MAD). Tipos de bibliotecas…" → "Tema 8 (MAD)" en negrita y el título en pequeño debajo
function pickBloqueHTML(b) {
  if (!b) return '<b>Sin bloque</b>';
  const i = b.indexOf('. ');
  return i > 0 ? `<b>${esc(b.slice(0, i))}</b><span class="pick-sub">${esc(b.slice(i + 2))}</span>` : `<b>${esc(b)}</b>`;
}
// Texto breve de lo elegido, para el historial
const pickLabel = sel => !sel ? '' : sel.size > 2 ? `${sel.size} temas` : [...sel].map(k => k.split('\u0001')[1] || k.split('\u0001')[0]).join(' + ');

// ---------- Repaso inteligente: elegir bloque y tema ----------
const fmtNextDay = t => new Date(t).toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });

// ---------- Test ----------
function startRun(list, { shuffleOpts = true, mode = 'practica', minutes = 0, label = '', sim = null, kind = null, recall = false }) {
  const s = getSettings();
  run = {
    list: list.map(q => {
      const order = q.opciones.map((_, i) => i);
      return { q, order: shuffleOpts && !fixedOrder(q) ? shuffle(order) : order };
    }),
    i: 0, answers: list.map(() => null), doubt: list.map(() => false),
    mode, kind, label, sim, titulo: set.titulo,
    recall, shown: list.map(() => false),
    penalty: s.penaltyOn ? s.penalty : 0,
    limit: minutes ? minutes * 60 : null, elapsed: 0
  };
  saveRun();
  showQuestion();
}

// Tests guardados con versiones anteriores de la app
function normalizeRun(r) {
  r.doubt ||= r.list.map(() => false);
  r.penalty ??= 0;
  r.label ??= r.tema || '';
  r.shown ||= r.list.map(() => false);
  return r;
}

const saveRun = () => save(K.run, run);

function startTimer() {
  if (timerId) return;
  timerId = setInterval(() => {
    run.elapsed++;
    saveRun();
    updateTimer();
    if (run.limit && run.elapsed >= run.limit) { alert('¡Se acabó el tiempo!'); finish(); }
  }, 1000);
}
function stopTimer() { clearInterval(timerId); timerId = null; }
function updateTimer() {
  const el = $('timer');
  if (!el) return;
  if (run.limit) {
    const left = Math.max(0, run.limit - run.elapsed);
    el.textContent = '⏱ ' + fmtTime(left);
    el.classList.toggle('low', left <= 60);
  } else el.textContent = '⏱ ' + fmtTime(run.elapsed);
}

const doubtLabel = on => on ? '🤔 Marcada como dudosa' : '🤔 Marcar como dudosa';

function showQuestion() {
  if (run.limit && run.elapsed >= run.limit) return finish();
  const { q, order } = run.list[run.i];
  const n = run.list.length, exam = run.mode === 'examen', ans = run.answers[run.i];
  const answered = run.answers.filter(a => a !== null).length;
  if (qShown.i !== run.i || qShown.run !== run) qShown = { i: run.i, t: Date.now(), run };
  // Recuerdo activo: las opciones se ocultan hasta que la persona intenta recordar la respuesta
  const hideOpts = run.recall && !run.shown[run.i] && ans === null;

  app.innerHTML = `
    <div class="topbar">
      <div><b>${run.i + 1}</b><span class="muted"> / ${n}</span>${q.tema ? ` <span class="tag">${esc(q.tema)}</span>` : ''}</div>
      <div class="row" style="flex-wrap:nowrap"><span class="timer" id="timer"></span>${starBtn(q, 'star')}<button class="small" id="quit">Pausar</button></div>
    </div>
    <div class="progress"><div style="width:${(exam ? answered : run.i) / n * 100}%"></div></div>
    <div class="card">
      ${run.sim ? `<div class="muted" style="margin-bottom:6px">🎯 ${esc(run.sim.nombre)}</div>` : ''}
      <div class="q">${esc(q.pregunta)}</div>
      ${hideOpts ? `
      <div class="recall-box">
        <p>🧠 Intenta recordar la respuesta antes de ver las opciones.</p>
        <button class="primary" id="showOpts">👀 Ver opciones</button>
      </div>` : `
      <div class="options">${order.map((orig, k) =>
        `<button data-orig="${orig}" class="${exam && ans === orig ? 'sel' : ''}"><span class="letter">${'ABCDEFGH'[k]}</span><span>${esc(q.opciones[orig])}</span></button>`).join('')}
      </div>`}
      <div class="row" style="margin-top:12px"><button class="chip ${run.doubt[run.i] ? 'on' : ''}" id="doubt">${doubtLabel(run.doubt[run.i])}</button></div>
      <div id="after"></div>
    </div>
    ${exam ? `
    <div class="card">
      <div class="row between">
        <button id="prev" ${run.i === 0 ? 'disabled' : ''}>← Anterior</button>
        <button class="primary" id="finishBtn">Terminar</button>
        <button id="next" ${run.i === n - 1 ? 'disabled' : ''}>Siguiente →</button>
      </div>
      <div class="navgrid">${run.list.map((_, k) =>
        `<button data-k="${k}" class="${run.answers[k] !== null ? 'done' : ''} ${k === run.i ? 'cur' : ''} ${run.doubt[k] ? 'doubt' : ''}">${k + 1}</button>`).join('')}</div>
      ${run.penalty ? `<p class="muted" style="margin-bottom:0">Cada fallo resta ${fmtPen(run.penalty)}. Las preguntas en blanco no restan.</p>` : ''}
    </div>` : ''}`;

  bindStar($('star'), q);
  $('quit').onclick = () => { saveRun(); showHome(); };
  $('doubt').onclick = () => {
    run.doubt[run.i] = !run.doubt[run.i];
    saveRun();
    $('doubt').classList.toggle('on', run.doubt[run.i]);
    $('doubt').textContent = doubtLabel(run.doubt[run.i]);
    app.querySelector(`.navgrid [data-k="${run.i}"]`)?.classList.toggle('doubt', run.doubt[run.i]);
  };
  updateTimer();
  startTimer();
  if ($('showOpts')) $('showOpts').onclick = () => { run.shown[run.i] = true; saveRun(); showQuestion(); };

  const opts = app.querySelectorAll('.options button');
  if (exam) {
    opts.forEach(b => b.onclick = () => {
      const o = +b.dataset.orig;
      if (run.answers[run.i] === null) addTime(q, Date.now() - qShown.t); // la primera vez que la responde
      run.answers[run.i] = run.answers[run.i] === o ? null : o; // pulsar de nuevo la deja en blanco
      saveRun(); showQuestion();
    });
    const go = k => { run.i = k; saveRun(); showQuestion(); };
    $('prev').onclick = () => go(run.i - 1);
    $('next').onclick = () => go(run.i + 1);
    app.querySelectorAll('.navgrid button').forEach(b => b.onclick = () => go(+b.dataset.k));
    $('finishBtn').onclick = () => {
      const blank = run.answers.filter(a => a === null).length;
      if (confirm(blank ? `Tienes ${blank} sin responder. ¿Terminar?` : '¿Terminar el examen?')) finish();
    };
  } else {
    opts.forEach(b => b.onclick = () => {
      const chosen = +b.dataset.orig, ok = chosen === q.correcta;
      run.answers[run.i] = chosen;
      addTime(q, Date.now() - qShown.t);
      updateStats(q, ok, chosen);
      srsUpdate(q, ok);
      addDaily(1);
      saveRun();
      showFeedback();
    });
    if (ans !== null) showFeedback(); // al reanudar una pregunta ya respondida
  }
}

const refHTML = q => q.referencia ? `<div class="ref">📖 ${esc(q.referencia)}</div>` : '';

// Truco compartido (del JSON) y nota personal (solo en este dispositivo)
const myNote = key => load(K.notes, {})[key] || '';
function notesHTML(item, key) {
  if (!feat('notas')) return '';
  const n = myNote(key);
  return `${item.truco ? `<div class="truco">💡 <b>Truco:</b> ${esc(item.truco)}</div>` : ''}
    ${n ? `<div class="truco mine">📝 <b>Mi nota:</b> ${esc(n)}</div>` : ''}
    <button class="chip note-btn" data-key="${esc(key)}">📝 ${n ? 'Editar mi nota' : 'Añadir mi nota o truco'}</button>`;
}
// Los botones "mi nota" de la pantalla: pedir el texto y volver a pintar con `redraw`
function bindNoteBtns(root, redraw) {
  root.querySelectorAll('.note-btn').forEach(b => b.onclick = () => {
    const key = b.dataset.key, cur = myNote(key);
    const v = prompt('Tu nota o truco para recordar esta pregunta (solo se guarda en este dispositivo).\nDéjalo vacío para borrarla.', cur);
    if (v === null) return;
    const notes = load(K.notes, {});
    if (v.trim()) notes[key] = v.trim(); else delete notes[key];
    save(K.notes, notes);
    redraw();
  });
}

// "Sueles confundir…": cuántas veces se ha elegido esta misma opción incorrecta
function confusionHTML(q, chosen) {
  if (!feat('confusion') || chosen === null || chosen === q.correcta) return '';
  const n = load(K.stats, {})[keyOf(q)]?.wrong?.[q.opciones[chosen]] || 0;
  return n >= 2 ? `<div class="confusion">⚠️ Ya has elegido <b>«${esc(q.opciones[chosen])}»</b> ${n} veces en esta pregunta. Fíjate bien: la correcta es <b>«${esc(q.opciones[q.correcta])}»</b>.</div>` : '';
}

function showFeedback() {
  const { q } = run.list[run.i], chosen = run.answers[run.i], ok = chosen === q.correcta;
  app.querySelectorAll('.options button').forEach(b => {
    b.disabled = true; b.style.opacity = 1;
    const o = +b.dataset.orig;
    if (o === q.correcta) b.classList.add('ok');
    else if (o === chosen) b.classList.add('ko');
  });
  const last = run.i === run.list.length - 1;
  $('after').innerHTML = `
    <div class="explain ${ok ? '' : 'wrong'}"><b>${ok ? '✔ ¡Correcto!' : '✘ Incorrecto'}</b>${q.explicacion ? '\n' + esc(q.explicacion) : ''}${refHTML(q)}</div>
    ${confusionHTML(q, chosen)}
    <div class="notes">${notesHTML(q, keyOf(q))}</div>
    <div class="row" style="margin-top:16px;justify-content:flex-end"><button class="primary" id="next">${last ? 'Ver resultado' : 'Siguiente →'}</button></div>`;
  bindNoteBtns($('after'), showFeedback);
  const next = $('next');
  next.focus();
  next.onclick = () => {
    if (last) return finish();
    run.i++; saveRun(); showQuestion();
  };
}

function updateStats(q, ok, chosen = null) {
  const stats = load(K.stats, {});
  const s = stats[keyOf(q)] ||= { ok: 0, ko: 0 };
  ok ? s.ok++ : s.ko++;
  if (!ok && chosen !== null) {
    s.wrong ||= {};
    const txt = q.opciones[chosen];
    s.wrong[txt] = (s.wrong[txt] || 0) + 1;
  }
  save(K.stats, stats);
  // del día: [respondidas, acertadas, preguntas falladas] → puntería y «repasa los fallos de hoy»
  const dq = load(K.dailyq, {}), t = dq[todayKey()] || [0, 0, []];
  dq[todayKey()] = [t[0] + 1, t[1] + (ok ? 1 : 0), ok ? (t[2] || []) : uniq([...(t[2] || []), keyOf(q)])];
  save(K.dailyq, dq);
  // por tema, para la evolución semana a semana
  const dt = load(K.dailyt, {}), dia = dt[todayKey()] ||= {}, v = dia[pkKey(q)] || [0, 0];
  dia[pkKey(q)] = [v[0] + 1, v[1] + (ok ? 1 : 0)];
  save(K.dailyt, dt);
}
// Tiempo de cada pregunta (desde que se ve hasta que se responde), para «las que más te cuestan»
let qShown = { i: -1, t: 0, run: null };
function addTime(q, ms) {
  if (ms < 800) return; // toques sin leer
  const stats = load(K.stats, {}), s = stats[keyOf(q)] ||= { ok: 0, ko: 0 };
  s.ms = (s.ms || 0) + Math.min(ms, 180000); // como mucho 3 min: si se deja el móvil, no cuenta más
  s.tn = (s.tn || 0) + 1;
  save(K.stats, stats);
}

function finish() {
  stopTimer();
  const results = run.list.map((it, k) => ({ q: it.q, chosen: run.answers[k], ok: run.answers[k] === it.q.correcta, doubt: !!run.doubt[k] }));
  if (run.mode === 'examen') {
    const answered = results.filter(r => r.chosen !== null);
    answered.forEach(r => { updateStats(r.q, r.ok, r.chosen); srsUpdate(r.q, r.ok); });
    addDaily(answered.length);
  }
  const aciertos = results.filter(r => r.ok).length, blancos = results.filter(r => r.chosen === null).length;
  const fallos = results.length - aciertos - blancos;
  const dud = results.filter(r => r.doubt && r.chosen !== null);
  const nota = calcNota(aciertos, fallos, results.length, run.penalty);
  const entry = {
    fecha: Date.now(), titulo: run.titulo, modo: run.sim ? 'simulacro' : run.kind || run.mode, tema: run.label,
    total: results.length, aciertos, fallos, blancos, segundos: run.elapsed,
    penalty: run.penalty, nota, dudosas: dud.length, dudosasOk: dud.filter(r => r.ok).length,
    ...(run.sim ? { corte: run.sim.corte, apto: nota >= run.sim.corte } : {})
  };
  const hist = load(K.hist, []);
  hist.push(entry);
  save(K.hist, hist);
  localStorage.removeItem(K.run);
  const meta = run;
  run = null;
  if (meta.label === PLAN_LABEL) planMarkToday(); // el test del planning marca los temas de hoy como hechos
  setTimeout(checkLogros, 800);
  showResult(results, entry, meta);
}

// ---------- Resultado ----------
// ¿Compensó responder las dudosas? Ganancia neta en "aciertos" respecto a dejarlas en blanco
function doubtAdviceHTML(n, ok, pen, total) {
  const ko = n - ok, gain = ok - ko * pen;
  let txt = `Marcaste <b>${n}</b> como dudosas: acertaste <b>${ok}</b> y fallaste <b>${ko}</b>. `;
  if (!pen) txt += 'Sin penalización siempre compensa responder. 👍';
  else if (gain > 0) txt += `Responderlas te sumó <b>+${fmtNum(gain)}</b> aciertos netos (+${fmtNum(gain / total * 10)} en la nota): hiciste bien en arriesgar. 👍`;
  else if (gain < 0) txt += `Dejándolas en blanco habrías sacado <b>${fmtNum(-gain / total * 10)}</b> puntos más de nota. Con este nivel de duda, mejor no arriesgar. ✋`;
  else txt += 'Te dio igual responderlas que dejarlas en blanco.';
  return `<p style="margin:0">${txt}</p>`;
}

function showResult(results, entry, meta) {

  app.innerHTML = `
    <h1>Resultado</h1>
    <div class="card">
      ${meta.sim ? `<div class="verdict ${entry.apto ? 'ok' : 'ko'}">${entry.apto ? '✅ APTO' : '❌ NO APTO'} · nota de corte ${fmtNum(corte)}</div>` : ''}
      <div class="score">
        <div class="ring" style="--p:${nota * 10};--c:var(--${nota >= corte ? 'ok' : 'ko'})"><div>${fmtNum(nota)}</div></div>
        <div>
          <div class="big">${entry.aciertos} / ${entry.total}</div>
          <div>${['Toca repasar 💪', 'Vas por buen camino 👍', '¡Muy bien! 🎉', '¡Perfecto! 🏆'][Math.min(3, Math.floor(nota * 10 / 34) + (entry.aciertos === entry.total ? 1 : 0))]}</div>
        </div>
      </div>
      <p class="muted">Nota ${fmtNum(nota)} / 10 · ${entry.fallos} fallos${entry.penalty ? ` (−${fmtNum(entry.fallos * entry.penalty)})` : ''}${entry.blancos ? ` · ${entry.blancos} en blanco` : ''} · ${fmtTime(entry.segundos)}
        ${entry.penalty ? `<br>Penalización: −${fmtPen(entry.penalty)} por fallo` : ''}</p>
      <div class="row">
        ${bad.length ? '<button class="primary" id="retry">Repetir las falladas</button>' : ''}

        <button id="stats">📊 Progreso</button>
      </div>
    </div>
    ${entry.dudosas ? `<div class="card"><h2>🤔 Dudosas</h2>${doubtAdviceHTML(entry.dudosas, entry.dudosasOk, entry.penalty, entry.total)}</div>` : ''}
    <div class="card">
      <div class="row between"><h2>Revisión</h2>
        <select id="reviewFilter">
          <option value="bad" ${bad.length ? 'selected' : ''}>Falladas y en blanco (${bad.length})</option>
          ${doubts.length ? `<option value="doubt">Dudosas (${doubts.length})</option>` : ''}
          <option value="all" ${bad.length ? '' : 'selected'}>Todas (${results.length})</option>
        </select></div>
      <div id="reviewList"></div>
    </div>`;

  const renderReview = () => {
    const f = $('reviewFilter').value, list = f === 'bad' ? bad : f === 'doubt' ? doubts : results;
    $('reviewList').innerHTML = list.length ? list.map((r, k) => `
      <div class="review">
        <div class="row between" style="flex-wrap:nowrap;align-items:flex-start"><b style="white-space:pre-wrap">${esc(r.q.pregunta)}</b>${starBtn(r.q).replace('<button', `<button data-k="${k}"`)}</div>
        ${r.doubt ? '<span class="tag doubt">🤔 dudosa</span>' : ''}
        ${r.chosen === null ? '<div class="muted">Sin responder</div>'
          : `<div style="color:var(--${r.ok ? 'ok' : 'ko'})">${r.ok ? '✔' : '✘'} Tu respuesta: ${esc(r.q.opciones[r.chosen])}</div>`}
        ${r.ok ? '' : `<div style="color:var(--ok)">Correcta: ${esc(r.q.opciones[r.q.correcta])}</div>`}
        ${r.q.explicacion ? `<div class="muted" style="white-space:pre-wrap">${esc(r.q.explicacion)}</div>` : ''}
        ${refHTML(r.q)}
        <div class="notes">${notesHTML(r.q, keyOf(r.q))}</div>
      </div>`).join('') : '<p class="muted">¡Sin fallos! 🎉</p>';
    $('reviewList').querySelectorAll('.star').forEach(b => bindStar(b, list[+b.dataset.k].q));
    bindNoteBtns($('reviewList'), renderReview);
  };
  $('reviewFilter').onchange = renderReview;
  renderReview();

// ---------- Progreso ----------
function heatmapHTML(weeks = 18) {
  const d = load(K.daily, {}), goal = getSettings().dailyGoal;
  const today = new Date(startOfToday());
  const start = new Date(today);
  start.setDate(start.getDate() - (weeks - 1) * 7 - ((today.getDay() + 6) % 7)); // lunes de hace N semanas
  const max = Math.max(1, ...Object.values(d));
  let cells = '';
  for (let i = 0, day = new Date(start); i < weeks * 7; i++, day.setDate(day.getDate() + 1)) {
    const k = todayKey(day), n = d[k] || 0, future = day > today;
    const r = goal ? n / goal : n / max;
    const lvl = !n ? 0 : r >= 1 ? 4 : r >= .66 ? 3 : r >= .33 ? 2 : 1;
    cells += `<i class="l${lvl} ${future ? 'future' : ''} ${+day === +today ? 'today' : ''}" data-dia="${day.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'short' })}" data-n="${n}" title="${day.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' })}: ${n} preguntas"></i>`;
  }
  return `<div class="heat" id="heat" role="img" aria-label="Preguntas respondidas por día en las últimas ${weeks} semanas">${cells}</div>
    <p class="heat-info muted" id="heatInfo">Pasa el ratón o toca un día para ver cuántas preguntas hiciste.</p>
    <div class="heat-legend">Menos <i class="l0" style="background:var(--grid)"></i><i style="background:color-mix(in srgb, var(--accent) 30%, var(--grid))"></i><i style="background:color-mix(in srgb, var(--accent) 55%, var(--grid))"></i><i style="background:color-mix(in srgb, var(--accent) 78%, var(--grid))"></i><i style="background:var(--accent)"></i> ${goal ? 'Objetivo cumplido' : 'Más'}</div>`;
}

// Opciones incorrectas que se eligen una y otra vez en la misma pregunta
function confusionsCardHTML() {
  if (!feat('confusion')) return '';
  const stats = load(K.stats, {});
  const list = (set?.preguntas || []).flatMap(q => Object.entries(stats[keyOf(q)]?.wrong || {})
    .filter(([, n]) => n >= 2).map(([opt, n]) => ({ q, opt, n })))
    .sort((a, b) => b.n - a.n).slice(0, 10);
  if (!list.length) return '';
  return `<div class="card">
    <h2>⚠️ Lo que más confundes</h2>
    <p class="help">Respuestas incorrectas que has elegido varias veces en la misma pregunta.</p>
    ${list.map(c => `<div class="review">
      <div><b>${esc(c.q.pregunta)}</b></div>

      <div style="color:var(--ok)">✔ «${esc(c.q.opciones[c.q.correcta])}»</div>
    </div>`).join('')}

}

function dominioHTML() {
  const qs = set?.preguntas || [], srs = load(K.srs, {}), stats = load(K.stats, {});
  if (!qs.length) return '<p class="muted">No hay preguntas cargadas.</p>';
  const groups = {};
  qs.forEach(q => {
    const g = ((groups[q.bloque || ''] ||= {})[q.tema || 'Sin tema'] ||= { n: 0, dom: 0, ok: 0, ko: 0 });
    g.n++;
    if ((srs[keyOf(q)]?.box || 0) >= 3) g.dom++;
    const st = stats[keyOf(q)];
    if (st) { g.ok += st.ok; g.ko += st.ko; }
  });
  return Object.keys(groups).sort(natCmp).map(b => {
    const temas = Object.entries(groups[b]).sort((x, y) => natCmp(x[0], y[0]));
    const tot = temas.reduce((a, [, g]) => ({ n: a.n + g.n, dom: a.dom + g.dom, ok: a.ok + g.ok, ko: a.ko + g.ko }), { n: 0, dom: 0, ok: 0, ko: 0 });
    // Cada bloque se despliega para ver sus temas
    return `<details class="dom-b"><summary>
        <div class="dom-t"><b>${esc(b || 'Sin bloque')}</b><span class="muted">${pct(tot.dom, tot.n)}% dominado${tot.ok + tot.ko ? ` · ✓${pct(tot.ok, tot.ok + tot.ko)}%` : ''}</span></div>
        <div class="bar"><div style="width:${pct(tot.dom, tot.n)}%"></div></div>
      </summary><div class="dom-in">` +
      temas.map(([t, g]) => `
        <div class="bar-row"><span>${esc(t)} <span class="muted">(${g.n})</span></span>
          <div class="bar"><div style="width:${pct(g.dom, g.n)}%"></div></div>
          <span class="muted" style="text-align:right">${pct(g.dom, g.n)}%${g.ok + g.ko ? ` · ✓${pct(g.ok, g.ok + g.ko)}%` : ''}</span></div>`).join('') +
      '</div></details>';
  }).join('');
}

function lineChart(h, corte) {
  const W = 600, H = 220, L = 34, R = 12, T = 12, B = 28, n = h.length;
  const x = i => L + i * (W - L - R) / (n - 1);
  const y = v => T + (10 - v) * (H - T - B) / 10;
  const grid = [0, 2.5, 5, 7.5, 10].map(v =>
    `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>
     <text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtNum(v, 1)}</text>`).join('');
  const pts = h.map((e, i) => [x(i), y(entryNota(e))]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const dl = t => new Date(t).toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Nota sobre 10 de cada test">
    ${grid}
    ${corte != null ? `<line x1="${L}" x2="${W - R}" y1="${y(corte)}" y2="${y(corte)}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="${W - R}" y="${y(corte) - 5}" text-anchor="end" font-size="11" fill="var(--muted)">corte ${fmtNum(corte)}</text>` : ''}
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${h[i].modo === 'simulacro' ? 'var(--card)' : 'var(--accent)'}" stroke="${h[i].modo === 'simulacro' ? 'var(--accent)' : 'var(--card)'}" stroke-width="2"/>
      <circle class="hit" data-i="${i}" cx="${p[0]}" cy="${p[1]}" r="14" fill="transparent" style="cursor:pointer"/>`).join('')}
    <text x="${L}" y="${H - 8}" font-size="11" fill="var(--muted)">${dl(h[0].fecha)}</text>
    <text x="${W - R}" y="${H - 8}" text-anchor="end" font-size="11" fill="var(--muted)">${dl(h[n - 1].fecha)}</text>
  </svg>${h.some(e => e.modo === 'simulacro') ? '<p class="help" style="margin-bottom:0">○ simulacro · ● otros tests</p>' : ''}`;
}

function bindChart(h) {
  const wrap = $('chart'), tip = $('tip');
  wrap.querySelectorAll('.hit').forEach(c => {
    c.onmouseenter = c.onclick = () => {
      const e = h[+c.dataset.i], wr = wrap.getBoundingClientRect(), cr = c.getBoundingClientRect();
      tip.innerHTML = `<b>${fmtNum(entryNota(e))}</b> · ${e.aciertos}/${e.total}${e.modo === 'simulacro' ? (e.apto ? ' · APTO' : ' · NO APTO') : ''}<br><span class="muted">${fmtDate(e.fecha)} · ${MODOS[e.modo] || ''}</span>`;
      tip.style.left = Math.min(Math.max(cr.left - wr.left + cr.width / 2, 80), wr.width - 80) + 'px';
      tip.style.top = (cr.top - wr.top + cr.height / 2 - 6) + 'px';
      tip.hidden = false;
    };
    c.onmouseleave = () => tip.hidden = true;
  });
}

// ---------- GitHub: guardar las preguntas directamente en el repositorio ----------
let ghSha = null;                 // versión de preguntas.json en GitHub sobre la que estamos editando
let ghStatus = null;              // { type: 'ok' | 'busy' | 'error' | 'conflict' | 'pending', text, retry? }
let ghQueue = Promise.resolve();  // los guardados van en fila para no pisarse
const ghConfig = () => load(K.gh, null);
const ghConnected = () => !!ghConfig()?.token;

function defaultRepo() {
  const user = location.hostname.match(/^([^.]+)\.github\.io$/)?.[1];
  const repo = location.pathname.split('/').filter(Boolean)[0];
  return user && repo && !repo.includes('.') ? `${user}/${repo}` : 'dcg64-ua/app-test-preguntas';
}
const b64encode = s => { let bin = ''; new TextEncoder().encode(s).forEach(b => bin += String.fromCharCode(b)); return btoa(bin); };
const b64decode = b => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g, '')), c => c.charCodeAt(0)));

async function ghApi(method, body, cfg = ghConfig()) {
  const res = await fetch(`https://api.github.com/repos/${cfg.repo}/contents/preguntas.json${method === 'GET' ? '?ref=main' : ''}`, {
    method, cache: 'no-store',
    headers: { Authorization: `Bearer ${cfg.token}`, Accept: 'application/vnd.github+json' },
    body: body ? JSON.stringify({ ...body, branch: 'main' }) : undefined
  });
  if (!res.ok) {
    const e = new Error({
      401: 'El token no es válido o ha caducado.',
      403: 'El token no tiene permiso de escritura (necesita «Contents: Read and write»).',
      404: 'No se encuentra el repositorio o el token no tiene acceso a él.'
    }[res.status] || `GitHub respondió con error ${res.status}.`);
    e.status = res.status;
    throw e;
  }
  return res.json();
}

async function ghPull(cfg = ghConfig()) {
  const d = await ghApi('GET', null, cfg);
  ghSha = d.sha;
  if (d.content) return JSON.parse(b64decode(d.content));
  // Con más de 1 MB GitHub no manda el contenido aquí (encoding «none»): se pide el blob, que admite hasta 100 MB
  const res = await fetch(`https://api.github.com/repos/${cfg.repo}/git/blobs/${d.sha}`, {
    cache: 'no-store', headers: { Authorization: `Bearer ${cfg.token}`, Accept: 'application/vnd.github+json' }
  });
  if (!res.ok) throw Object.assign(new Error(`GitHub respondió con error ${res.status}.`), { status: res.status });
  return JSON.parse(b64decode((await res.json()).content));
}

async function ghPush(message, force = false) {
  if (force) ghSha = (await ghApi('GET')).sha;
  if (!ghSha) throw Object.assign(new Error('conflicto'), { status: 409 });
  const content = b64encode(JSON.stringify(setToJSON(), null, 2) + '\n');
  const d = await ghApi('PUT', { message, content, sha: ghSha });
  ghSha = d.content.sha;
  set.origen = 'servidor';
  save(K.set, set);
}

function setGhStatus(type, text, retry) {
  ghStatus = { type, text, retry };
  const el = $('ghStatus');
  if (el) { el.innerHTML = ghStatusHTML(); bindGhStatus(); }
}

function ghFail(e) {
  if (e.status === 409 || e.status === 422)
    setGhStatus('conflict', 'Las preguntas de GitHub han cambiado desde otro sitio. Elige qué versión quieres conservar.');
  else
    setGhStatus('error', (e.status ? e.message : 'Sin conexión con GitHub.') + ' Tus cambios están guardados en este dispositivo.',
      () => publish('Actualizar preguntas desde la app'));
}

// Se llama tras cada cambio en el editor
function publish(message) {
  if (!ghConnected()) return;
  setGhStatus('busy', 'Guardando en GitHub…');
  ghQueue = ghQueue
    .then(() => ghPush(message))
    .then(() => setGhStatus('ok', '✓ Guardado en GitHub. Le llegará a todo el mundo en unos minutos.'))
    .catch(ghFail);
}

function ghStatusHTML() {
  if (!ghConnected() || !ghStatus) return '';
  const s = ghStatus;
  const btns = s.type === 'conflict' || s.type === 'pending'
    ? '<div class="row" style="margin-top:8px"><button class="small primary" id="ghMine">Subir la de este dispositivo</button><button class="small" id="ghTheirs">Usar la de GitHub</button></div>'
    : s.retry ? '<div class="row" style="margin-top:8px"><button class="small" id="ghRetry">Reintentar</button></div>' : '';
  return `<div class="ghstatus ${s.type}">${esc(s.text)}${btns}</div>`;
}

function bindGhStatus() {
  if ($('ghMine')) $('ghMine').onclick = () => {
    setGhStatus('busy', 'Subiendo la versión de este dispositivo…');
    ghQueue = ghQueue.then(() => ghPush('Actualizar preguntas desde la app', true))
      .then(() => setGhStatus('ok', '✓ Guardado en GitHub. Le llegará a todo el mundo en unos minutos.'))
      .catch(ghFail);
  };
  if ($('ghTheirs')) $('ghTheirs').onclick = () => {
    if (confirm('Se perderán los cambios de este dispositivo que no estén en GitHub. ¿Continuar?')) openEditor(true);
  };
  if ($('ghRetry')) $('ghRetry').onclick = ghStatus.retry;
}

  if ($('ghDisconnect')) $('ghDisconnect').onclick = () => {

    $('ghConnect').disabled = true;

// Guarda en el dispositivo y, si está conectado, también en GitHub
function persistEdit(message) {
  set.origen = 'editado';
  save(K.set, set);
  publish(message);
}


// Entrar al editor: si hay GitHub conectado, parte siempre de la última versión de GitHub
async function openEditor(forcePull = false) {
  if (!set) { set = { titulo: 'Nuevo test', preguntas: [], origen: 'editado' }; save(K.set, set); }
  if (!ghConnected()) { ghStatus = null; return showEditor(); }
  if (set.origen === 'editado' && !forcePull) {
    ghSha = null;
    ghStatus = { type: 'pending', text: 'Tienes cambios en este dispositivo que no están en GitHub.' };
    return showEditor();
  }
  ghStatus = { type: 'busy', text: 'Cargando las preguntas de GitHub…' };
  showEditor();
  try {
    useData(await ghPull(), 'servidor');
    ghStatus = { type: 'ok', text: '☁️ Conectado: los cambios se guardan directamente en GitHub.' };
  } catch (e) {
    ghStatus = { type: 'error', text: 'No se pudieron cargar las preguntas de GitHub. ' + (e.status ? e.message : 'Revisa la conexión.'), retry: () => openEditor(forcePull) };
  }
  showEditor();
}

function readFields(obj, fields) {

// ---------- Sesiones de estudio: flashcards, audio y verdadero/falso ----------
let onKey = null; // atajos de teclado de la pantalla actual (devuelve false si no es su pantalla)
const STUDY = {
  flash: { icon: '🃏', name: 'Flashcards', help: 'Lee la pregunta, intenta recordar la respuesta, dale la vuelta y puntúate. Lo que te cueste volverá antes.' },
  audio: { icon: '🎧', name: 'Modo audio', help: 'La app lee la pregunta, te deja unos segundos para pensar y te dice la respuesta. Ideal para andar o ir en transporte.' },
  vf: { icon: '⚡', name: 'Verdadero / Falso', help: 'Sale una pregunta con una sola respuesta: ¿es la correcta? Rápido, para hacer muchas en poco rato.' },
};

function showStudySetup(kind) {
  stopTimer();
  const conf = STUDY[kind], last = load(K.settings, {})['study_' + kind] || {};
  const qs = set?.preguntas || [], fs = kind === 'vf' ? [] : fichasOf();
  app.innerHTML = `
    <div class="row between"><h1>${conf.icon} ${conf.name}</h1><button id="home">← Inicio</button></div>
    <div class="card">
      <p class="help" style="margin-top:0">${conf.help}</p>
      ${qs.length && fs.length ? `<div class="set-row"><span>Qué repasar</span><select id="src">
        <option value="all">Preguntas y fichas</option><option value="q" ${last.src === 'q' ? 'selected' : ''}>Solo preguntas</option><option value="f" ${last.src === 'f' ? 'selected' : ''}>Solo fichas</option></select></div>` : ''}
      <div class="picker" id="pickStudy"></div>
      ${kind !== 'vf' ? `<label class="opt"><input type="checkbox" id="onlyDue" ${last.onlyDue !== false ? 'checked' : ''}> Solo las que tocan hoy y las nuevas (repaso inteligente)</label>` : ''}
      <label class="opt"><input type="checkbox" id="onlyMarked"> Solo las marcadas ★</label>
      <div class="set-row"><span>Cuántas</span><input type="number" id="count" min="1" value="${last.count || 20}"></div>
      ${kind === 'audio' ? `
      <hr class="sep">
      <label class="opt"><input type="checkbox" id="readOpts" ${last.readOpts !== false ? 'checked' : ''}> Leer las opciones de las preguntas</label>
      <label class="opt"><input type="checkbox" id="readExp" ${last.readExp !== false ? 'checked' : ''}> Leer la explicación y el truco</label>
      <div class="set-row"><span>Segundos para pensar</span><input type="number" id="pause" min="0" max="60" value="${last.pause ?? 4}"></div>
      <div class="set-row"><span>Velocidad</span><select id="rate">${[[0.8, 'Lenta'], [1, 'Normal'], [1.2, 'Rápida'], [1.4, 'Muy rápida']].map(([v, t]) => `<option value="${v}" ${(last.rate ?? 1) == v ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
      ${'speechSynthesis' in window ? '' : '<p class="error">Este navegador no puede leer en voz alta.</p>'}` : ''}
      <button class="primary" id="go" style="width:100%;margin-top:8px">Empezar</button>
      <p class="error" id="err"></p>
    </div>`;
  $('home').onclick = () => showHome();
  const pool = () => {
    const src = $('src')?.value || 'all';
    return [...(src === 'f' ? [] : qs), ...(src === 'q' ? [] : fs)];
  };
  // El selector de temas depende de qué se repasa (preguntas, fichas o ambas); conserva la selección al cambiarlo
  let pick = null;
  const unit = kind === 'vf' ? 'preguntas' : 'tarjetas';
  const buildPick = () => {
    const prev = pick ? pick.get() : null;
    pick = temaPicker($('pickStudy'), pool(), prev ? [...prev] : last.pick, { unit });
  };
  buildPick();
  if ($('src')) $('src').onchange = buildPick;

  $('go').onclick = () => {
    const sel = pick.get(), marks = load(K.marks, {});
    let cards = pool().filter(x => inPick(sel, x)).map(asCard);
    if ($('onlyMarked').checked) cards = cards.filter(c => marks[c.key]);
    const count = Math.max(1, +$('count').value || 20);
    if ($('onlyDue')?.checked) {
      const p = srsPlan(cards, c => c.key);
      cards = [...p.due, ...shuffle(p.fresh)];
      if (!cards.length) return $('err').textContent = '¡Todo al día! 🎉 Desmarca «Solo las que tocan hoy» para repasar igualmente.';
    } else cards = shuffle(cards);
    if (!cards.length) return $('err').textContent = 'No hay nada que repasar con esos filtros.';
    cards = cards.slice(0, count);
    const opts = {
      src: $('src')?.value, onlyDue: $('onlyDue')?.checked, count, pick: sel ? [...sel] : null,
      readOpts: $('readOpts')?.checked, readExp: $('readExp')?.checked, pause: $('pause') ? +$('pause').value : undefined, rate: $('rate') ? +$('rate').value : undefined
    };
    saveSettings({ ['study_' + kind]: opts });
    if (kind === 'flash') startFlash(cards);
    if (kind === 'audio') startAudio(cards, opts);
    if (kind === 'vf') {
      // Las preguntas con opciones que remiten a otras ("Las respuestas a) y c)…") no sirven sueltas
      const items = cards.map(c => c.item).filter(q => !fixedOrder(q));
      if (!items.length) return $('err').textContent = 'Esas preguntas tienen opciones del tipo «Las respuestas a) y b)…», que no sirven para verdadero/falso.';
      startVF(items);
    }
  };
}

// Reverso completo de una tarjeta (respuesta, explicación, referencia, trucos)
function cardBackHTML(c) {

// ----- Flashcards -----
let flash = null;
function startFlash(cards) {
  flash = { cards: cards.map(c => ({ ...c, again: 0 })), i: 0, flipped: false, counts: [0, 0, 0, 0], done: 0 };
  showFlash();
}
const GRADES = [['Otra vez', 'again'], ['Difícil', 'hard'], ['Bien', 'good'], ['Fácil', 'easy']];
const fmtDays = d => d === 0 ? 'hoy' : d === 1 ? '1 día' : d < 30 ? `${d} días` : `${Math.round(d / 30)} mes${d >= 45 ? 'es' : ''}`;

function showFlash() {
  const c = flash.cards[flash.i];
  if (!c) return showFlashEnd();
  const cur = load(K.srs, {})[c.key]?.box || 0;
  app.innerHTML = `
    <div class="topbar">
      <div><b>${flash.i + 1}</b><span class="muted"> / ${flash.cards.length}</span>${c.item.tema ? ` <span class="tag">${esc(c.item.tema)}</span>` : ''}</div>
      <div class="row" style="flex-wrap:nowrap">${starBtn({ pregunta: c.key }, 'star')}<button class="small" id="quit">Salir</button></div>
    </div>
    <div class="progress"><div style="width:${flash.i / flash.cards.length * 100}%"></div></div>
    <div class="card flash-card ${flash.flipped ? 'flipped' : ''}" id="flashCard">
      <div class="muted" style="margin-bottom:6px">${c.type === 'f' ? '🗂 Ficha' : '❓ Pregunta'}</div>
      <div class="q">${esc(c.front)}</div>
      ${flash.flipped ? `<hr class="sep">${cardBackHTML(c)}` : '<p class="muted flash-hint">Piensa la respuesta y toca para darle la vuelta</p>'}
    </div>
    ${flash.flipped ? `
    <div class="grades">${GRADES.map(([t, cls], g) => `
      <button class="grade ${cls}" data-g="${g}"><b>${t}</b><span>${g === 0 ? 'otra vez hoy' : fmtDays(srsGradeDays(cur, g))}</span></button>`).join('')}
    </div>` : '<button class="primary" id="flip" style="width:100%">Mostrar respuesta</button>'}`;
  bindStar($('star'), { pregunta: c.key });
  $('quit').onclick = () => showFlashEnd();
  if (!flash.flipped) {
    $('flip').onclick = $('flashCard').onclick = () => { flash.flipped = true; showFlash(); };
  } else {
    bindNoteBtns(app, showFlash);
    app.querySelectorAll('.grade').forEach(b => b.onclick = () => gradeFlash(+b.dataset.g));
  }
  onKey = e => {
    if (!$('flashCard')) return false;
    if (!flash.flipped && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); flash.flipped = true; showFlash(); }
    else if (flash.flipped && '1234'.includes(e.key)) gradeFlash(+e.key - 1);
  };
}

function gradeFlash(g) {
  const c = flash.cards[flash.i];
  srsGrade(c.key, g);
  if (!c.again) { flash.counts[g]++; flash.done++; addDaily(1); }
  // "Otra vez": la tarjeta vuelve al final de esta misma sesión (máx. 3 veces)
  if (g === 0 && c.again < 3) flash.cards.push({ ...c, again: c.again + 1 });
  flash.i++;
  flash.flipped = false;
  showFlash();
}

function showFlashEnd() {
  onKey = null;
  const [a, h, g, e] = flash.counts;
  app.innerHTML = `
    <h1>🃏 Sesión terminada</h1>
    <div class="card">
      <div class="big">${flash.done} tarjetas</div>
      <div class="kpis" style="margin-top:12px">
        <div class="kpi"><div class="muted">Otra vez</div><div class="v" style="color:var(--ko)">${a}</div></div>
        <div class="kpi"><div class="muted">Difícil</div><div class="v">${h}</div></div>
        <div class="kpi"><div class="muted">Bien / Fácil</div><div class="v" style="color:var(--ok)">${g + e}</div></div>
      </div>
      <p class="help">Lo que marcaste como «Otra vez» o «Difícil» volverá a salir pronto en el repaso.</p>
      <div class="row"><button class="primary" id="again">Otra sesión</button><button id="home">Inicio</button></div>
    </div>`;
  $('again').onclick = () => showStudySetup('flash');
  $('home').onclick = () => showHome();
}

// ----- Modo audio -----
let audio = null, wakeLock = null;
const sleep = ms => new Promise(r => setTimeout(r, ms));
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  return vs.find(v => v.lang === 'es-ES') || vs.find(v => v.lang?.startsWith('es')) || null;
}
function speak(text, tok) {
  return new Promise(res => {
    if (!text || tok !== audio?.tok) return res();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'es-ES';
    const v = pickVoice();
    if (v) u.voice = v;
    u.rate = audio.rate;
    u.onend = u.onerror = () => res();
    speechSynthesis.speak(u);
  });
}

function startAudio(cards, opts) {
  audio = { cards, i: 0, playing: false, tok: 0, phase: '', rate: opts.rate || 1, pause: opts.pause ?? 4, readOpts: opts.readOpts !== false, readExp: opts.readExp !== false };
  speechSynthesis.getVoices(); // en algunos navegadores las voces cargan tarde
  showAudio();
}

function showAudio() {
  const c = audio.cards[audio.i];
  if (!c) return stopAudio(true);
  const it = c.item;
  const opts = c.type === 'q' ? it.opciones.map((o, k) => `<div class="${audio.phase === 'answer' && k === it.correcta ? 'audio-ok' : ''}">${'ABCDEFGH'[k]}) ${esc(o)}</div>`).join('') : '';
  app.innerHTML = `
    <div class="topbar">
      <div><b>${audio.i + 1}</b><span class="muted"> / ${audio.cards.length}</span>${it.tema ? ` <span class="tag">${esc(it.tema)}</span>` : ''}</div>
      <button class="small" id="quit">Salir</button>
    </div>
    <div class="progress"><div style="width:${audio.i / audio.cards.length * 100}%"></div></div>
    <div class="card" id="audioCard">
      <div class="muted" style="margin-bottom:6px">${{ q: '🔊 Leyendo la pregunta…', think: '🤔 Piensa…', answer: '✅ Respuesta', '': audio.playing ? '' : '⏸ En pausa' }[audio.phase] || ''}</div>
      <div class="q">${esc(c.front)}</div>
      ${opts ? `<div class="audio-opts">${opts}</div>` : ''}
      ${audio.phase === 'answer' ? `<hr class="sep">${cardBackHTML(c)}` : ''}
    </div>
    <div class="audio-ctrl">
      <button id="prevA" ${audio.i === 0 ? 'disabled' : ''} title="Anterior">⏮</button>
      <button class="primary" id="playA">${audio.playing ? '⏸ Pausa' : '▶ Reproducir'}</button>
      <button id="nextA" title="Siguiente">⏭</button>
    </div>
    <p class="help" style="text-align:center">Mantén la pantalla encendida: en el iPhone, si se bloquea, la lectura se para.</p>`;
  bindNoteBtns(app, showAudio);
  $('quit').onclick = () => stopAudio(false);
  $('playA').onclick = () => audio.playing ? pauseAudio() : playAudio();
  $('prevA').onclick = () => jumpAudio(-1);
  $('nextA').onclick = () => jumpAudio(1);
  onKey = e => {
    if (!$('audioCard')) return false;
    if (e.key === ' ') { e.preventDefault(); $('playA').click(); }
    else if (e.key === 'ArrowRight') jumpAudio(1);
    else if (e.key === 'ArrowLeft') jumpAudio(-1);
  };
}

async function playAudio() {
  audio.playing = true;
  const tok = ++audio.tok;
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}
  while (audio && tok === audio.tok && audio.i < audio.cards.length) {
    const c = audio.cards[audio.i], it = c.item;
    audio.phase = 'q'; showAudio();
    await speak(c.front, tok);
    if (c.type === 'q' && audio.readOpts) for (const [k, o] of it.opciones.entries()) await speak(`${'ABCDEFGH'[k]}: ${o}`, tok);
    if (tok !== audio?.tok) return;
    audio.phase = 'think'; showAudio();
    await sleep(audio.pause * 1000);
    if (tok !== audio?.tok) return;
    audio.phase = 'answer'; showAudio();
    await speak((c.type === 'q' ? `Respuesta ${'ABCDEFGH'[it.correcta]}: ` : 'Respuesta: ') + c.back, tok);
    if (audio.readExp) {
      await speak(it.explicacion, tok);
      await speak(it.truco && 'Truco: ' + it.truco, tok);
      await speak(myNote(c.key) && 'Tu nota: ' + myNote(c.key), tok);
    }
    await sleep(1200);
    if (tok !== audio?.tok) return;
    audio.i++;
    audio.phase = '';
  }
  if (audio && tok === audio.tok) stopAudio(true);
}
function pauseAudio() {
  audio.tok++; audio.playing = false; audio.phase = '';
  speechSynthesis.cancel();
  wakeLock?.release?.(); wakeLock = null;
  showAudio();
}
function jumpAudio(d) {
  const was = audio.playing;
  audio.tok++; speechSynthesis.cancel();
  audio.i = Math.max(0, Math.min(audio.cards.length - 1, audio.i + d));
  audio.phase = ''; audio.playing = false;
  if (was) playAudio(); else showAudio();
}
function stopAudio(finished) {
  if (audio) audio.tok++;
  speechSynthesis.cancel();
  wakeLock?.release?.(); wakeLock = null;
  onKey = null;
  if (!finished) { audio = null; return showHome(); }
  const n = audio.cards.length;
  audio = null;
  app.innerHTML = `<h1>🎧 Fin del audio</h1>
    <div class="card"><p>Has escuchado ${n} ${n === 1 ? 'tarjeta' : 'tarjetas'}.</p>
    <div class="row"><button class="primary" id="again">Otra sesión</button><button id="home">Inicio</button></div></div>`;
  $('again').onclick = () => showStudySetup('audio');
  $('home').onclick = () => showHome();
}

// ----- Verdadero / Falso -----
let vf = null;
function startVF(qs) {
  // Cada pregunta con una sola respuesta: la correcta (50 %) o una incorrecta al azar
  vf = {
    items: qs.map(q => {
      const truth = Math.random() < .5;
      const wrong = q.opciones.map((_, k) => k).filter(k => k !== q.correcta);
      return { q, shown: truth ? q.correcta : wrong[Math.floor(Math.random() * wrong.length)], truth };
    }),
    i: 0, ok: 0, streak: 0, bestStreak: 0, locked: false
  };
  showVF();
}

function showVF(flashState) {
  const it = vf.items[vf.i];
  if (!it) return showVFEnd();
  app.innerHTML = `
    <div class="topbar">
      <div><b>${vf.i + 1}</b><span class="muted"> / ${vf.items.length}</span> · ✔ ${vf.ok} · 🔥 ${vf.streak}</div>
      <button class="small" id="quit">Salir</button>
    </div>
    <div class="progress"><div style="width:${vf.i / vf.items.length * 100}%"></div></div>
    <div class="card vf-card ${flashState || ''}" id="vfCard">
      <div class="q">${esc(it.q.pregunta)}</div>
      <div class="vf-answer">${esc(it.q.opciones[it.shown])}</div>
      ${flashState === 'ko' ? `<div class="muted" style="margin-top:8px">${it.truth ? 'Sí era la correcta.' : `La correcta es: <b>${esc(it.q.opciones[it.q.correcta])}</b>`}</div>` : ''}
    </div>
    <div class="vf-btns">
      <button class="vf-no" id="vfNo">✗ Falso</button>
      <button class="vf-yes" id="vfYes">✓ Verdadero</button>
    </div>
    <p class="help" style="text-align:center">También puedes deslizar la tarjeta: → verdadero, ← falso</p>`;
  $('quit').onclick = () => showVFEnd();
  $('vfYes').onclick = () => answerVF(true);
  $('vfNo').onclick = () => answerVF(false);
  // Deslizar con el dedo
  const card = $('vfCard');
  let x0 = null;
  card.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  card.addEventListener('touchmove', e => {
    if (x0 !== null) card.style.transform = `translateX(${e.touches[0].clientX - x0}px) rotate(${(e.touches[0].clientX - x0) / 30}deg)`;
  }, { passive: true });
  card.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    x0 = null;
    card.style.transform = '';
    if (Math.abs(dx) > 70) answerVF(dx > 0);
  });
  onKey = e => {
    if (!$('vfCard')) return false;
    if (e.key === 'ArrowRight') answerVF(true);
    else if (e.key === 'ArrowLeft') answerVF(false);
  };
}

function answerVF(saysTrue) {
  if (vf.locked) return;
  const it = vf.items[vf.i], ok = saysTrue === it.truth;
  vf.locked = true;
  if (ok) { vf.ok++; vf.streak++; vf.bestStreak = Math.max(vf.bestStreak, vf.streak); } else vf.streak = 0;
  addDaily(1);
  showVF(ok ? 'ok' : 'ko');
  setTimeout(() => { vf.locked = false; vf.i++; showVF(); }, ok ? 500 : 1800);
}

function showVFEnd() {
  onKey = null;
  const done = vf.i, rec = load(K.vf, {});
  const newRecord = vf.bestStreak > (rec.best || 0);
  if (newRecord) save(K.vf, { ...rec, best: vf.bestStreak });
  app.innerHTML = `
    <h1>⚡ Resultado</h1>
    <div class="card">
      <div class="big">${vf.ok} / ${done}</div>
      <p>Mejor racha: <b>🔥 ${vf.bestStreak}</b>${newRecord ? ' · ¡nuevo récord! 🏆' : rec.best ? ` · récord ${rec.best}` : ''}</p>
      <div class="row"><button class="primary" id="again">Otra ronda</button><button id="home">Inicio</button></div>
    </div>`;
  $('again').onclick = () => showStudySetup('vf');
  $('home').onclick = () => showHome();
}

// ---------- Artículos: rellenar huecos ----------
const NUM_WORDS = 'un|una|uno|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|once|doce|trece|catorce|quince|dieciséis|diecisiete|dieciocho|diecinueve|veinte|veinticinco|treinta|cuarenta|cincuenta|sesenta|setenta|ochenta|noventa|cien|ciento|doscientos|trescientos|quinientos|mil';
const UNITS = 'días?(?:\\s+(?:hábiles|naturales))?|semanas?|meses|mes|años?|horas?|minutos?|veces';
const AUTO_RE = new RegExp(
  `\\d+(?:[.,]\\d+)*(?:\\s?%|\\s?por\\s?ciento|\\s+(?:${UNITS})\\b)?` +
  `|\\b(?:${NUM_WORDS})\\s+(?:${UNITS})\\b` +
  `|\\bmayoría\\s+(?:absoluta|simple|cualificada)\\b|\\b(?:dos|tres)\\s+(?:tercios|quintos|cuartos)\\b`, 'gi');

// Divide el texto en trozos de texto y huecos: {{marcados}} + (opcional) números/plazos + palabras al azar
function makeGaps(texto, auto, extraPct) {
  const segs = [];
  texto.split(/(\{\{[^}]+\}\})/).forEach(part => {
    const m = part.match(/^\{\{([^}]+)\}\}$/);
    if (m) return segs.push({ gap: m[1].trim() });
    if (!auto) return segs.push({ text: part });
    let last = 0;
    for (const mm of part.matchAll(AUTO_RE)) {
      // No tapar la numeración de apartados ("1.", "2)", "a)") al principio de línea
      if (/^\d+$/.test(mm[0]) && /(^|\n)\s*$/.test(part.slice(0, mm.index)) && /^[.)º]/.test(part.slice(mm.index + mm[0].length))) continue;
      if (mm.index > last) segs.push({ text: part.slice(last, mm.index) });
      segs.push({ gap: mm[0] });
      last = mm.index + mm[0].length;
    }
    if (last < part.length) segs.push({ text: part.slice(last) });
  });
  if (!extraPct) return segs;
  // Palabras al azar (de 5 letras o más) para memorizar el texto literal poco a poco
  return segs.flatMap(s => s.gap !== undefined ? [s] : s.text.split(/(\p{L}{5,})/u).map((w, k) =>
    k % 2 === 1 && Math.random() * 100 < extraPct ? { gap: w } : { text: w }));
}
const normAns = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\p{L}\p{N}%]+/gu, ' ').trim();

function showArticles() {
  stopTimer();
  onKey = null;
  const arts = articulosOf(), st = load(K.arts, {}), s = getSettings();
  app.innerHTML = `
    <div class="row between"><h1>📜 Artículos</h1><button id="home">← Inicio</button></div>
    <div class="card">
      <div class="modes">

        <label class="mode-card"><input type="radio" name="artNivel" value="dificil" ${artNivel() === 'dificil' ? 'checked' : ''}><span class="t">✍️ Difícil</span><span class="d">Las escribes tú de memoria</span></label>
      </div>
    </div>

      <p class="help" style="margin-top:0">Elige un artículo y rellena los huecos de memoria. Se tapan las palabras que marques entre {{dobles llaves}} al crearlo en el Editor${s.autoGaps ? ', y además los números y plazos' : ''}.</p>
      <label class="opt"><input type="checkbox" id="autoGaps" ${s.autoGaps ? 'checked' : ''}> Tapar automáticamente números y plazos (30 días, 1 mes, 3/5…)</label>

      <input type="range" id="extraGaps" min="0" max="100" step="10" value="${s.extraGaps}">

    <div class="card">

          ${a.tema ? `<span class="tag">${esc(a.tema)}</span>` : ''}${res !== undefined ? `<span class="muted">${res}%</span>` : ''}</button>`;

    </div>`;
  $('home').onclick = () => showHome();

// Nivel de los artículos: fácil (colocar las palabras que faltan) o difícil (escribirlas)
const artNivel = () => load(K.settings, {}).artNivel || 'facil';
function showArticle(idx) {
  const a = articulosOf()[idx], s = getSettings(), facil = artNivel() === 'facil';
  const segs = makeGaps(a.texto, s.autoGaps, s.extraGaps);
  const gaps = segs.filter(x => x.gap !== undefined);
  let k = 0;
  app.innerHTML = `
    <button id="back" class="small" style="margin-bottom:12px">← Artículos</button>
    <h1 style="font-size:1.3rem;margin-bottom:4px">${esc(a.titulo)}</h1>
    ${a.referencia ? `<p class="ref" style="margin:0 0 12px">📖 ${esc(a.referencia)}</p>` : ''}
    ${gaps.length && facil ? '<p class="help" style="margin:0 0 8px">🧩 Toca una palabra de abajo para colocarla en el hueco marcado. Toca un hueco relleno para quitar la palabra.</p>' : ''}
    <div class="card art-text">${gaps.length ? segs.map(x => x.gap === undefined ? esc(x.text) : facil
      ? `<button class="gap gap-slot" data-k="${k++}" style="min-width:${Math.max(4, x.gap.length + 1)}ch">&nbsp;</button>`
      : `<input class="gap" data-k="${k++}" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:${Math.max(4, x.gap.length + 2)}ch">`).join('') : esc(a.texto)}</div>
    ${gaps.length && facil ? `<div class="card bank" id="bank">${shuffle(gaps.map((g, i) => i)).map(i => `<button class="chip bank-w" data-w="${i}">${esc(gaps[i].gap)}</button>`).join('')}</div>` : ''}
    ${gaps.length ? `
    <div class="row">
      <button class="primary" id="check">Comprobar</button>
      <button id="reveal">Ver solución</button>
      <button id="redo">🔀 Otra versión</button>
    </div>
    <div id="artResult"></div>` : `<div class="ghstatus error">Este artículo no tiene huecos. Marca palabras con {{dobles llaves}} en el Editor, activa «Tapar números y plazos» o sube «palabras al azar».</div>`}`;
  $('back').onclick = () => showArticles();
  if (!gaps.length) return;
  const slots = [...app.querySelectorAll('.gap')];
  // valor de cada hueco: en fácil, la palabra colocada (índice en `puesto`); en difícil, lo escrito
  const puesto = slots.map(() => null);
  const valor = i => facil ? (puesto[i] === null ? '' : gaps[puesto[i]].gap) : slots[i].value;
  if (facil) {
    let activo = 0;
    const pinta = () => {
      slots.forEach((b, i) => { b.innerHTML = puesto[i] === null ? '&nbsp;' : esc(gaps[puesto[i]].gap); b.classList.toggle('active', i === activo); b.classList.toggle('filled', puesto[i] !== null); });
      app.querySelectorAll('.bank-w').forEach(c => { c.hidden = puesto.includes(+c.dataset.w); });
    };
    const siguienteVacio = desde => { const n = slots.length; for (let j = 0; j < n; j++) { const i = (desde + j) % n; if (puesto[i] === null) return i; } return -1; };
    slots.forEach((b, i) => b.onclick = () => {
      b.classList.remove('ok', 'ko'); b.nextElementSibling?.classList?.contains('gap-sol') && b.nextElementSibling.remove();
      if (puesto[i] !== null) puesto[i] = null; // devolver la palabra al banco
      activo = i; pinta();
    });
    app.querySelectorAll('.bank-w').forEach(c => c.onclick = () => {
      if (activo < 0 || puesto[activo] !== null) activo = siguienteVacio(0);
      if (activo < 0) return;
      puesto[activo] = +c.dataset.w;
      activo = siguienteVacio(activo + 1); pinta();
    });
    pinta();
  } else {
    slots.forEach((inp, i) => inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); (slots[i + 1] || $('check')).focus(); } });
    slots[0].focus();
  }
  $('check').onclick = () => {
    let ok = 0;
    slots.forEach((inp, i) => {
      const good = normAns(valor(i)) === normAns(gaps[i].gap);
      ok += good;
      inp.classList.toggle('ok', good);
      inp.classList.toggle('ko', !good);
      inp.title = good ? '' : 'Correcto: ' + gaps[i].gap;
      inp.nextElementSibling?.classList?.contains('gap-sol') && inp.nextElementSibling.remove();
      if (!good) inp.insertAdjacentHTML('afterend', `<span class="gap-sol">${esc(gaps[i].gap)}</span>`);
    });
    const p = pct(ok, gaps.length), st = load(K.arts, {}), prev = st[artKey(a)] || {};
    // el nivel fácil se apunta aparte: «Letra de la ley» solo cuenta los perfectos en difícil
    st[artKey(a)] = facil ? { ...prev, facilLast: p, facilBest: Math.max(p, prev.facilBest || 0), veces: (prev.veces || 0) + 1, fecha: Date.now() }
      : { ...prev, last: p, best: Math.max(p, prev.best || 0), veces: (prev.veces || 0) + 1, fecha: Date.now() };
    save(K.arts, st);
    addDaily(gaps.length);
    $('artResult').innerHTML = `<div class="ghstatus ${p === 100 ? 'ok' : ''}" style="margin-top:12px"><b>${ok} / ${gaps.length}</b> huecos (${p}%)${p === 100 ? (facil ? ' · ¡Perfecto! 🎉 Prueba ahora en ✍️ Difícil.' : ' · ¡Perfecto! 🎉 Prueba a subir «palabras al azar».') : ''}</div>`;
  };
  $('reveal').onclick = () => slots.forEach((inp, i) => {
    if (facil) { puesto[i] = i; inp.textContent = gaps[i].gap; app.querySelectorAll('.bank-w').forEach(c => c.hidden = true); }
    else inp.value = gaps[i].gap;
    inp.classList.remove('ko'); inp.classList.add('shown');
  });
  $('redo').onclick = () => showArticle(idx);
}

// ---------- Teclado: 1-4 / A-D responder, flechas para moverse ----------
document.addEventListener('keydown', e => {
  if (['TEXTAREA', 'INPUT', 'SELECT'].includes(e.target.tagName)) return;
  if (onKey && onKey(e) !== false) return;
  if (!run) return;
  const opts = [...app.querySelectorAll('.options button:not(:disabled)')];
  const k = e.key.toLowerCase();
  const idx = '1234'.includes(k) ? '1234'.indexOf(k) : 'abcd'.indexOf(k);
  if (opts.length && k.length === 1 && idx >= 0 && opts[idx]) return opts[idx].click();
  if (e.key === 'ArrowRight') $('next')?.click();
  if (e.key === 'ArrowLeft') $('prev')?.click();
});

// ---------- Temas: color + foto de fondo ----------
// Cada tema: [fondo, acento, acento 2, fondo de selección] en claro y en oscuro
const THEMES = {
  rosa:      { name: 'Rosa',      light: ['#ffe3ee', '#e64980', '#be4bdb', '#ffdeeb'], dark: ['#24121b', '#f783ac', '#e599f7', '#4a1f33'] },
  lila:      { name: 'Lila',      light: ['#f1e9ff', '#7950f2', '#be4bdb', '#ece2ff'], dark: ['#1b1526', '#9775fa', '#e599f7', '#2f2347'] },
  azul:      { name: 'Azul',      light: ['#f4f6fb', '#4263eb', '#7048e8', '#eef2ff'], dark: ['#111318', '#748ffc', '#9775fa', '#222a48'] },
  cielo:     { name: 'Cielo',     light: ['#e3f2fd', '#1c7ed6', '#4263eb', '#d0ebff'], dark: ['#0e1a26', '#4dabf7', '#748ffc', '#163552'] },
  menta:     { name: 'Menta',     light: ['#e3f9f0', '#0ca678', '#1098ad', '#d3f9e8'], dark: ['#0f1d18', '#38d9a9', '#3bc9db', '#133a2e'] },
  melocoton: { name: 'Melocotón', light: ['#ffeedd', '#f76707', '#f03e3e', '#ffe8cc'], dark: ['#22160e', '#ffa94d', '#ff8787', '#43291a'] },
};
const DEFAULT_THEME = { color: 'rosa', customBg: null, photo: 'gato', photoOp: 45 };
const getTheme = () => ({ ...DEFAULT_THEME, ...load(K.theme, {}) });
const darkMQ = matchMedia('(prefers-color-scheme: dark)');
const myPhoto = () => { try { return localStorage.getItem(K.photo); } catch { return null; } };

function applyTheme() {
  const t = getTheme(), dark = darkMQ.matches, root = document.documentElement.style;
  const [bg, accent, accent2, accentBg] = (THEMES[t.color] || THEMES.rosa)[dark ? 'dark' : 'light'];
  const finalBg = t.customBg && !dark ? t.customBg : bg; // el fondo a medida solo en modo claro
  root.setProperty('--bg', finalBg);
  root.setProperty('--accent', accent);
  root.setProperty('--accent-2', accent2);
  root.setProperty('--accent-bg', accentBg);
  const src = t.photo === 'gato' ? 'gato.jpg' : t.photo === 'mia' ? myPhoto() : null;
  root.setProperty('--photo', src ? `url("${src}")` : 'none');
  root.setProperty('--photo-pos', t.photo === 'gato' ? '42% 45%' : 'center'); // centra la carita del gatito en vertical
  root.setProperty('--photo-op', src ? t.photoOp / 100 : 0);
  document.body.classList.toggle('has-photo', !!src);
  document.querySelectorAll('meta[name=theme-color]').forEach(m => m.content = finalBg);
}
function saveTheme(patch) { save(K.theme, { ...getTheme(), ...patch }); applyTheme(); }
darkMQ.addEventListener?.('change', applyTheme);

// Reduce la foto antes de guardarla (localStorage tiene ~5 MB)
function resizeImage(file, max = 1600) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('No se pudo leer la imagen.')); };
    img.src = url;
  });
}

function showTheme() {
  stopTimer();
  const t = getTheme(), mine = myPhoto();
  app.innerHTML = `
    <div class="row between"><h1>Personalizar</h1><button id="home">← Inicio</button></div>
    <div class="card">
      <h2>Color</h2>
      <div class="swatches">${Object.entries(THEMES).map(([id, th]) => `
        <div><button class="swatch ${t.color === id ? 'on' : ''}" data-id="${id}" title="${th.name}"
          style="background:linear-gradient(135deg, ${th.light[0]} 50%, ${th.light[1]} 50%)"></button><div class="swatch-label">${th.name}</div></div>`).join('')}
        <div><input type="color" id="customBg" value="${t.customBg || THEMES[t.color].light[0]}" title="Elegir color de fondo"><div class="swatch-label">Fondo a medida</div></div>
      </div>
      <p class="muted">El tema cambia el fondo y los botones; «Fondo a medida» cambia solo el fondo${t.customBg ? ' (<a href="#" id="clearBg">quitar</a>)' : ''}.
        En modo oscuro se usa la versión oscura del tema.</p>
    </div>
    <div class="card">
      <h2>Foto de fondo</h2>
      <div class="photos">
        <button class="photo-tile ${t.photo === 'none' ? 'on' : ''}" data-photo="none"><span>Ninguna</span></button>
        <button class="photo-tile ${t.photo === 'gato' ? 'on' : ''}" data-photo="gato" style="background-image:url(gato.jpg)"><span>Gatito</span></button>
        <button class="photo-tile ${t.photo === 'mia' ? 'on' : ''}" data-photo="mia" ${mine ? `style="background-image:url('${mine}')"` : ''}><span>${mine ? 'Mi foto' : '📷 Subir foto'}</span></button>
      </div>
      <input type="file" id="photoFile" accept="image/*" hidden>
      ${mine ? '<p><button class="small" id="changePhoto">📷 Cambiar mi foto</button></p>' : ''}
      <p class="error" id="photoErr"></p>
      <label class="muted" for="op">Intensidad de la foto: <b id="opVal">${t.photoOp}%</b></label>
      <input type="range" id="op" min="10" max="100" step="5" value="${t.photoOp}" ${t.photo === 'none' ? 'disabled' : ''}>
    </div>
    <div class="card"><button id="resetTheme">↺ Restablecer (rosa con gatito)</button></div>`;

  $('home').onclick = () => showHome();
  app.querySelectorAll('.swatch').forEach(b => b.onclick = () => { saveTheme({ color: b.dataset.id, customBg: null }); showTheme(); });
  $('customBg').oninput = e => saveTheme({ customBg: e.target.value });
  $('customBg').onchange = () => showTheme();
  if ($('clearBg')) $('clearBg').onclick = e => { e.preventDefault(); saveTheme({ customBg: null }); showTheme(); };

  const file = $('photoFile');
  app.querySelectorAll('.photo-tile').forEach(b => b.onclick = () => {
    if (b.dataset.photo === 'mia' && !mine) return file.click();
    saveTheme({ photo: b.dataset.photo }); showTheme();
  });
  if ($('changePhoto')) $('changePhoto').onclick = () => file.click();
  file.onchange = async () => {
    if (!file.files[0]) return;
    try {
      const data = await resizeImage(file.files[0]);
      try { localStorage.setItem(K.photo, data); } catch { throw new Error('La foto es demasiado grande para guardarla. Prueba con otra.'); }
      saveTheme({ photo: 'mia' }); showTheme();
    } catch (e) { $('photoErr').textContent = e.message; }
  };
  $('op').oninput = e => { $('opVal').textContent = e.target.value + '%'; saveTheme({ photoOp: +e.target.value }); };
  $('resetTheme').onclick = () => { localStorage.removeItem(K.theme); applyTheme(); showTheme(); };
}

// ---------- Avisos (agua, pomodoro) ----------
function showToast(icon, title, text, kind = '') {
  let box = $('toasts');
  if (!box) { box = Object.assign(document.createElement('div'), { id: 'toasts' }); document.body.appendChild(box); }
  const t = document.createElement('div');
  t.className = 'toast ' + kind;
  t.setAttribute('role', 'status');
  t.innerHTML = `<span class="ico">${icon}</span><div class="msg"><b>${esc(title)}</b><div class="muted">${esc(text)}</div></div><button class="small">Vale</button>`;
  t.querySelector('button').onclick = () => t.remove();
  box.appendChild(t);
  navigator.vibrate?.(200);
}

// Agua: cada N minutos de uso (solo cuenta con la app visible y el aviso cerrado)
let waterSecs = load(K.water, 0);
function showWaterToast() {
  const s = getSettings();
  showToast('💧', '¡Hora de beber agua!', s.waterMsg.trim() || waterDefaultMsg(s.waterMin), 'water');
}
function waterDefaultMsg(min) { return `Llevas ${min} ${min === 1 ? 'minuto' : 'minutos'} estudiando. Hidrátate un poco.`; }
function waterTick() {
  const s = getSettings();
  if (!s.water || document.querySelector('.toast.water')) return;
  waterSecs++;
  if (waterSecs % 5 === 0) save(K.water, waterSecs);
  if (waterSecs >= s.waterMin * 60) {
    waterSecs = 0; save(K.water, 0);
    showWaterToast();
  }
}

// Pomodoro: el tiempo se calcula con la hora de fin, así sigue contando aunque cierres la app
const getPomo = () => load(K.pomo, { phase: 'work', running: false, endsAt: 0, remaining: null });
const pomoDur = phase => (phase === 'work' ? getSettings().pomoWork : getSettings().pomoBreak) * 60;
const pomoLeft = p => p.running ? Math.max(0, Math.round((p.endsAt - Date.now()) / 1000)) : (p.remaining ?? pomoDur(p.phase));

function renderPomo() {
  let el = $('pomo');
  if (!getSettings().pomoOn) { el?.remove(); $('pomoPanel')?.remove(); return; }
  if (!el) {
    el = Object.assign(document.createElement('button'), { id: 'pomo', className: 'pomo-pill', title: 'Pomodoro' });
    el.onclick = togglePomoPanel;
    document.body.appendChild(el);
  }
  const p = getPomo();
  el.textContent = `${p.phase === 'work' ? '🍅' : '☕'} ${fmtTime(pomoLeft(p))}${p.running ? '' : ' ⏸'}`;
  el.classList.toggle('break', p.phase === 'break');
}

function pomoTick() {
  if (!getSettings().pomoOn) return;
  const p = getPomo();
  if (p.running && Date.now() >= p.endsAt) {
    const next = p.phase === 'work' ? 'break' : 'work', s = getSettings();
    save(K.pomo, { phase: next, running: true, endsAt: Date.now() + pomoDur(next) * 1000, remaining: null });
    if (next === 'break') showToast('☕', '¡Descanso!', `Tómate ${s.pomoBreak} minutos: levántate y estira.`, 'pomo');
    else showToast('🍅', '¡A estudiar!', `Empieza un bloque de ${s.pomoWork} minutos.`, 'pomo');
  }
  renderPomo();
}

function togglePomoPanel() {
  if ($('pomoPanel')) return $('pomoPanel').remove();
  const p = getPomo(), panel = Object.assign(document.createElement('div'), { id: 'pomoPanel', className: 'pomo-panel' });
  panel.innerHTML = `<b>${p.phase === 'work' ? '🍅 Estudio' : '☕ Descanso'}</b>
    <div class="row"><button class="small primary" data-a="toggle">${p.running ? '⏸ Pausar' : '▶ Iniciar'}</button>
    <button class="small" data-a="reset">↺ Reiniciar</button><button class="small" data-a="skip">⏭ Saltar</button></div>`;
  panel.onclick = e => {
    const a = e.target.closest('button')?.dataset.a;
    if (!a) return;
    const p = getPomo();
    if (a === 'toggle') save(K.pomo, p.running ? { ...p, running: false, remaining: pomoLeft(p) } : { ...p, running: true, endsAt: Date.now() + pomoLeft(p) * 1000 });
    if (a === 'reset') save(K.pomo, { phase: 'work', running: false, endsAt: 0, remaining: null });
    if (a === 'skip') { const next = p.phase === 'work' ? 'break' : 'work'; save(K.pomo, { phase: next, running: p.running, endsAt: Date.now() + pomoDur(next) * 1000, remaining: null }); }
    panel.remove();
    renderPomo();
  };
  document.body.appendChild(panel);
}

setInterval(() => {
  pomoTick();
  if (document.visibilityState === 'visible') waterTick();
}, 1000);

// En desarrollo, cada test o sesión de estudio empieza tras aceptar el aviso
